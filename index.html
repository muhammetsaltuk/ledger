   =============================================================== */

const AYLAR = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran",
               "Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];

const $etkinlik = document.getElementById("b-etkinlik");
let etkinlikTaslak = null;    // model eksik bıraktıysa kullanıcı tamamlar
let etkinlikMesaj  = "";
let etkinlikAcik   = false;

function tarihYaz(t){
  if(!t) return "";
  const p = t.split("-").map(Number);
  return p[2] + " " + AYLAR[p[1]-1];
}

function etkinlikKaydet(e){
  const kayit = {
    id: yeniId(),
    tarih: e.tarih,
    saat: e.saat || "",
    sure: e.sure || 0,
    baslik: e.baslik
  };
  UYG.veri.etkinlikler.push(kayit);
  // Geçmiş etkinlikler birikmesin.
  const sinir = gunKaydir(uygulamaGunu(), -30);
  UYG.veri.etkinlikler = UYG.veri.etkinlikler.filter(x => x.tarih >= sinir);

  // Bugüne düşen etkinlik doğrudan bugünün planına girer (§7).
  if(kayit.tarih === uygulamaGunu()){
    const g = gunKaydi(kayit.tarih);
    g.maddeler.push({
      id: yeniId(), saat: kayit.saat, sure: kayit.sure || null,
      baslik: kayit.baslik, tur: "etkinlik", gerekce: "",
      yapildi: false, not: "", etkinlikId: kayit.id
    });
  }
  kaydet();
  etkinlikCiz();
  planCiz();
  return kayit;
}

function etkinlikSil(id){
  UYG.veri.etkinlikler = UYG.veri.etkinlikler.filter(e => e.id !== id);
  for(const t of Object.keys(UYG.veri.gunler)){
    const g = UYG.veri.gunler[t];
    if(g.maddeler) g.maddeler = g.maddeler.filter(m => m.etkinlikId !== id);
  }
  kaydet();
  etkinlikCiz();
  planCiz();
}

/* Serbest metni api/parse.js ile çevirir. Model emin değilse alanı boş
   bırakır ve kullanıcı doldurur; tahmin ettirilmez (§7). */
async function etkinlikCozumle(metin){
  etkinlikMesaj = "";
  etkinlikAcik  = true;
  const bugun = uygulamaGunu();

  if(UYG.veri.ayar.yapayZeka === false){
    etkinlikTaslak = { tarih:"", saat:"", sure:0, baslik:metin.slice(0,80) };
    etkinlikMesaj  = "Yapay zeka kapalı; tarihi ve saati elle gir.";
    etkinlikCiz();
    return;
  }

  UYG.etkinlikCozuluyor = true;
  etkinlikCiz();
  try{
    const cevap = await fetch("api/parse", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ metin: metin, bugun: bugun })
    });
    if(!cevap.ok){
      const h = await cevap.json().catch(() => ({}));
      if(h.hata === "anahtar-yok"){
        UYG.veri.ayar.yapayZeka = false; kaydet();
        throw new Error("anahtar-yok");
      }
      const hata = new Error(h.mesaj || "Etkinlik çözümlenemedi."); hata.kullaniciya = true; throw hata;
    }
    const e = await cevap.json();

    if(e.tarih && e.baslik){
      etkinlikKaydet(e);
      etkinlikTaslak = null;
      etkinlikAcik = false;
      etkinlikMesaj = "";
    }else{
      etkinlikTaslak = { tarih:e.tarih||"", saat:e.saat||"", sure:e.sure||0,
                         baslik:e.baslik || metin.slice(0,80) };
      etkinlikMesaj = "Eksik kalan yeri doldur.";
    }
  }catch(err){
    console.warn("etkinlik çözümlenemedi", err);
    etkinlikTaslak = { tarih:"", saat:"", sure:0, baslik:metin.slice(0,80) };
    etkinlikMesaj = err.message === "anahtar-yok"
      ? "Yapay zeka kapalı; tarihi ve saati elle gir."
      : (err.kullaniciya ? err.message : "Çözümlenemedi; elle gir.");
  }finally{
    UYG.etkinlikCozuluyor = false;
    etkinlikCiz();
  }
}

function etkinlikCiz(){
  const bugun = uygulamaGunu();
  const liste = yaklasanEtkinlikler(bugun);

  // Etkinlik yoksa ve giriş kapalıysa bölüm hiç görünmez (§3).
  if(!liste.length && !etkinlikAcik){
    $etkinlik.hidden = true;
    $etkinlik.innerHTML = "";
    return;
  }
  $etkinlik.hidden = false;

  const satirlar = liste.map(e =>
    '<li>' +
      '<span class="e-tarih">' + tarihYaz(e.tarih) + (e.saat ? " · " + e.saat : "") + '</span>' +
      '<span class="e-ad">' + kacir(e.baslik) + '</span>' +
      '<button class="dg dg-sonuk" data-esil="' + e.id + '">sil</button>' +
    '</li>').join("");

  const taslak = etkinlikTaslak
    ? '<div class="e-taslak">' +
        '<input type="date" id="e-tarih" value="' + kacir(etkinlikTaslak.tarih) + '" aria-label="tarih">' +
        '<input type="time" id="e-saat" value="' + kacir(etkinlikTaslak.saat) + '" aria-label="saat">' +
        '<input type="text" id="e-ad" value="' + kacir(etkinlikTaslak.baslik) + '" aria-label="etkinlik" placeholder="ne">' +
        '<button class="dg" id="e-onay">kaydet</button>' +
        '<button class="dg dg-sonuk" id="e-vazgec">vazgeç</button>' +
      '</div>'
    : etkinlikAcik
      ? '<div class="e-giris">' +
          '<input type="text" id="e-metin" placeholder="12 Eylül saat 14\'te berber randevum var" ' +
            'autocomplete="off" aria-label="etkinlik">' +
          '<button class="dg" id="e-coz"' + (UYG.etkinlikCozuluyor ? " disabled" : "") + '>' +
            (UYG.etkinlikCozuluyor ? "çözülüyor…" : "ekle") + '</button>' +
        '</div>'
      : "";

  $etkinlik.innerHTML =
    '<h2 class="bolum-bas">Yaklaşan</h2>' +
    (liste.length ? '<ul class="etkinlik-liste">' + satirlar + '</ul>' : "") +
    taslak +
    (etkinlikMesaj ? '<p class="sonuk" style="margin:8px 0 0">' + kacir(etkinlikMesaj) + '</p>' : "");
}

$etkinlik.addEventListener("click", e => {
  const d = e.target.closest("button");
  if(!d) return;
  if(d.dataset.esil) etkinlikSil(d.dataset.esil);
  else if(d.id === "e-coz") etkinlikGirisGonder();
  else if(d.id === "e-onay") etkinlikTaslakKaydet();
  else if(d.id === "e-vazgec"){
    etkinlikTaslak = null; etkinlikAcik = false; etkinlikMesaj = ""; etkinlikCiz();
  }
});
$etkinlik.addEventListener("keydown", e => {
  if(e.key !== "Enter") return;
  if(e.target.id === "e-metin"){ e.preventDefault(); etkinlikGirisGonder(); }
  else if(e.target.id === "e-ad" || e.target.id === "e-tarih" || e.target.id === "e-saat"){
    e.preventDefault(); etkinlikTaslakKaydet();
  }
});

function etkinlikGirisGonder(){
  const alan = document.getElementById("e-metin");
  if(!alan || !alan.value.trim()) return;
  etkinlikCozumle(alan.value.trim());
}
function etkinlikTaslakKaydet(){
  const t = document.getElementById("e-tarih");
  const s = document.getElementById("e-saat");
  const a = document.getElementById("e-ad");
  if(!t || !a) return;
  if(!t.value || !a.value.trim()){
    etkinlikMesaj = "Tarih ve ad gerekli.";
    etkinlikCiz();
    return;
  }
  etkinlikKaydet({ tarih:t.value, saat:s ? s.value : "", sure:etkinlikTaslak.sure,
                   baslik:a.value.trim() });
  etkinlikTaslak = null;
  etkinlikAcik = false;
  etkinlikMesaj = "";
  etkinlikCiz();
}
function etkinlikGirisAc(){
  etkinlikAcik = true;
  etkinlikTaslak = null;
  etkinlikMesaj = "";
  etkinlikCiz();
  const alan = document.getElementById("e-metin");
  if(alan) alan.focus();
}

/* ===============================================================
   §11 — Su takibi
   =============================================================== */

const BARDAK    = 250;                       // ml
const SU_HEDEFI = 10;                        // 2,5 litre

const $su = document.getElementById("b-su");

function suDegistir(delta){
  const g = gunKaydi(uygulamaGunu());
  g.su = Math.max(0, Math.min(SU_HEDEFI, (g.su || 0) + delta));
  kaydet();
  suCiz();
}

/* Şerit bir kez kurulur, sonra yerinde güncellenir. Her dokunuşta yeniden
   çizersek düğme düğümü yok olur: hızlı dokunuşlar kaybolur, klavye odağı düşer. */
function suCiz(){
  const adet = gunKaydi(uygulamaGunu()).su || 0;

  if(!document.getElementById("su-serit")){
    let serit = "";
    for(let i = 0; i < SU_HEDEFI; i++) serit += "<i></i>";
    // Hedefe ulaşınca kutlama yok; şerit dolar, o kadar (§11).
    $su.innerHTML =
      '<div class="su-satir">' +
        '<span class="su-etiket">Su</span>' +
        '<button class="su-serit" id="su-serit">' + serit + '</button>' +
        '<span class="su-sayi" id="su-sayi"></span>' +
      '</div>';
  }

  const serit = document.getElementById("su-serit");
  const kutu  = serit.querySelectorAll("i");
  for(let i = 0; i < kutu.length; i++) kutu[i].className = i < adet ? "dolu" : "";
  serit.setAttribute("aria-label",
    "Su: " + adet + " bardak. Dokun bir bardak ekle, uzun bas geri al.");
  document.getElementById("su-sayi").textContent =
    (adet * BARDAK / 1000).toFixed(2).replace(".", ",") + " L";

  gunlukCiz();
}

/* Dokun: bir bardak ekle. Uzun bas: geri al. Klavyede geri almak için
   odaktayken sol ok veya geri silme — §13 klavye erişimi. */
(function suOlaylari(){
  let zaman = null, uzunOldu = false;
  const seritMi = e => e.target.closest("#su-serit");
  const birak   = () => { clearTimeout(zaman); zaman = null; };

  $su.addEventListener("pointerdown", e => {
    if(!seritMi(e)) return;
    uzunOldu = false;
    zaman = setTimeout(() => { uzunOldu = true; suDegistir(-1); }, 500);
  });
  $su.addEventListener("pointerup", e => {
    if(!seritMi(e)) return;
    birak();
    if(!uzunOldu) suDegistir(+1);
  });
  $su.addEventListener("pointerleave", birak);
  $su.addEventListener("pointercancel", birak);
  $su.addEventListener("contextmenu", e => { if(seritMi(e)) e.preventDefault(); });

  // Klavye: Enter/Boşluk ekler (detail 0 = fareyle değil), sol ok / geri silme azaltır.
  $su.addEventListener("click", e => { if(seritMi(e) && e.detail === 0) suDegistir(+1); });
  $su.addEventListener("keydown", e => {
    if(!seritMi(e)) return;
    if(e.key === "ArrowLeft" || e.key === "Backspace"){ e.preventDefault(); suDegistir(-1); }
  });
})();

/* ===============================================================
   §6 — Günlük plan (yapay zeka olmadan çalışan kısmı)
   =============================================================== */

const TURLER = ["uyku","spor","yemek","kod","kitap","ingilizce","kurs",
                "etkinlik","namaz","ev","bos"];

const $plan = document.getElementById("b-plan");
let acikNot = null;                          // not alanı açık olan maddenin id'si
let dunSoruAcik = false;                     // "dün nasıl geçti" kutusu açık mı
let dunSoruldu = null;                       // hangi uygulama günü için soruldu/geçildi

function yeniId(){
  return "m" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
}
function saatSirala(maddeler){
  // Saatsiz maddeler sona: boş dize aksi halde 08:00'in önüne geçer.
  return maddeler.slice().sort((a,b) => (a.saat || "99:99").localeCompare(b.saat || "99:99"));
}
function maddeBul(id){
  const g = gunKaydi(uygulamaGunu());
  return (g.maddeler || []).find(m => m.id === id);
}

/* --- Değişiklikler -------------------------------------------- */
function maddeEkle(saat, baslik, tur){
  const g = gunKaydi(uygulamaGunu());
  g.maddeler.push({
    id: yeniId(),
    saat: saat || "",
    sure: null,
    baslik: String(baslik || "").trim(),
    tur: TURLER.indexOf(tur) === -1 ? "bos" : tur,
    gerekce: "",
    yapildi: false,
    not: "",
    elle: true
  });
  kaydet();
  planCiz();
}
function maddeSil(id){
  const g = gunKaydi(uygulamaGunu());
  g.maddeler = g.maddeler.filter(m => m.id !== id);
  if(acikNot === id) acikNot = null;
  kaydet();
  planCiz();
}
function maddeIsaretle(id){
  const m = maddeBul(id);
  if(!m) return;
  m.yapildi = !m.yapildi;
  kaydet();
  planCiz();
}
function maddeNot(id, metin){
  const m = maddeBul(id);
  if(!m) return;
  m.not = String(metin || "").trim();
  kaydet();
}

/* §6 — Ağ yoksa veya model cevap vermezse son planı kopyala, tarihi güncelle.
   Boş ekran gösterme. */
function sonPlanliGun(bugun){
  const gunler = Object.keys(UYG.veri.gunler)
    .filter(t => t < bugun && UYG.veri.gunler[t].maddeler && UYG.veri.gunler[t].maddeler.length)
    .sort();
  return gunler.length ? gunler[gunler.length - 1] : null;
}
function planKopyala(){
  const bugun = uygulamaGunu();
  const kaynak = sonPlanliGun(bugun);
  if(!kaynak) return false;
  const g = gunKaydi(bugun);
  g.maddeler = UYG.veri.gunler[kaynak].maddeler.map(m => ({
    id: yeniId(),
    saat: m.saat, sure: m.sure, baslik: m.baslik, tur: m.tur,
    gerekce: "", yapildi: false, not: "", kopya: kaynak
  }));
  g.gununNotu = "";
  g.planKaynak = "kopya";
  kaydet();
  return true;
}

/* --- Çizim ---------------------------------------------------- */
function planCiz(){
  const bugun = uygulamaGunu();
  const g = gunKaydi(bugun);
  const maddeler = saatSirala(g.maddeler || []);

  const satirlar = maddeler.map(m => {
    const acik = acikNot === m.id;
    const sure = m.sure ? '<span class="p-sure">' + m.sure + ' dk</span>' : "";
    const ger  = m.gerekce ? '<span class="p-gerekce">' + kacir(m.gerekce) + '</span>' : "";

    return '<li class="' + (m.yapildi ? "yapildi" : "") + '">' +
      '<button class="p-isaret" data-yap="' + m.id + '" aria-pressed="' + (m.yapildi ? "true" : "false") +
        '" aria-label="' + kacir(m.baslik) + ' — işaretle"><span class="nokta"></span></button>' +
      '<span class="p-saat">' + kacir(m.saat || "") + '</span>' +
      '<button class="p-govde" data-ac="' + m.id + '" aria-expanded="' + (acik ? "true" : "false") + '">' +
        '<span class="p-baslik"><span class="p-metin">' + kacir(m.baslik) + '</span>' + sure + '</span>' + ger +
      '</button>' +
      (acik
        ? '<div class="p-not">' +
            '<input type="text" data-not="' + m.id + '" value="' + kacir(m.not || "") + '" ' +
              'placeholder="not: nasıl geçti?" autocomplete="off">' +
            '<button class="dg dg-sonuk" data-sor="' + m.id + '">sor</button>' +
            '<button class="dg dg-sonuk" data-sil="' + m.id + '">sil</button>' +
          '</div>'
        : (m.not ? '<span class="p-notozet">' + kacir(m.not) + '</span>' : "")) +
    '</li>';
  }).join("");

  const gununNotu = g.gununNotu
    ? '<p class="sonuk" style="margin:0 0 14px">' + kacir(g.gununNotu) + '</p>' : "";

  const kaynak = g.planKaynak === "kopya" ? "dünün planından"
               : g.planKaynak === "model" ? "" : "";
  const hak = planHakki(bugun);

  $plan.innerHTML =
    '<h2 class="bolum-bas">Bugün' +
      (kaynak ? '<span class="yan">' + kaynak + '</span>' : "") +
    '</h2>' +
    gununNotu +
    (UYG.planUretiliyor
      ? '<p class="plan-bos">Plan üretiliyor…</p>'
      : maddeler.length
        ? '<ul class="ray plan-liste">' + satirlar + '</ul>'
        : '<p class="plan-bos">Bugün için madde yok.</p>') +
    '<div class="plan-ekle">' +
      '<input type="time" id="p-saat" aria-label="saat">' +
      '<input type="text" id="p-baslik" aria-label="madde" placeholder="madde ekle" autocomplete="off">' +
      '<button class="dg" id="p-ekle">ekle</button>' +
    '</div>' +
    (dunSoruAcik
      ? '<div class="dun-soru">' +
          '<p class="sonuk" style="margin:0 0 8px">Dün nasıl geçti? Bir cümle — ' +
            'yarının planı buna göre ayarlanır.</p>' +
          '<div class="plan-ekle">' +
            '<input type="text" id="p-dun" placeholder="ör. akşam çok yoruldum, kod bloğunu bitiremedim" ' +
              'autocomplete="off" aria-label="dün nasıl geçti">' +
            '<button class="dg dg-bir" id="p-dun-uret">üret</button>' +
          '</div>' +
          '<button class="dg dg-sonuk" id="p-dun-gec" style="margin-top:8px">bu adımı geç</button>' +
        '</div>'
      : '') +
    '<div class="plan-alt">' +
      '<button class="dg ' + (maddeler.length ? "dg-sonuk" : "dg-bir") + '" id="p-uret"' +
        (UYG.planUretiliyor || hak <= 0 ? " disabled" : "") + '>' +
        (UYG.planUretiliyor ? "üretiliyor…"
          : dunSoruAcik ? "vazgeç"
          : maddeler.length ? "planı yeniden üret" : "plan üret") +
      '</button>' +
      '<button class="dg dg-sonuk" id="p-etkinlik">etkinlik ekle</button>' +
      (hak < PLAN_SINIR && hak > 0 ? '<span class="sonuk">' + hak + ' hak kaldı</span>' : "") +
      (planMesaj ? '<span class="sonuk">' + kacir(planMesaj) + '</span>' : "") +
    '</div>';

  gunlukCiz();
}

/* --- Olaylar -------------------------------------------------- */
$plan.addEventListener("click", e => {
  const d = e.target.closest("button");
  if(!d) return;
  if(d.dataset.yap) maddeIsaretle(d.dataset.yap);
  else if(d.dataset.sil) maddeSil(d.dataset.sil);
  else if(d.dataset.sor) maddeSor(d.dataset.sor);
  else if(d.dataset.ac){
    acikNot = (acikNot === d.dataset.ac) ? null : d.dataset.ac;
    planCiz();
    const alan = $plan.querySelector("[data-not]");
    if(alan) alan.focus();
  }
  else if(d.id === "p-ekle") planEkleGonder();
  else if(d.id === "p-uret") planUreteBasla();
  else if(d.id === "p-dun-uret"){
    const alan = document.getElementById("p-dun");
    planUret(true, alan ? alan.value : "");
  }
  else if(d.id === "p-dun-gec") planUret(true, "");
  else if(d.id === "p-etkinlik") etkinlikGirisAc();
});

$plan.addEventListener("change", e => {
  if(e.target.dataset && e.target.dataset.not) maddeNot(e.target.dataset.not, e.target.value);
});
$plan.addEventListener("keydown", e => {
  if(e.key !== "Enter") return;
  if(e.target.dataset && e.target.dataset.not){
    maddeNot(e.target.dataset.not, e.target.value);
    acikNot = null;
    planCiz();
  }else if(e.target.id === "p-baslik" || e.target.id === "p-saat"){
    e.preventDefault();
    planEkleGonder();
  }else if(e.target.id === "p-dun"){
    e.preventDefault();
    planUret(true, e.target.value);
  }
});

function planEkleGonder(){
  const saat   = document.getElementById("p-saat");
  const baslik = document.getElementById("p-baslik");
  if(!baslik || !baslik.value.trim()) return;
  maddeEkle(saat ? saat.value : "", baslik.value);
  const yeni = document.getElementById("p-baslik");
  if(yeni) yeni.focus();
}

/* ===============================================================
   §6 + §12 — plan üretimi (api/plan.js)
   =============================================================== */

/* §1 — kurs saatleri sabittir. 0 pazar … 6 cumartesi. */
const KURS = {
  1: { bas:"18:00", bit:"22:00" },   // pazartesi
  2: { bas:"19:00", bit:"22:00" },   // salı
  3: { bas:"18:00", bit:"22:00" },   // çarşamba
  4: { bas:"19:00", bit:"22:00" }    // perşembe
};
const GUN_ADI = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];

function gunNesnesi(tarih){
  const p = tarih.split("-").map(Number);
  return new Date(p[0], p[1]-1, p[2]);
}
function kursSaati(tarih){ return KURS[gunNesnesi(tarih).getDay()] || null; }
function gunAdi(tarih){ return GUN_ADI[gunNesnesi(tarih).getDay()]; }

/* §9 — kısa vadeli katman: son 14 günün ham kaydı, notlarıyla birlikte. */
function son14Gun(bugun){
  const liste = [];
  for(let i = 14; i >= 1; i--){
    const t = gunKaydir(bugun, -i);
    const g = UYG.veri.gunler[t];
    if(!g) continue;
    const namaz = Object.keys(g.namaz || {}).map(k => k + ":" + g.namaz[k]).join(" ");
    liste.push({
      tarih: t,
      gunAdi: gunAdi(t),
      namaz: namaz || "işaretlenmemiş",
      su: g.su || 0,
      maddeler: (g.maddeler || []).map(m => ({
        saat: m.saat, baslik: m.baslik, yapildi: !!m.yapildi, not: m.not || ""
      })),
      gununNotu: g.gununNotu || "",                 // modelin o günkü plan şekli notu
      degerlendirme: g.degerlendirme || "",         // gün sonu değerlendirmesi (§12)
      kullaniciNotu: g.kullaniciNotu || ""          // "dün nasıl geçti" tek cümle
    });
  }
  return liste;
}

/* §7 — bugünden itibaren yaklaşan etkinlikler. */
function yaklasanEtkinlikler(bugun){
  return (UYG.veri.etkinlikler || [])
    .filter(e => e && e.tarih >= bugun)
    .sort((a,b) => (a.tarih + (a.saat||"")).localeCompare(b.tarih + (b.saat||"")))
    .slice(0, 10);
}

function bugununVakitleri(){
  const d = UYG.namaz && UYG.namaz.liste;
  if(!d) return null;
  const o = {};
  d.forEach(v => { o[v.ad] = ss(v.bas) + "–" + ss(v.bit); });
  return o;
}

/* §12 — aynı gün için plan üretimi günde en fazla üç kez.
   Sunucu durumsuz olduğu için sayaç istemcide tutulur. */
const PLAN_SINIR = 3;
function planHakki(tarih){
  const s = UYG.veri.ayar.planSayaci || {};
  return PLAN_SINIR - (s[tarih] || 0);
}
function planHakkiDus(tarih){
  const s = UYG.veri.ayar.planSayaci || (UYG.veri.ayar.planSayaci = {});
  s[tarih] = (s[tarih] || 0) + 1;
  for(const k of Object.keys(s)) if(k < gunKaydir(tarih, -7)) delete s[k];
}

let planMesaj = "";

/* Dün bir plan vardı ama ne değerlendirme ne de tek cümlelik not girildiyse,
   "plan üret"e basınca önce "dün nasıl geçti?" diye sorulur (§6). */
function dunUyumSorulsun(){
  if(dunSoruldu === uygulamaGunu()) return false;   // bugün bir kez soruldu/geçildi
  const dg = gunKaydir(uygulamaGunu(), -1);
  const g = UYG.veri.gunler[dg];
  return !!(g && g.maddeler && g.maddeler.length && !g.degerlendirme && !g.kullaniciNotu);
}

/* "plan üret" düğmesinin girişi: gerekiyorsa önce dünü sor, yoksa doğrudan üret. */
function planUreteBasla(){
  if(dunSoruAcik){ dunSoruAcik = false; planCiz(); return; }
  if(dunUyumSorulsun()){
    dunSoruAcik = true;
    planCiz();
    const alan = document.getElementById("p-dun");
    if(alan) alan.focus();
    return;
  }
  planUret(true);
}

async function planUret(elle, dun){
  const tarih = uygulamaGunu();
  if(planHakki(tarih) <= 0){
    planMesaj = "Bugün için plan üretme hakkı doldu (günde " + PLAN_SINIR + " kez).";
    dunSoruAcik = false;
    planCiz();
    return false;
  }

  // "Dün nasıl geçti" cümlesi geldiyse dünün kaydına yaz — tekrar sorulmasın,
  // sonraki plan istekleri de görsün.
  const cumle = String(dun || "").trim();
  if(cumle){
    const dg = gunKaydir(tarih, -1);
    if(UYG.veri.gunler[dg]){ UYG.veri.gunler[dg].kullaniciNotu = cumle.slice(0, 300); kaydet(); }
  }

  dunSoruAcik = false;
  if(elle) dunSoruldu = tarih;                 // bugün için tekrar sorma
  UYG.planUretiliyor = true;
  planMesaj = "";
  planCiz();

  try{
    const cevap = await fetch("api/plan", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        tarih: tarih,
        gunAdi: gunAdi(tarih),
        kurs: kursSaati(tarih),
        vakitler: bugununVakitleri(),
        etkinlikler: yaklasanEtkinlikler(tarih),
        profil: UYG.veri.profil || "",
        son14: son14Gun(tarih),
        borc: UYG.veri.borc,
        dun: cumle
      })
    });

    if(!cevap.ok){
      const h = await cevap.json().catch(() => ({}));
      if(h.hata === "anahtar-yok"){                 // §12 — anahtar tanımlı değil
        UYG.veri.ayar.yapayZeka = false;
        kaydet();
        throw new Error("anahtar-yok");
      }
      const hata = new Error(h.mesaj || "Plan üretilemedi.");
      hata.kullaniciya = true;                      // sunucunun kendi cümlesi
      throw hata;
    }

    const plan = await cevap.json();
    planHakkiDus(tarih);

    const g = gunKaydi(tarih);
    g.maddeler = (plan.maddeler || []).map(m => ({
      id: yeniId(),
      saat: m.saat || "", sure: m.sure || null,
      baslik: m.baslik, tur: m.tur || "bos", gerekce: m.gerekce || "",
      yapildi: false, not: ""
    }));
    g.gununNotu = plan.gununNotu || "";
    g.planKaynak = "model";
    UYG.veri.ayar.yapayZeka = true;
    kaydet();
    return true;

  }catch(e){
    console.warn("plan üretilemedi", e);

    // Nedeni her durumda koru: yedeğe düşerken kota/anahtar mesajını yutmayalım.
    const neden = e.message === "anahtar-yok"
      ? "Yapay zeka kapalı (GEMINI_API_KEY tanımlı değil)."
      : (e.kullaniciya ? e.message : "Plan üretilemedi.");

    // Ağ yoksa veya model cevap vermezse son planı kopyala; boş ekran yok (§6).
    const g = gunKaydi(tarih);
    if(!g.maddeler || !g.maddeler.length){
      planMesaj = planKopyala()
        ? neden + " Dünün planı kopyalandı."
        : neden + " Maddeleri elle ekleyebilirsin.";
    }else if(elle){
      planMesaj = neden;
    }
    return false;

  }finally{
    UYG.planUretiliyor = false;
    planCiz();
  }
}

function planHazirla(){
  const tarih = uygulamaGunu();
  const g = gunKaydi(tarih);
  planCiz();
  if(g.maddeler && g.maddeler.length) return;       // bugünün planı zaten var
  if(UYG.veri.ayar.yapayZeka === false){            // anahtar yok, denemeyelim
    if(planKopyala()) planMesaj = "Dünün planı kopyalandı.";
    planCiz();
    return;
  }
  planUret(false);
}

/* ===============================================================
   §13 (v2) — İstatistik / Seri görünümü
   Ay takvimi, son 7 gün başarısı, vakit bazında oran, rozetler.
   Hepsi mevcut gün kayıtlarından türetilir; yeni durum tutulmaz.
   =============================================================== */

const $istatistik = document.getElementById("b-istatistik");

/* Rozet: kilit ikonu (kilitli) ya da madalya (açık). */
const RZ_KILIT =
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
  'stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect>' +
  '<path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>';
const RZ_ACIK =
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
  'stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="14" r="6"></circle>' +
  '<path d="M9 9 6.5 3h11L15 9"></path></svg>';

function istatistikCiz(){
  if(!UYG.veri) return;
  const bugun = uygulamaGunu();
  const p = bugun.split("-").map(Number);
  const yil = p[0], ay = p[1];
  const basBosluk = (new Date(yil, ay - 1, 1).getDay() + 6) % 7;   // Pzt = 0
  const gunSayisi = new Date(yil, ay, 0).getDate();

  // Ay takvimi
  let hucre = "";
  for(const a of ["Pt","Sa","Ça","Pe","Cu","Ct","Pz"]) hucre += '<div class="gunad">' + a + '</div>';
  for(let i = 0; i < basBosluk; i++) hucre += '<div class="g disi"></div>';
  for(let d = 1; d <= gunSayisi; d++){
    const t = yil + "-" + iki(ay) + "-" + iki(d);
    let snf = "g";
    if(t > bugun)               snf += " disi";
    else if(gunTamMi(t))        snf += " tam";
    else if(gununNamazSayisi(t) > 0) snf += " kismi";
    hucre += '<div class="' + snf + '">' + d + '</div>';
  }

  // Son 7 gün: başarı yüzdesi + mini sütun grafik
  const kisa = ["Pt","Sa","Ça","Pe","Cu","Ct","Pz"];
  let toplamOk = 0, barlar = "";
  for(let i = 6; i >= 0; i--){
    const t  = gunKaydir(bugun, -i);
    const ok = gununNamazSayisi(t);
    toplamOk += ok;
    barlar += '<div class="b"><i style="height:' + Math.round(ok / 5 * 100) + '%"></i>' +
              '<span>' + kisa[(gunNesnesi(t).getDay() + 6) % 7] + '</span></div>';
  }
  const oran = Math.round(toplamOk / 35 * 100);

  // Vakit bazında (bu ayın geçen günleri) — kayıt yoksa gün oluşturmadan oku
  const vk = VAKITLER.map(v => {
    let ok = 0, gecen = 0;
    for(let d = 1; d <= gunSayisi; d++){
      const t = yil + "-" + iki(ay) + "-" + iki(d);
      if(t > bugun) break;
      gecen++;
      if(((UYG.veri.gunler[t] || {}).namaz || {})[v.a]) ok++;
    }
    const pc = gecen ? Math.round(ok / gecen * 100) : 0;
    return '<div class="vk-satir"><span class="ad">' + v.ad + '</span>' +
      '<span class="ray-ic"><i style="width:' + pc + '%; background:' + VAKIT_RENK[v.a] + '"></i></span>' +
      '<span class="pc">%' + pc + '</span></div>';
  }).join("");

  // Rozetler — kutlama tonu yok, olgu: kaç tam gün, en uzun seri
  const enUzun  = enUzunSeri();
  const tamGun  = Object.keys(UYG.veri.gunler).filter(gunTamMi).length;
  const borcYok = toplamBorc() === 0 && tamGun > 0;
  const rozetler = [
    { ad: "7 gün<br>kesintisiz",  acik: enUzun >= 7 },
    { ad: "15 tam<br>gün",        acik: tamGun >= 15 },
    { ad: "30 günlük<br>seri",    acik: enUzun >= 30 },
    { ad: "kaza<br>kalmadı",      acik: borcYok },
    { ad: "50 tam<br>gün",        acik: tamGun >= 50 },
    { ad: "100 tam<br>gün",       acik: tamGun >= 100 }
  ].map(r =>
    '<div class="rz' + (r.acik ? "" : " kilit") + '">' +
      '<span class="ic">' + (r.acik ? RZ_ACIK : RZ_KILIT) + '</span>' +
      '<small>' + r.ad + '</small>' +
    '</div>').join("");

  const kaza = toplamBorc();

  $istatistik.innerHTML =
    '<div class="ist-buyuk">' +
      '<span class="alev">' + ALEV_SVG + '</span>' +
      '<div><div class="say">' + seriHesapla() + '</div>' +
        '<div class="alt">günlük seri</div></div>' +
      '<div class="rekor"><b>' + enUzun + '</b><div class="sonuk">en uzun</div></div>' +
    '</div>' +

    '<div class="ist-blok">' +
      '<h2 class="bolum-bas">Bu ay<span class="yan">tam gün · kısmi</span></h2>' +
      '<div class="takvim">' + hucre + '</div>' +
      '<div class="takvim-lgnd">' +
        '<i style="background:rgba(255,255,255,.05)"></i><span>hiç</span>' +
        '<i style="background:rgba(224,154,79,.32)"></i><span>kısmi</span>' +
        '<i style="background:var(--vakit)"></i><span>tam gün</span>' +
      '</div>' +
    '</div>' +

    '<div class="ist-blok bosluk">' +
      '<h2 class="bolum-bas">Başarı oranı<span class="yan">son 7 gün</span></h2>' +
      '<div class="ist-oran"><div class="pct">%' + oran + '</div>' +
        '<div class="ist-bar">' + barlar + '</div></div>' +
    '</div>' +

    '<div class="ist-blok bosluk">' +
      '<h2 class="bolum-bas">Vakit bazında<span class="yan">bu ay</span></h2>' + vk +
    '</div>' +

    '<div class="ist-blok bosluk">' +
      '<h2 class="bolum-bas">Rozetler</h2>' +
      '<div class="rozet-grid">' + rozetler + '</div>' +
    '</div>' +

    (kaza > 0
      ? '<div class="ist-blok bosluk">' +
          '<h2 class="bolum-bas">Kaza borcu</h2>' +
          '<p class="sonuk" style="margin:0 0 10px">' + kaza + ' namaz. Bugün sekmesinde kılabilirsin.</p>' +
          '<button class="dg dg-sonuk" data-gor="bugun">Bugün\'e git</button>' +
        '</div>'
      : "");
}

$istatistik.addEventListener("click", e => {
  const d = e.target.closest("[data-gor]");
  if(d) gorunum(d.dataset.gor);
});

/* ===============================================================
   §15 — Beslenme sekmesi
   Profil formu → istemci kalori hedefi → model programı.
   Program içinde tarif, YouTube linki, "beğenmedim → alternatif".
   Altında tartım girişi ve kilo eğrisi.
   =============================================================== */

const $beslenme = document.getElementById("b-beslenme");
const PROGRAM_SINIR = 3;                       // günde en fazla program üretimi
const AKTIVITE_ETIKET = {
  hareketsiz: "hareketsiz (masa başı)", hafif: "hafif (haftada 1-3 gün)",
  orta: "orta (haftada 3-5 gün)", yuksek: "yüksek (haftada 6-7 gün)"
};

let beslenmeMesaj = "", profilAcik = false;
let acikTarif = null;                          // "oi-yi" — tarifi açık yemek

function beslenmeHakki(){
  const s = UYG.veri.beslenme.sayac || {};
  return PROGRAM_SINIR - (s[uygulamaGunu()] || 0);
}
function beslenmeHakkiDus(){
  const s = UYG.veri.beslenme.sayac || (UYG.veri.beslenme.sayac = {});
  const t = uygulamaGunu();
  s[t] = (s[t] || 0) + 1;
  for(const k of Object.keys(s)) if(k < gunKaydir(t, -7)) delete s[k];
}

/* --- Çizim --------------------------------------------------- */
function makroCip(y){
  return '<span class="mk">P' + (y.protein || 0) + '</span>' +
         '<span class="mk">K' + (y.karb || 0) + '</span>' +
         '<span class="mk">Y' + (y.yag || 0) + '</span>';
}

function profilBolum(){
  const p = UYG.veri.beslenme.profil;
  const h = guncelHedef();

  if(!p || profilAcik){
    const v = p || {};
    const sec = (id, secenekler, secili) =>
      '<select id="' + id + '">' +
        Object.keys(secenekler).map(k =>
          '<option value="' + k + '"' + (k === secili ? " selected" : "") + '>' +
          kacir(secenekler[k]) + '</option>').join("") +
      '</select>';
    return '<h2 class="bolum-bas">Profil</h2>' +
      '<div class="bes-form">' +
        '<label>Boy (cm)<input type="number" id="bp-boy" inputmode="numeric" value="' + (v.boy || "") + '"></label>' +
        '<label>Kilo (kg)<input type="number" id="bp-kilo" inputmode="decimal" step="0.1" value="' + (v.kilo || "") + '"></label>' +
        '<label>Yaş<input type="number" id="bp-yas" inputmode="numeric" value="' + (v.yas || "") + '"></label>' +
        '<label>Cinsiyet' + sec("bp-cinsiyet", { erkek:"erkek", kadin:"kadın" }, v.cinsiyet) + '</label>' +
        '<label class="tam">Aktivite' + sec("bp-aktivite", AKTIVITE_ETIKET, v.aktivite || "orta") + '</label>' +
        '<label class="tam">Haftalık hedef (kg)' +
          '<input type="number" id="bp-hedef" inputmode="decimal" step="0.05" value="' +
          (v.haftalikHedef != null ? v.haftalikHedef : VARSAYILAN_HEDEF) + '"></label>' +
      '</div>' +
      '<div class="plan-alt">' +
        '<button class="dg dg-bir" id="bp-kaydet">kaydet</button>' +
        (p ? '<button class="dg dg-sonuk" id="bp-vazgec">vazgeç</button>' : "") +
        (beslenmeMesaj ? '<span class="sonuk">' + kacir(beslenmeMesaj) + '</span>' : "") +
      '</div>';
  }

  const satir = (a, b) => '<div class="bes-oz"><span>' + a + '</span><b>' + b + '</b></div>';
  return '<h2 class="bolum-bas">Profil' +
      '<button class="dg dg-sonuk" id="bp-duzenle" style="margin-left:auto">düzenle</button>' +
    '</h2>' +
    satir("Boy / kilo", p.boy + " cm · " + (sonKilo() || p.kilo) + " kg") +
    satir("Aktivite", kacir((AKTIVITE_ETIKET[p.aktivite] || p.aktivite || "").split(" ")[0])) +
    satir("Haftalık hedef", "+" + (p.haftalikHedef != null ? p.haftalikHedef : VARSAYILAN_HEDEF) + " kg") +
    (h
      ? '<div class="bes-hedef">' +
          '<div class="bes-hedef-say">' + h.hedef + ' <span>kcal / gün</span></div>' +
          '<div class="bes-hedef-mk">protein ' + h.protein + ' g · karb ' + h.karb +
            ' g · yağ ' + h.yag + ' g</div>' +
          '<div class="sonuk mini">BMR ' + h.bmr + ' · TDEE ' + h.tdee + ' · fazla +' + h.fazla + '</div>' +
        '</div>'
      : '');
}

function programBolum(){
  const pr = UYG.veri.beslenme.program;
  const hak = beslenmeHakki();
  const hazir = UYG.veri.beslenme.profil && guncelHedef();

  const dugme =
    '<div class="plan-alt">' +
      '<button class="dg ' + (pr ? "dg-sonuk" : "dg-bir") + '" id="bes-uret"' +
        (UYG.programUretiliyor || hak <= 0 || !hazir ? " disabled" : "") + '>' +
        (UYG.programUretiliyor ? "üretiliyor…" : (pr ? "programı yeniden üret" : "program üret")) +
      '</button>' +
      (!hazir ? '<span class="sonuk">önce profili doldur</span>'
        : hak < PROGRAM_SINIR && hak > 0 ? '<span class="sonuk">' + hak + ' hak kaldı</span>' : "") +
      (beslenmeMesaj && !profilAcik ? '<span class="sonuk">' + kacir(beslenmeMesaj) + '</span>' : "") +
    '</div>';

  if(!pr) return '<h2 class="bolum-bas">Program</h2>' +
    '<p class="sonuk" style="margin:0 0 4px">Profili doldurunca yapay zeka günlük ' +
    'bir beslenme programı çıkarır: öğünler, kalori, tarif ve tarif videosu.</p>' + dugme;

  const ogunler = (pr.ogunler || []).map((o, oi) =>
    '<div class="bes-ogun">' +
      '<div class="bes-ogun-bas">' + kacir(o.ad) +
        (o.saat ? ' <span class="sonuk">' + o.saat + '</span>' : '') + '</div>' +
      (o.yemekler || []).map((y, yi) => {
        const id = oi + "-" + yi;
        const acik = acikTarif === id;
        return '<div class="bes-yemek">' +
          '<div class="bes-yemek-bas">' +
            '<div><span class="bes-yad">' + kacir(y.ad) + '</span>' +
              '<span class="sonuk mini"> · ' + kacir(y.miktar) + '</span></div>' +
            '<span class="bes-kcal">' + (y.kalori || 0) + '</span>' +
          '</div>' +
          '<div class="bes-mk">' + makroCip(y) + '</div>' +
          '<div class="bes-yemek-alt">' +
            '<button class="dg dg-sonuk" data-tarif="' + id + '" aria-expanded="' + (acik ? "true" : "false") + '">tarif</button>' +
            '<button class="dg dg-sonuk" data-video="' + id + '">' +
              (y.video ? "videoyu aç" : "tarif videosu") + '</button>' +
            '<button class="dg dg-sonuk" data-begenmedim="' + id + '"' +
              (UYG.alternatifBekliyor === id ? " disabled" : "") + '>' +
              (UYG.alternatifBekliyor === id ? "değişiyor…" : "beğenmedim") + '</button>' +
          '</div>' +
          (acik && y.tarif ? '<p class="bes-tarif">' + kacir(y.tarif) + '</p>' : '') +
        '</div>';
      }).join("") +
    '</div>').join("");

  return '<h2 class="bolum-bas">Program' +
      '<span class="yan">' + (pr.gunlukKalori || 0) + ' kcal</span></h2>' +
    (pr.not ? '<p class="sonuk" style="margin:0 0 12px">' + kacir(pr.not) + '</p>' : '') +
    ogunler + dugme;
}

function kiloSparkline(){
  const t = UYG.veri.beslenme.tartim || [];
  if(t.length < 2) return '';
  const son = t.slice(-24);
  const ys = son.map(x => x.kilo);
  const enAz = Math.min(...ys), enCok = Math.max(...ys);
  const aralik = (enCok - enAz) || 1;
  const nokta = son.map((x, i) => {
    const px = son.length === 1 ? 0 : (i / (son.length - 1)) * 100;
    const py = 30 - ((x.kilo - enAz) / aralik) * 26 - 2;
    return px.toFixed(1) + "," + py.toFixed(1);
  }).join(" ");
  return '<svg class="bes-spark" viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true">' +
    '<polyline points="' + nokta + '" fill="none" stroke="var(--vakit)" stroke-width="1.5" ' +
    'stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"></polyline></svg>';
}

function tartimBolum(){
  const tr = kiloTrend(30);
  const sk = sonKilo();
  return '<h2 class="bolum-bas">Tartım' +
      (sk ? '<span class="yan">' + sk + ' kg</span>' : '') + '</h2>' +
    kiloSparkline() +
    (tr
      ? '<p class="sonuk" style="margin:8px 0 0">Son 30 günde ' +
        (tr.degisim >= 0 ? "+" : "") + tr.degisim + ' kg, yaklaşık ' +
        (tr.haftalik >= 0 ? "+" : "") + tr.haftalik + ' kg/hafta.</p>'
      : '<p class="sonuk" style="margin:8px 0 0">En az iki tartım girince eğilim çıkar.</p>') +
    '<div class="plan-ekle">' +
      '<input type="number" id="bes-kilo" inputmode="decimal" step="0.1" placeholder="bugünkü kilo" aria-label="kilo">' +
      '<button class="dg" id="bes-kilo-kaydet">kaydet</button>' +
    '</div>';
}

function beslenmeCiz(){
  if(!UYG.veri) return;
  $beslenme.innerHTML =
    '<div class="ist-blok">' + profilBolum() + '</div>' +
    '<div class="ist-blok bosluk">' + programBolum() + '</div>' +
    '<div class="ist-blok bosluk">' + tartimBolum() + '</div>';
}

/* --- Eylemler ----------------------------------------------- */
function profilKaydet(){
  const al = id => (document.getElementById(id) || {}).value;
  const boy  = parseInt(al("bp-boy"), 10);
  const kilo = parseFloat(al("bp-kilo"));
  const yas  = parseInt(al("bp-yas"), 10);
  const cinsiyet = al("bp-cinsiyet") || "erkek";
  const aktivite = al("bp-aktivite") || "orta";
  let hedef = parseFloat(al("bp-hedef"));
  if(!Number.isFinite(hedef)) hedef = VARSAYILAN_HEDEF;

  if(!(boy > 100 && boy < 250) || !(kilo > 30 && kilo < 400) || !(yas > 10 && yas < 100)){
    beslenmeMesaj = "Boy, kilo ve yaşı makul değerlerle gir.";
    beslenmeCiz();
    return;
  }
  UYG.veri.beslenme.profil = {
    boy: boy, kilo: Math.round(kilo * 10) / 10, yas: yas,
    cinsiyet: cinsiyet === "kadin" ? "kadin" : "erkek",
    aktivite: AKTIVITE[aktivite] ? aktivite : "orta",
    haftalikHedef: Math.max(0, Math.min(1, Math.round(hedef * 100) / 100))
  };
  // İlk profil kilosu tartım günlüğüne de düşsün ki eğri bir yerden başlasın.
  if(!(UYG.veri.beslenme.tartim || []).length) tartimEkle(UYG.veri.beslenme.profil.kilo);
  profilAcik = false;
  beslenmeMesaj = "";
  kaydet();
  beslenmeCiz();
}

async function programUret(){
  if(beslenmeHakki() <= 0){
    beslenmeMesaj = "Bugün program üretme hakkı doldu (günde " + PROGRAM_SINIR + ").";
    beslenmeCiz();
    return;
  }
  const h = guncelHedef();
  if(!h){ beslenmeMesaj = "Önce profili doldur."; beslenmeCiz(); return; }

  UYG.programUretiliyor = true;
  beslenmeMesaj = "";
  beslenmeCiz();
  try{
    const p = UYG.veri.beslenme.profil;
    const pr = await modelIste("beslenme", {
      mod: "program",
      profil: { boy:p.boy, kilo:sonKilo() || p.kilo, yas:p.yas, cinsiyet:p.cinsiyet,
                aktivite:p.aktivite, haftalikHedef:p.haftalikHedef,
                metin: UYG.veri.profil || "" },
      hedef: h,
      sevmedigim: UYG.veri.beslenme.sevmedigim || [],
      mevcut: UYG.veri.beslenme.program || null
    });
    beslenmeHakkiDus();
    UYG.veri.beslenme.program = pr;
    UYG.veri.ayar.yapayZeka = true;
    acikTarif = null;
    kaydet();
  }catch(e){
    console.warn("program üretilemedi", e);
    beslenmeMesaj = hataMetni(e, "Program üretilemedi.") +
      (UYG.veri.beslenme.program ? " Eldeki program duruyor." : "");
  }finally{
    UYG.programUretiliyor = false;
    beslenmeCiz();
  }
}

function sevmedigimEkle(ad){
  const l = UYG.veri.beslenme.sevmedigim || (UYG.veri.beslenme.sevmedigim = []);
  const a = String(ad || "").trim();
  if(a && l.map(x => x.toLowerCase()).indexOf(a.toLowerCase()) === -1){
    l.push(a);
    if(l.length > 40) UYG.veri.beslenme.sevmedigim = l.slice(-40);
  }
}

async function yemekBegenmedim(id){
  const [oi, yi] = id.split("-").map(Number);
  const pr = UYG.veri.beslenme.program;
  const y = pr && pr.ogunler[oi] && pr.ogunler[oi].yemekler[yi];
  if(!y) return;

  UYG.alternatifBekliyor = id;
  beslenmeMesaj = "";
  beslenmeCiz();
  try{
    const alt = await modelIste("beslenme", {
      mod: "alternatif",
      yemek: y,
      ogun: pr.ogunler[oi].ad,
      sevmedigim: (UYG.veri.beslenme.sevmedigim || []).concat([y.ad])
    });
    sevmedigimEkle(y.ad);
    pr.ogunler[oi].yemekler[yi] = alt;
    kaydet();
  }catch(e){
    console.warn("alternatif alınamadı", e);
    beslenmeMesaj = hataMetni(e, "Alternatif alınamadı.");
  }finally{
    UYG.alternatifBekliyor = null;
    beslenmeCiz();
  }
}

async function tarifVideosu(id){
  const [oi, yi] = id.split("-").map(Number);
  const pr = UYG.veri.beslenme.program;
  const y = pr && pr.ogunler[oi] && pr.ogunler[oi].yemekler[yi];
  if(!y) return;

  if(!y.video){
    try{
      const c = await fetch("api/tarif", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ yemek: y.ad })
      });
      const j = await c.json().catch(() => ({}));
      if(j && j.url){ y.video = j.url; kaydet(); }
    }catch(e){
      y.video = "https://www.youtube.com/results?search_query=" +
        encodeURIComponent(y.ad + " tarif");
    }
  }
  if(y.video && typeof open === "function"){
    try{ open(y.video, "_blank", "noopener"); }catch(e){ location.href = y.video; }
  }
  beslenmeCiz();
}

function tartimGirisGonder(){
  const alan = document.getElementById("bes-kilo");
  if(!alan || !alan.value) return;
  if(tartimEkle(alan.value)){ alan.value = ""; beslenmeCiz(); }
}

$beslenme.addEventListener("click", e => {
  const d = e.target.closest("button");
  if(!d) return;
  if(d.id === "bp-kaydet")        profilKaydet();
  else if(d.id === "bp-duzenle"){ profilAcik = true; beslenmeMesaj = ""; beslenmeCiz(); }
  else if(d.id === "bp-vazgec"){  profilAcik = false; beslenmeMesaj = ""; beslenmeCiz(); }
  else if(d.id === "bes-uret")    programUret();
  else if(d.id === "bes-kilo-kaydet") tartimGirisGonder();
  else if(d.dataset.tarif){ acikTarif = (acikTarif === d.dataset.tarif) ? null : d.dataset.tarif; beslenmeCiz(); }
  else if(d.dataset.video)       tarifVideosu(d.dataset.video);
  else if(d.dataset.begenmedim)  yemekBegenmedim(d.dataset.begenmedim);
});
$beslenme.addEventListener("keydown", e => {
  if(e.key === "Enter" && e.target.id === "bes-kilo"){ e.preventDefault(); tartimGirisGonder(); }
});

/* ===============================================================
   §15 — "Bugün" öğün günlüğü (elle giriş + fotoğraftan kalori)
   =============================================================== */

const $ogun = document.getElementById("b-ogun");
let fotoOnay = null, fotoBekliyor = false, ogunMesaj = "";

function gununOgunleri(tarih){
  const k = UYG.veri.beslenme.kayit;
  return (k && k[tarih]) || [];
}

function ogunCiz(){
  if(!UYG.veri) return;
  const bugun = uygulamaGunu();
  const liste = gununOgunleri(bugun);
  const h = guncelHedef();

  // Profil de yoksa, kayıt da yoksa: bölüm görünmez.
  if(!h && !liste.length && !fotoOnay){
    $ogun.hidden = true;
    $ogun.innerHTML = "";
    return;
  }
  $ogun.hidden = false;

  const b = gununBeslenme(bugun);
  const satirlar = liste.map((o, i) =>
    '<div class="og-satir">' +
      (o.thumb ? '<img class="og-thumb" src="' + kacir(o.thumb) + '" alt="">' : '<span class="og-thumb bos"></span>') +
      '<div class="og-ad">' + kacir(o.ad) +
        (o.kaynak === "foto" ? ' <span class="sonuk mini">· fotoğraf</span>' : '') + '</div>' +
      '<span class="og-kcal">' + (o.kalori || 0) + '</span>' +
      '<button class="dg dg-sonuk" data-osil="' + i + '" aria-label="sil">×</button>' +
    '</div>').join("");

  const onay = fotoOnay
    ? '<div class="og-onay">' +
        '<p class="sonuk" style="margin:0 0 8px">Fotoğraftan tahmin — düzeltip onayla' +
          (fotoOnay.guven ? ' (güven: ' + fotoOnay.guven + ')' : '') + '.' +
          (fotoOnay.not ? ' ' + kacir(fotoOnay.not) : '') + '</p>' +
        '<div class="plan-ekle">' +
          '<input type="text" id="of-ad" value="' + kacir(fotoOnay.yemek || "") + '" aria-label="yemek">' +
          '<input type="number" id="of-kcal" inputmode="numeric" value="' + (fotoOnay.kalori || "") + '" aria-label="kalori" style="width:5.5em">' +
        '</div>' +
        '<div class="plan-alt">' +
          '<button class="dg dg-bir" id="of-onay">ekle</button>' +
          '<button class="dg dg-sonuk" id="of-vazgec">vazgeç</button>' +
        '</div>' +
      '</div>'
    : '';

  $ogun.innerHTML =
    '<h2 class="bolum-bas">Öğünler' +
      (h ? '<span class="yan">' + b.kalori + ' / ' + h.hedef + ' kcal</span>' : '') + '</h2>' +
    (satirlar || (fotoOnay ? '' : '<p class="sonuk" style="margin:0 0 4px">Bugün ne yediğini ekle.</p>')) +
    onay +
    (fotoBekliyor ? '<p class="sonuk" style="margin:8px 0 0">fotoğraf çözümleniyor…</p>' : '') +
    (ogunMesaj ? '<p class="sonuk" style="margin:8px 0 0">' + kacir(ogunMesaj) + '</p>' : '') +
    '<div class="plan-ekle">' +
      '<input type="text" id="og-ad" placeholder="ne yedin" autocomplete="off" aria-label="yemek">' +
      '<input type="number" id="og-kcal" inputmode="numeric" placeholder="kcal" aria-label="kalori" style="width:5.5em">' +
      '<button class="dg" id="og-ekle">ekle</button>' +
    '</div>' +
    '<div class="plan-alt">' +
      '<button class="dg dg-sonuk" id="og-foto-ac">fotoğraftan ekle</button>' +
    '</div>' +
    '<input type="file" id="og-foto" accept="image/*" capture="environment" class="gizli">';
}

function ogunEkle(ad, kalori, ek){
  const a = String(ad || "").trim().slice(0, 80);
  const k = Math.max(0, Math.round(+kalori || 0));
  if(!a || !k) return false;
  const bugun = uygulamaGunu();
  const kayit = UYG.veri.beslenme.kayit || (UYG.veri.beslenme.kayit = {});
  (kayit[bugun] || (kayit[bugun] = [])).push(Object.assign(
    { ad: a, kalori: k, kaynak: "elle", zaman: Date.now() }, ek || {}));
  // Kayıt sonsuza kadar büyümesin: 60 günden eski günler silinir.
  const sinir = gunKaydir(bugun, -60);
  for(const t of Object.keys(kayit)) if(t < sinir) delete kayit[t];
  kaydet();
  ogunCiz();
  gunlukCiz();
  return true;
}

function ogunSil(i){
  const bugun = uygulamaGunu();
  const l = (UYG.veri.beslenme.kayit || {})[bugun];
  if(!l || !l[i]) return;
  l.splice(i, 1);
  kaydet();
  ogunCiz();
  gunlukCiz();
}

function ogunGirisGonder(){
  const ad = document.getElementById("og-ad");
  const kc = document.getElementById("og-kcal");
  if(!ad || !kc) return;
  if(ogunEkle(ad.value, kc.value)){ ad.value = ""; kc.value = ""; }
  else { ogunMesaj = "Yemek adı ve kalori gerekli."; ogunCiz(); }
}

/* Fotoğrafı tarayıcıda küçült; API'ye bare base64, önizlemeye data URI. */
function fotoKucult(dosya, boy){
  return new Promise((coz, ret) => {
    if(typeof FileReader === "undefined" || typeof Image === "undefined")
      return ret(new Error("tarayıcı gerekli"));
    const okuyucu = new FileReader();
    okuyucu.onerror = () => ret(new Error("dosya okunamadı"));
    okuyucu.onload = () => {
      const im = new Image();
      im.onerror = () => ret(new Error("görsel açılamadı"));
      im.onload = () => {
        const oran = Math.min(1, boy / Math.max(im.width, im.height));
        const w = Math.round(im.width * oran), hh = Math.round(im.height * oran);
        const c = document.createElement("canvas");
        c.width = w; c.height = hh;
        const ctx = c.getContext && c.getContext("2d");
        if(!ctx) return ret(new Error("canvas yok"));
        ctx.drawImage(im, 0, 0, w, hh);
        coz(c.toDataURL("image/jpeg", 0.72));
      };
      im.src = okuyucu.result;
    };
    okuyucu.readAsDataURL(dosya);
  });
}

async function fotoDegisti(dosya){
  if(!dosya) return;
  fotoBekliyor = true;
  fotoOnay = null;
  ogunMesaj = "";
  ogunCiz();
  try{
    const buyuk = await fotoKucult(dosya, 768);
    const kucuk = await fotoKucult(dosya, 256).catch(() => null);
    const veri = buyuk.replace(/^data:[^,]+,/, "");
    const c = await modelIste("beslenme", { mod: "foto", foto: veri, mime: "image/jpeg" });
    fotoOnay = {
      yemek: c.yemek || "", kalori: c.kalori || 0,
      protein: c.protein || 0, karb: c.karb || 0, yag: c.yag || 0,
      guven: c.guven || "", not: c.not || "", thumb: kucuk || null
    };
  }catch(e){
    console.warn("foto çözümlenemedi", e);
    ogunMesaj = hataMetni(e, "Fotoğraf çözümlenemedi; elle ekleyebilirsin.");
  }finally{
    fotoBekliyor = false;
    ogunCiz();
  }
}

function fotoOnayla(){
  if(!fotoOnay) return;
  const ad = (document.getElementById("of-ad") || {}).value || fotoOnay.yemek;
  const kc = (document.getElementById("of-kcal") || {}).value || fotoOnay.kalori;
  const ek = { kaynak: "foto", protein: fotoOnay.protein, karb: fotoOnay.karb, yag: fotoOnay.yag };
  if(fotoOnay.thumb) ek.thumb = fotoOnay.thumb;
  if(ogunEkle(ad, kc, ek)){ fotoOnay = null; ogunCiz(); }
  else { ogunMesaj = "Yemek adı ve kalori gerekli."; ogunCiz(); }
}

$ogun.addEventListener("click", e => {
  const d = e.target.closest("button");
  if(!d) return;
  if(d.id === "og-ekle")            ogunGirisGonder();
  else if(d.id === "og-foto-ac"){ const f = document.getElementById("og-foto"); if(f && f.click) f.click(); }
  else if(d.id === "of-onay")       fotoOnayla();
  else if(d.id === "of-vazgec"){    fotoOnay = null; ogunMesaj = ""; ogunCiz(); }
  else if(d.dataset.osil != null)   ogunSil(+d.dataset.osil);
});
$ogun.addEventListener("change", e => {
  if(e.target.id === "og-foto" && e.target.files && e.target.files[0])
    fotoDegisti(e.target.files[0]);
});
$ogun.addEventListener("keydown", e => {
  if(e.key === "Enter" && (e.target.id === "og-ad" || e.target.id === "og-kcal")){
    e.preventDefault(); ogunGirisGonder();
  }
});

/* ===============================================================
   Görünüm (alt tab bar): tek sayfa, bölümler sekmeye göre gösterilir.
   =============================================================== */
const GORUNUM = {
  bugun:    ["b-gunluk", "b-namaz", "b-kaza", "b-su", "b-ogun"],
  seri:     ["b-istatistik"],
  plan:     ["b-plan", "b-sohbet", "b-etkinlik", "b-degerlendirme"],
  beslenme: ["b-beslenme"],
  ayarlar:  ["b-alarm", "b-ayar", "b-ayarlar"]
};
const TUM_BOLUMLER = Object.keys(GORUNUM).reduce((a, k) => a.concat(GORUNUM[k]), []);
let aktifGorunum = "bugun";

function gorunum(sekme){
  if(!GORUNUM[sekme]) sekme = "bugun";
  aktifGorunum = sekme;
  if(UYG.veri && UYG.veri.ayar){ UYG.veri.ayar.sekme = sekme; kaydet(); }

  for(const id of TUM_BOLUMLER){
    const el = document.getElementById(id);
    if(el) el.hidden = GORUNUM[sekme].indexOf(id) === -1;
  }
  // İçeriğe göre kendini gizleyen bölümler yeniden karar versin.
  if(sekme === "bugun"){   kazaCiz(); ogunCiz(); }
  if(sekme === "plan")     etkinlikCiz();
  if(sekme === "seri")     istatistikCiz();
  if(sekme === "beslenme") beslenmeCiz();

  const nav = document.getElementById("alt-nav");
  if(nav && nav.querySelectorAll){
    const btns = nav.querySelectorAll("button");
    if(btns && btns.forEach)
      btns.forEach(b => { if(b.classList) b.classList.toggle("aktif", b.dataset && b.dataset.gor === sekme); });
  }
  if(typeof scrollTo === "function") try{ scrollTo(0, 0); }catch(e){}
}

(function navKur(){
  const nav = document.getElementById("alt-nav");
  if(!nav || !nav.addEventListener) return;
  nav.addEventListener("click", e => {
    const b = e.target.closest("button[data-gor]");
    if(b) gorunum(b.dataset.gor);
  });
})();

/* --- Açılış --------------------------------------------------- */
function baslat(){
  UYG.veri  = yukle();
  UYG.bugun = uygulamaGunu();
  vurguyuAyarla("yatsi");

  gunlukCiz();
  kazaCiz();
  suCiz();
  planCiz();
  etkinlikCiz();
  sohbetCiz();
  degerCiz();
  alarmCiz();
  ayarCiz();
  ayarlarCiz();
  istatistikCiz();
  beslenmeCiz();
  ogunCiz();
  gorunum((UYG.veri.ayar && UYG.veri.ayar.sekme) || "bugun");

  // Plan üretimi vakitleri de gönderir (§6), o yüzden namazKur'dan sonra.
  namazKur().then(borcTara).then(planHazirla).then(() => {
    if(profilZamaniMi()) profilGuncelle();          // haftada bir (§9)
  });
  konumSor(false).then(k => {                   // izin gelirse konuma göre tazele
    if(k && k.kaynak === "cihaz") namazKur(true).then(borcTara);
  });
}
baslat();
