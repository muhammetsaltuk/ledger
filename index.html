<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledger</title>
<meta name="description" content="Namaz vakitleri, kaza borcu ve günlük düzen.">
<meta name="theme-color" content="#0E1318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">

<style>
/* ---------------------------------------------------------------
   §13 — Görsel tasarım (v2, "Grit" yönü).
   Kart tabanlı, cam yüzeyler, yuvarlak köşeler, sıcak radyal zemin.
   Aktif namaz vaktine göre kayan tek vurgu korunur; onun yanına
   ilerleme halkaları, günlük seri ve istatistik geldi.
   --------------------------------------------------------------- */
:root{
  --zemin:#0E1318;
  --yuzey:#171D24;
  --cizgi:#262F39;
  --metin:#E4E7E4;
  --sonuk:#7C8A94;
  --tamam:#6E9C7A;
  --eksik:#A8615C;

  /* Cam / kart yüzeyleri */
  --kart:rgba(255,255,255,.055);
  --kart-cizgi:rgba(255,255,255,.075);
  --cam:rgba(255,255,255,.038);
  --cam-cizgi:rgba(255,255,255,.10);
  --kart-r:22px;

  /* Aktif namaz vaktine göre değişen tek vurgu.
     Yatsı zemine karşı düşük kontrast kalıyordu; aynı aileden bir tık açıldı. */
  --vakit:#6478A8;

  /* Vakitten bağımsız iki sabit renk: seri alevi ve su. */
  --alev:#E8C468;
  --su:#6E7FB8;

  --bas:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --gov:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;

  --en:430px;
  --bosluk:16px;
  --gecis:800ms;
}
@media (prefers-reduced-motion: reduce){
  :root{ --gecis:0ms; }
  *,*::before,*::after{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
/* Yatay kaydırma sayfa düzeyinde kapalı. body'deki hidden tek başına iOS'ta
   sayfayı yine de pan ettirebiliyor; html'de de clip gerekiyor. */
html{
  background:var(--zemin);
  -webkit-text-size-adjust:100%;
  overflow-x:clip;
}
body{
  background:var(--zemin);
  background-image:radial-gradient(130% 55% at 50% -6%, rgba(224,154,79,.13), rgba(224,154,79,0) 60%);
  background-attachment:fixed;
  color:var(--metin);
  font-family:var(--gov);
  font-size:1rem;
  line-height:1.5;
  font-weight:400;
  overflow-x:clip;
  /* Rakamlar hizalı dursun, geri sayım titremesin */
  font-variant-numeric:tabular-nums;
}
img,svg,video{ max-width:100%; }

h1,h2,h3{ font-family:var(--bas); font-weight:600; margin:0; letter-spacing:-.015em; }

/* Uzun bölünemez kelime (yapıştırılmış adres, model çıktısı) kutudan taşmasın.
   white-space:nowrap olan yerlerde (.ay-kod) etkisiz, orası kendi içinde kayar. */
.bolum, .bolum *{ overflow-wrap:anywhere; }
/* Ama kontroller hariç: "anywhere" min-genişliği düşürüp kısa buton etiketini
   (ör. "ekle") harf harf alt alta kırıyordu. Etiketleri hep tek parça tut. */
.bolum button, .bolum a.dg, .bolum input, .bolum select, .bolum summary{
  overflow-wrap:normal;
  word-break:normal;
}
/* Flex/grid içindeki metin kutusu içeriğinden dar olabilsin (yoksa satırı
   viewport'tan geniş iter). */
.n-ad,.e-ad,.al-ad,.k-sayi,.p-govde,.bes-yad,.og-ad,.bolum-bas,
.seri-bant > div,.bes-yemek-bas > div{ min-width:0; }

/* --- Düzen: tek sütun, ortalı, en fazla 430px; altta tab bar payı --- */
.kabuk{
  max-width:var(--en);
  margin:0 auto;
  padding:
    calc(env(safe-area-inset-top) + 18px)
    var(--bosluk)
    calc(env(safe-area-inset-bottom) + 96px);
  display:flex;
  flex-direction:column;
  gap:14px;
}

/* Her bölüm bir kart. */
.bolum{
  background:var(--kart);
  border:1px solid var(--kart-cizgi);
  border-radius:var(--kart-r);
  padding:18px;
}
.bolum[hidden]{ display:none; }
.bolum:empty{ display:none; }

/* Camsı bölüm (hero, yarın) */
.bolum.cam{
  background:var(--cam);
  border-color:var(--cam-cizgi);
  backdrop-filter:blur(26px);
  -webkit-backdrop-filter:blur(26px);
}

.bolum-bas{
  font-family:var(--bas);
  font-size:1.05rem;
  font-weight:600;
  margin:0 0 12px;
  display:flex;
  align-items:baseline;
  flex-wrap:wrap;
  gap:4px 8px;
}
.bolum-bas .yan{
  font-family:var(--gov);
  font-size:.8rem;
  font-weight:400;
  color:var(--sonuk);
  margin-left:auto;
}

.sonuk{ color:var(--sonuk); font-size:.85rem; }

/* --- Düğmeler: tam yuvarlak; birincil dolu, ikincil hayalet --- */
button{
  font-family:inherit;
  font-size:inherit;
  color:inherit;
  background:none;
  border:0;
  padding:0;
  cursor:pointer;
}
.dg{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:40px;
  padding:0 16px;
  border-radius:999px;
  border:1px solid var(--cam-cizgi);
  background:rgba(255,255,255,.06);
  color:var(--metin);
  font-size:.9rem;
  font-weight:500;
  line-height:1;
  white-space:nowrap;                   /* etiket tek satır; asla kırılmaz */
  flex-shrink:0;                         /* flex satırda büzülüp sarmasın */
  text-decoration:none;                /* .dg bir <a> da olabilir */
  transition:border-color 160ms ease,color 160ms ease,background-color 160ms ease;
}
/* Flex satırdaki girdiler büzülebilsin ki düğmeyi ezmesin. */
.bolum input, .bolum select, .bolum textarea{ min-width:0; }
.dg:hover{ border-color:var(--sonuk); }
/* Birincil: aktif vakit renginde dolu düğme */
.dg-bir{
  background:var(--vakit);
  border-color:var(--vakit);
  color:#15100A;
  font-weight:600;
}
.dg-bir:hover{ filter:brightness(1.08); border-color:var(--vakit); }
.dg-sonuk{ background:transparent; color:var(--sonuk); font-size:.85rem; }
.dg-sonuk:hover{ color:var(--metin); }
.dg[disabled]{ opacity:.45; cursor:default; }

:where(a,button,input,textarea,summary,[tabindex]):focus-visible{
  outline:2px solid var(--vakit);
  outline-offset:2px;
}

input,textarea{
  font-family:inherit;
  font-size:1rem;
  color:var(--metin);
  background:rgba(255,255,255,.04);
  border:1px solid var(--cam-cizgi);
  border-radius:11px;
  padding:10px 12px;
  width:100%;
}
input::placeholder,textarea::placeholder{ color:var(--sonuk); }
input:focus,textarea:focus{ outline:none; border-color:var(--vakit); }

/* --- Ray: plan ve namaz listelerinde ince sol çizgi --- */
.ray{
  list-style:none;
  margin:0;
  padding:0 0 0 18px;
  border-left:1px solid var(--cizgi);
}
.ray > li{ position:relative; }
.ray > li::before{
  content:"";
  position:absolute;
  left:-18px;
  top:var(--tirnak,17px);
  width:11px;
  height:1px;
  background:var(--cizgi);
}

.yukleniyor{ color:var(--sonuk); font-size:.85rem; }

/* --- Günlük: seri bandı + ilerleme halkaları ----------------- */
.seri-bant{
  display:flex; align-items:center; gap:13px;
  padding:14px 16px;
  border:1px solid rgba(224,154,79,.34);
  border-radius:16px;
  background:rgba(224,154,79,.07);
}
.seri-bant > div{ min-width:0; }
.seri-bant .alev{
  width:38px; height:38px; border-radius:13px; flex:0 0 auto;
  display:flex; align-items:center; justify-content:center;
  background:rgba(224,154,79,.16); color:var(--alev);
}
.seri-bant .alev svg{ width:21px; height:21px; }
.seri-bant b{ font-family:var(--bas); font-size:1rem; font-weight:600; }
.seri-hafta{ display:flex; gap:6px; margin-left:auto; flex:0 0 auto; }
.seri-hafta i{ width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.13); }
.seri-hafta i.on{ background:var(--alev); }

.halkalar{ display:grid; grid-template-columns:repeat(auto-fit,minmax(0,1fr)); gap:8px; margin-top:14px; }
.halka:nth-child(4) .cerceve .deger{ font-size:.72rem; }   /* kalori sayısı uzun */
.halka{ display:flex; flex-direction:column; align-items:center; gap:7px; }
.halka .cerceve{ position:relative; width:74px; height:74px; }
.halka .cerceve .deger{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-family:var(--bas); font-weight:600; font-size:.95rem;
}
.halka .etiket{ font-size:.75rem; color:var(--sonuk); }

/* --- §4 Namaz: şu anki vakit --------------------------------- */
.simdi{ text-align:center; margin:0 0 4px; }
/* Hero halkasının boyutu YALNIZ burada. halkaSVG %100 dolar; ikisi senkron. */
.simdi .halka-hero{ position:relative; width:160px; height:160px; margin:2px auto 14px; }
.simdi .halka-hero .ortak{
  position:absolute; inset:14px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:2px;
}
.vakit-ad{
  font-family:var(--bas);
  font-size:1.6rem;
  line-height:1.05;
  font-weight:700;
  letter-spacing:-.02em;
  color:var(--vakit);
  transition:color var(--gecis) ease;
  margin:0;
}
.vakit-ad.bos{ color:var(--sonuk); font-size:1.2rem; }
.kalan{ margin:6px 0 0; font-size:.95rem; color:var(--metin); }
.kalan .sure{ color:var(--vakit); font-weight:600; }
.cubuk{
  height:4px;
  border-radius:999px;
  background:rgba(255,255,255,.08);
  overflow:hidden;
  margin-top:10px;
}
.cubuk > i{
  display:block;
  height:4px;
  width:0;
  border-radius:999px;
  background:var(--vakit);
  transition:width 1000ms linear, background-color var(--gecis) ease;
}
@media (prefers-reduced-motion: reduce){ .cubuk > i{ transition:none; } }

/* --- §4 Namaz: beş vakit listesi ----------------------------- */
.namaz-liste{ list-style:none; margin:0; padding:0; border-left:0; }
.namaz-liste > li{
  --tirnak:20px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 0;
  min-height:44px;
  border-top:1px solid rgba(255,255,255,.06);
}
.namaz-liste > li:first-child{ border-top:0; }
.namaz-liste > li::before{ display:none; }
.namaz-liste > li.aktif{
  margin:0 -18px; padding:11px 18px;
  background:rgba(255,255,255,.045);
  border-radius:12px;
  border-top:0;
}
.n-nokta{ width:9px; height:9px; border-radius:50%; flex:0 0 auto; background:var(--vakit); }
.n-saat{ color:var(--sonuk); font-size:.9rem; min-width:3.2em; }
.n-ad{ flex:1 1 auto; font-size:1rem; font-weight:500; }
.namaz-liste > li.gecmis .n-saat,
.namaz-liste > li.gecmis .n-ad{ color:var(--sonuk); }
.n-durum{
  font-size:.85rem;
  color:var(--sonuk);
  white-space:nowrap;
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:40px;
  padding:0 2px 0 10px;
  background:none;
  border:0;
}
.n-durum .nokta{
  width:22px; height:22px; border-radius:50%;
  border:1.5px solid rgba(255,255,255,.2);
  flex:0 0 auto;
}
.n-durum.tamam{ color:var(--tamam); }
.n-durum.tamam .nokta{ background:var(--tamam); border-color:var(--tamam); }
.n-durum.kaza{ color:var(--tamam); }
.n-durum.kaza .nokta{ background:none; border-color:var(--tamam); }
.n-durum.eksik{ color:var(--eksik); }
.n-durum.eksik .nokta{ border-color:var(--eksik); }
.n-durum.eylem{
  border:1px solid var(--vakit);
  border-radius:999px;
  padding:0 14px;
  color:var(--metin);
}
.n-durum.eylem .nokta{ display:none; }
.n-durum.eylem:hover{ filter:brightness(1.15); }
/* Kaçmış vakitler sessiz durur; suçluluk tonu getirmiyoruz. */
.n-durum.eylem-sessiz{ color:var(--sonuk); }
.n-durum.eylem-sessiz .nokta{ border-color:var(--eksik); }
.n-durum.eylem-sessiz:hover{ color:var(--metin); }

/* --- §5 Kaza: kuyruk, ceza puanı değil. Kırmızı yok, toplam yok. --- */
.kaza-liste{ list-style:none; margin:0; padding:0; }
.kaza-liste > li{
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 0;
  min-height:44px;
  border-top:1px solid rgba(255,255,255,.06);
}
.kaza-liste > li:first-child{ border-top:0; }
.k-ad{ flex:0 0 auto; font-weight:500; }
.k-sayi{ flex:1 1 auto; color:var(--sonuk); }

/* --- §8 Alarm ve ayarlar ------------------------------------- */
.alarm-liste{ list-style:none; margin:0 0 14px; padding:0; }
.alarm-liste > li{
  display:flex; align-items:center; gap:12px;
  padding:11px 0; min-height:46px;
  border-top:1px solid rgba(255,255,255,.06);
}
.alarm-liste > li:first-child{ border-top:0; }
.al-saat{ flex:0 0 auto; font-family:var(--bas); font-size:1.15rem; font-weight:600; min-width:3.4em; }
.al-ad{ flex:1 1 auto; color:var(--sonuk); font-size:.95rem; }

.kisayol{ margin-top:14px; }
.kisayol > summary{ cursor:pointer; min-height:44px; display:flex; align-items:center; }
.kisayol-adim{ margin:6px 0 0; padding-left:1.3em; }
.kisayol-adim > li{ margin:5px 0; }

.ay-blok{ padding:16px 0; }
.ay-blok + .ay-blok{ border-top:1px solid var(--cizgi); }
.ay-bas{ margin:0 0 6px; }
.ay-satir{ display:flex; gap:8px; align-items:center; }
.ay-kod{
  display:block;
  margin-top:6px;
  padding:9px 11px;
  background:var(--yuzey);
  border:1px solid var(--cizgi);
  color:var(--sonuk);
  font-size:.78rem;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  overflow-x:auto;
  white-space:nowrap;
}

/* --- §10 Sohbet ---------------------------------------------- */
.sohbet-liste{ list-style:none; margin:0 0 14px; padding:0; }
.sohbet-liste > li{
  padding:9px 0;
  line-height:1.5;
  white-space:pre-wrap;
}
.sohbet-liste > li + li{ border-top:1px solid var(--cizgi); }
.sohbet-liste > li.s-ben{ color:var(--metin); }
.sohbet-liste > li.s-model{ color:var(--sonuk); }
.s-giris{ display:flex; gap:8px; align-items:center; }
.s-giris input{ flex:1 1 auto; }

/* Tek dokunuşluk hazır istek çipleri */
.cip-satir{ display:flex; flex-wrap:wrap; gap:8px; margin:0 0 10px; }
.cip{
  min-height:34px; padding:0 13px;
  border-radius:999px; font-size:.82rem; font-weight:500;
  color:var(--vakit);
  background:rgba(255,255,255,.05);
  border:1px solid var(--vakit);
  white-space:nowrap; flex-shrink:0;
}
.cip:hover{ filter:brightness(1.12); }
.cip[disabled]{ opacity:.45; }

/* --- §9 / §12 Profil ve değerlendirme ------------------------ */
.deger-metin,.profil-metin{
  margin:0 0 14px;
  white-space:pre-wrap;
  line-height:1.55;
}
.profil-metin{ color:var(--sonuk); font-size:.95rem; }

/* --- §7 Etkinlikler ------------------------------------------ */
.etkinlik-liste{ list-style:none; margin:0; padding:0; }
.etkinlik-liste > li{
  display:flex; align-items:center; gap:12px;
  padding:7px 0; min-height:44px;
}
.etkinlik-liste > li + li{ border-top:1px solid var(--cizgi); }
.e-tarih{ flex:0 0 8.6em; color:var(--sonuk); font-size:.9rem; }
.e-ad{ flex:1 1 auto; }
.e-giris{ display:flex; gap:8px; align-items:center; margin-top:12px; }
.e-taslak{ display:flex; gap:8px; align-items:center; margin-top:12px; flex-wrap:wrap; }
.e-taslak input[type="date"]{ width:9.6em; flex:0 0 auto; }
.e-taslak input[type="time"]{ width:6.6em; flex:0 0 auto; }
.e-taslak input[type="text"]{ flex:1 1 8em; }

/* --- §11 Su: bardak şeridi. Vurgu rengi burada kullanılmaz. --- */
.su-satir{ display:flex; align-items:center; gap:14px; }
.su-etiket{ flex:0 0 auto; color:var(--sonuk); font-size:.85rem; }
.su-serit{
  flex:1 1 auto;
  display:flex;
  gap:5px;
  padding:14px 0;              /* dokunma alanı */
  background:none;
  border:0;
  cursor:pointer;
  touch-action:manipulation;
  -webkit-user-select:none;
  user-select:none;
}
.su-serit i{
  flex:1 1 0;
  height:24px;
  border-radius:5px 5px 7px 7px;
  border:1.5px solid rgba(110,127,184,.5);
  transition:background-color 200ms ease, border-color 200ms ease;
}
.su-serit i.dolu{ background:var(--su); border-color:var(--su); }
.su-sayi{ flex:0 0 auto; color:var(--sonuk); font-size:.85rem; min-width:3.2em; text-align:right; }

/* --- §6 Plan: günün akışını gösteren ray --------------------- */
/* Izgara: not satırı başlığın altına, tam hizasına düşsün. */
.plan-liste > li{
  --tirnak:18px;
  display:grid;
  grid-template-columns:26px 3.6em minmax(0,1fr);
  column-gap:11px;
  align-items:start;
  padding:4px 0 6px;
}
.plan-liste > li.yapildi .p-metin{ color:var(--sonuk); text-decoration:line-through; }
.plan-liste > li.yapildi .p-sure{ text-decoration:none; }
.p-isaret{
  grid-column:1; grid-row:1;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:26px; height:34px;
  margin-left:-4px;
}
.p-isaret .nokta{
  width:20px; height:20px;
  border-radius:999px;
  border:1.5px solid rgba(255,255,255,.22);
  transition:background-color 160ms ease, border-color 160ms ease;
}
.p-isaret[aria-pressed="true"] .nokta{ background:var(--tamam); border-color:var(--tamam); }
.p-saat{
  grid-column:2; grid-row:1;
  align-self:start;
  color:var(--vakit); font-weight:600;
  font-family:var(--bas); font-size:.8rem;
  padding-top:8px;
}
.p-govde{
  grid-column:3; grid-row:1;
  text-align:left;
  padding:6px 0;
  line-height:1.35;
}
.p-baslik{ display:block; }
.p-gerekce{ display:block; color:var(--sonuk); font-size:.85rem; margin-top:2px; }
.p-sure{ color:var(--sonuk); font-size:.85rem; margin-left:6px; }

.p-not{ grid-column:3; grid-row:2; display:flex; align-items:center; gap:10px; margin:2px 0 8px; }
.p-not input{ flex:1 1 auto; font-size:.9rem; padding:7px 10px; }
.p-notozet{
  grid-column:3; grid-row:2;
  display:block;
  color:var(--sonuk);
  font-size:.85rem;
  margin:1px 0 2px;
}
.plan-alt{ display:flex; align-items:center; gap:10px; margin-top:16px; flex-wrap:wrap; }
.plan-ekle{ display:flex; gap:8px; align-items:center; margin-top:14px; }
.dun-soru{ margin-top:14px; padding:14px; border-radius:14px;
  background:rgba(224,154,79,.08); border:1px solid rgba(224,154,79,.28); }
.dun-soru .plan-ekle{ margin-top:0; }
.plan-ekle input[type="time"]{ width:6.6em; flex:0 0 auto; }
.plan-ekle input[type="text"]{ flex:1 1 auto; }
.plan-bos{ color:var(--sonuk); font-size:.9rem; margin:0 0 4px; }

.namaz-alt{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-top:14px;
}
.hata{
  color:var(--metin);
  font-size:.85rem;
  margin:10px 0 0;
  padding-left:10px;
  border-left:2px solid var(--eksik);   /* renk anlamı taşır, metni taşımaz */

<script>
"use strict";
/* ===============================================================
   Ledger — tek dosya uygulama. Veri telefonda kalır (§2).
   =============================================================== */

const UYG = {};
window.__uyg = UYG;

/* --- Depolama ------------------------------------------------- */
const ANAHTAR = "ledger/v1";

const VARSAYILAN = {
  surum: 1,
  konum: null,                                              // {lat,lng,kaynak,zaman}
  vakitler: {},                                             // "tarih|lat,lng" -> ham vakitler
  gunler: {},                                               // "YYYY-MM-DD" -> gün kaydı
  borc: { sabah:0, ogle:0, ikindi:0, aksam:0, yatsi:0 },    // §5
  islenmisVakitler: [],                                     // §5 — "tarih|vakit"
  sonKontrol: null,
  profil: "",                                               // §9
  etkinlikler: [],                                          // §7
  sohbet: [],                                               // §10
  ayar: {},
  beslenme: {                                             // §15
    profil: null,        // {boy,kilo,yas,cinsiyet,aktivite,haftalikHedef}
    program: null,       // modelin ürettiği beslenme programı
    tartim: [],          // [{tarih, kilo}] — kilo günlüğü
    kayit: {},           // "YYYY-MM-DD" -> öğün kayıtları
    sevmedigim: [],      // kaçınılacak yemekler
    sayac: {}            // "YYYY-MM-DD" -> program üretim sayısı (kota)
  }
};

function yukle(){
  try{
    const ham = localStorage.getItem(ANAHTAR);
    const v = ham
      ? Object.assign(structuredClone(VARSAYILAN), JSON.parse(ham))
      : structuredClone(VARSAYILAN);
    // Object.assign sığ birleştirir: yeni alt alanlar için beslenme'yi tamamla.
    v.beslenme = Object.assign(structuredClone(VARSAYILAN.beslenme), v.beslenme || {});
    return v;
  }catch(e){
    console.warn("Depo okunamadı, sıfırdan başlanıyor.", e);
    return structuredClone(VARSAYILAN);
  }
}
function kaydet(){
  try{ localStorage.setItem(ANAHTAR, JSON.stringify(UYG.veri)); }
  catch(e){ console.warn("Depoya yazılamadı.", e); }
}

/* --- Tarih yardımcıları --------------------------------------- */
const iki = n => String(n).padStart(2,"0");
const tarihAnahtar = d => d.getFullYear()+"-"+iki(d.getMonth()+1)+"-"+iki(d.getDate());

/* §4 Gece kayması: yerel saat 04:00'ten önceyse hâlâ dünü gösteririz. */
const GECE_SINIRI = 4;
function uygulamaGunu(simdi){
  const d = new Date(simdi || Date.now());
  if(d.getHours() < GECE_SINIRI) d.setDate(d.getDate() - 1);
  return tarihAnahtar(d);
}

/* --- Vurgu rengi (§13) ---------------------------------------- */
const VAKIT_RENK = {
  sabah:"#6E7FB8", ogle:"#E8C468", ikindi:"#E09A4F", aksam:"#D46A5C", yatsi:"#6478A8"
};
let sonRenk = null;
function vurguyuAyarla(vakitAnahtar){
  const renk = VAKIT_RENK[vakitAnahtar] || VAKIT_RENK.yatsi;
  if(renk === sonRenk) return;
  document.documentElement.style.setProperty("--vakit", renk);
  sonRenk = renk;
}

/* ===============================================================
   §13 (v2) — Günlük seri ve ilerleme halkaları
   Bir gün "tam": beş vaktin hepsi işaretli (vaktinde ya da kaza).
   Seri: bugünden (bitmediyse dünden) geriye ardışık tam gün sayısı.
   Yeni durum tutulmaz; hepsi mevcut gün kayıtlarından türetilir.
   =============================================================== */
function gunTamMi(tarih){
  const g = UYG.veri.gunler[tarih];
  if(!g || !g.namaz) return false;
  return VAKITLER.every(v => g.namaz[v.a]);
}
function gununNamazSayisi(tarih){
  const n = (UYG.veri.gunler[tarih] && UYG.veri.gunler[tarih].namaz) || {};
  return VAKITLER.reduce((t, v) => t + (n[v.a] ? 1 : 0), 0);
}
function seriHesapla(){
  const bugun = uygulamaGunu();
  let t = gunTamMi(bugun) ? bugun : gunKaydir(bugun, -1);
  let seri = 0;
  while(gunTamMi(t)){ seri++; t = gunKaydir(t, -1); }
  return seri;
}
function enUzunSeri(){
  const gunler = Object.keys(UYG.veri.gunler).filter(gunTamMi).sort();
  let en = 0, art = 0, onceki = null;
  for(const t of gunler){
    art = (onceki && gunKaydir(onceki, 1) === t) ? art + 1 : 1;
    if(art > en) en = art;
    onceki = t;
  }
  return Math.max(en, seriHesapla());
}

/* İlerleme halkası — SVG. Boyutu her zaman saran kutudan gelir (width/height
   %100); px değeri yazılmaz ki CSS kutusuyla senkronsuz kalmasın. Çizgi
   kalınlığı viewBox biriminde, büyük halkalarda (hero) inceltmek için parametre.
   Renk var(--...) olarak geçirilir, tek kaynak korunur. */
function halkaSVG(deger, toplam, renk, kalinlik){
  const c = 207.35;                                   // 2πr, r = 33
  const k = kalinlik || 7;
  const dolu = toplam > 0 ? Math.max(0, Math.min(1, deger / toplam)) : 0;
  return '<svg viewBox="0 0 80 80" width="100%" height="100%" ' +
      'preserveAspectRatio="xMidYMid meet" style="display:block" aria-hidden="true">' +
    '<circle cx="40" cy="40" r="33" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="' + k + '"></circle>' +
    '<circle cx="40" cy="40" r="33" fill="none" stroke="' + renk + '" stroke-width="' + k + '" ' +
      'stroke-linecap="round" stroke-dasharray="' + c.toFixed(2) + '" ' +
      'stroke-dashoffset="' + (c * (1 - dolu)).toFixed(2) + '" transform="rotate(-90 40 40)"></circle>' +
  '</svg>';
}

/* Alev simgesi — seri motifi. Emoji değil, çizili SVG. */
const ALEV_SVG =
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
  'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<path d="M12 3c1.6 2.8 4.5 4.4 4.5 8.2A4.5 4.5 0 0 1 7.5 12c0-1.6.7-2.9 1.6-3.7' +
  '-.1 1.3.5 2.3 1.4 2.7-.6-2.6.3-6 0-8.2z"></path></svg>';

/* ===============================================================
   §15 — Beslenme: kalori hesabı ve kilo günlüğü
   Kalori/makro hedefi istemcide hesaplanır (Mifflin-St Jeor + aktivite
   + kilo-alma fazlası). Deterministik, çevrimdışı çalışır, test edilir.
   Model yalnız bu hedefe göre öğünleri kurar.
   =============================================================== */

const AKTIVITE = { hareketsiz:1.2, hafif:1.375, orta:1.55, yuksek:1.725 };
const VARSAYILAN_HEDEF = 0.35;          // kg/hafta — ölçülü kilo alma

/** Profil eksiksizse {bmr,tdee,fazla,hedef,protein,karb,yag}; değilse null. */
function kaloriHedefi(p){
  if(!p) return null;
  const boy = +p.boy, kilo = +p.kilo, yas = +p.yas;
  if(!(boy > 0) || !(kilo > 0) || !(yas > 0)) return null;
  if(p.cinsiyet !== "erkek" && p.cinsiyet !== "kadin") return null;
  const faktor = AKTIVITE[p.aktivite];
  if(!faktor) return null;

  // Mifflin-St Jeor
  const bmr = 10 * kilo + 6.25 * boy - 5 * yas + (p.cinsiyet === "erkek" ? 5 : -161);
  const tdee = bmr * faktor;

  const haftalik = Number.isFinite(+p.haftalikHedef) ? +p.haftalikHedef : VARSAYILAN_HEDEF;
  // 1 kg yağ dokusu ≈ 7700 kcal; günlük fazla = haftalık kg * 7700 / 7, 25'e yuvarlı.
  const fazla = Math.max(0, Math.round(haftalik * 7700 / 7 / 25) * 25);
  const hedef = Math.round(tdee) + fazla;

  const protein = Math.round(1.8 * kilo);                 // g — kilo alma aralığı
  const yag     = Math.round(hedef * 0.25 / 9);           // kalorinin %25'i
  const karb    = Math.max(0, Math.round((hedef - protein * 4 - yag * 9) / 4));

  return { bmr: Math.round(bmr), tdee: Math.round(tdee), fazla, hedef, protein, karb, yag };
}

/** Güncel kiloyla (varsa son tartım) hesaplanmış hedef. */
function guncelHedef(){
  const p = UYG.veri.beslenme.profil;
  if(!p) return null;
  return kaloriHedefi(Object.assign({}, p, { kilo: sonKilo() || p.kilo }));
}

function sonKilo(){
  const t = UYG.veri.beslenme.tartim;
  return (t && t.length) ? t[t.length - 1].kilo : (UYG.veri.beslenme.profil || {}).kilo || null;
}

/** Aynı güne ikinci tartım gelirse üzerine yazılır. En fazla 200 kayıt. */
function tartimEkle(kilo){
  const k = Math.round(+kilo * 10) / 10;
  if(!(k > 0) || k > 400) return false;
  const t = UYG.veri.beslenme.tartim;
  const bugun = uygulamaGunu();
  const v = t.find(x => x.tarih === bugun);
  if(v) v.kilo = k;
  else t.push({ tarih: bugun, kilo: k });
  t.sort((a, b) => a.tarih.localeCompare(b.tarih));
  if(t.length > 200) UYG.veri.beslenme.tartim = t.slice(-200);
  kaydet();
  return true;
}

/** Son `gun` günün kilo eğilimi (en küçük kareler eğimi → kg/hafta). */
function kiloTrend(gun){
  const sinir = gunKaydir(uygulamaGunu(), -(gun || 30));
  const nokta = (UYG.veri.beslenme.tartim || []).filter(x => x.tarih >= sinir);
  if(nokta.length < 2) return null;
  // x = gün sayısı (ilk noktaya göre), y = kilo
  const t0 = new Date(nokta[0].tarih + "T12:00:00").getTime();
  const xs = nokta.map(n => (new Date(n.tarih + "T12:00:00").getTime() - t0) / 86400000);
  const ys = nokta.map(n => n.kilo);
  const n = xs.length;
  const sx = xs.reduce((a, b) => a + b, 0), sy = ys.reduce((a, b) => a + b, 0);
  const sxx = xs.reduce((a, b) => a + b * b, 0);
  const sxy = xs.reduce((a, b, i) => a + b * ys[i], 0);
  const payda = n * sxx - sx * sx;
  const egim = payda === 0 ? 0 : (n * sxy - sx * sy) / payda;    // kg/gün
  return {
    ilk: ys[0], son: ys[ys.length - 1],
    degisim: Math.round((ys[ys.length - 1] - ys[0]) * 10) / 10,
    haftalik: Math.round(egim * 7 * 100) / 100
  };
}

/** Bir günün öğün kayıtlarından toplam kalori / makro. */
function gununBeslenme(tarih){
  const l = (UYG.veri.beslenme.kayit && UYG.veri.beslenme.kayit[tarih]) || [];
  return l.reduce((t, o) => ({
    kalori:  t.kalori  + (+o.kalori  || 0),
    protein: t.protein + (+o.protein || 0),
    karb:    t.karb    + (+o.karb    || 0),
    yag:     t.yag     + (+o.yag     || 0)
  }), { kalori: 0, protein: 0, karb: 0, yag: 0 });
}

/* --- Konum ---------------------------------------------------- */
const BURSA = { lat:40.1826, lng:29.0665, kaynak:"varsayilan" };

function konumuKullan(){
  const k = UYG.veri.konum;
  return (k && typeof k.lat === "number") ? k : BURSA;
}

/* İzin yoksa son bilinen konum, o da yoksa Bursa (§4).
   Konum önbelleğe alınır; her açılışta sorulmaz. */
function konumSor(zorla){
  return new Promise(cozum => {
    if(!("geolocation" in navigator)) return cozum(konumuKullan());
    if(!zorla && UYG.veri.konum) return cozum(UYG.veri.konum);
    navigator.geolocation.getCurrentPosition(
      p => {
        UYG.veri.konum = {
          lat: +p.coords.latitude.toFixed(4),
          lng: +p.coords.longitude.toFixed(4),
          kaynak: "cihaz",
          zaman: Date.now()
        };
        kaydet();
        cozum(UYG.veri.konum);
      },
      () => cozum(konumuKullan()),
      { enableHighAccuracy:false, timeout:9000, maximumAge:6*3600*1000 }
    );
  });
}

/* --- Vakit verisi --------------------------------------------- */
const ALADHAN = "https://api.aladhan.com/v1/timings/";
const ALANLAR = ["Fajr","Sunrise","Dhuhr","Asr","Maghrib","Isha"];

function ddmmyyyy(t){ const p = t.split("-"); return p[2]+"-"+p[1]+"-"+p[0]; }
function gunKaydir(t, adim){
  const p = t.split("-").map(Number);
  const d = new Date(p[0], p[1]-1, p[2]);
  d.setDate(d.getDate() + adim);
  return tarihAnahtar(d);
}
function saatDate(tarih, hhmm){
  const t = tarih.split("-").map(Number);
  const s = String(hhmm).split(":").map(Number);
  return new Date(t[0], t[1]-1, t[2], s[0], s[1], 0, 0);
}

function vakitAnahtari(tarih, konum){
  return tarih + "|" + konum.lat + "," + konum.lng;
}

/* Uçak modunda çökmemek için her cevap önbelleğe yazılır (§14). */
async function vakitGetir(tarih, konum){
  const anh = vakitAnahtari(tarih, konum);
  const onbellek = UYG.veri.vakitler[anh];
  if(onbellek) return onbellek;

  const url = ALADHAN + ddmmyyyy(tarih) +
    "?latitude=" + konum.lat + "&longitude=" + konum.lng + "&method=13";
  const cevap = await fetch(url, { cache:"no-store" });
  if(!cevap.ok) throw new Error("aladhan " + cevap.status);
  const veri = await cevap.json();
  const ham = veri && veri.data && veri.data.timings;
  if(!ham) throw new Error("vakit verisi boş geldi");

  const temiz = {};
  for(const a of ALANLAR){
    if(!ham[a]) throw new Error("eksik alan: " + a);
    temiz[a] = String(ham[a]).split(" ")[0];   // "05:01 (+03)" -> "05:01"
  }
  UYG.veri.vakitler[anh] = temiz;
  vakitleriBuda();
  kaydet();
  return temiz;
}

/* Geriye dönük tarama (§5) 60 güne kadar gidebilir. Gün gün sorsak 60 istek olurdu;
   takvim uç noktası bir ayı tek seferde verir. */
async function ayGetir(ay, konum){          // ay: "2026-09"
  const p = ay.split("-");
  const url = "https://api.aladhan.com/v1/calendar/" + p[0] + "/" + Number(p[1]) +
    "?latitude=" + konum.lat + "&longitude=" + konum.lng + "&method=13";
  const cevap = await fetch(url, { cache:"no-store" });
  if(!cevap.ok) throw new Error("aladhan takvim " + cevap.status);
  const veri = await cevap.json();
  const gunler = veri && veri.data;
  if(!Array.isArray(gunler)) throw new Error("takvim verisi boş geldi");

  for(const g of gunler){
    const gr = g.date && g.date.gregorian && g.date.gregorian.date;   // "DD-MM-YYYY"
    if(!gr || !g.timings) continue;
    const q = gr.split("-");
    const tarih = q[2] + "-" + q[1] + "-" + q[0];
    const temiz = {};
    let tam = true;
    for(const a of ALANLAR){
      if(!g.timings[a]){ tam = false; break; }
      temiz[a] = String(g.timings[a]).split(" ")[0];
    }
    if(tam) UYG.veri.vakitler[vakitAnahtari(tarih, konum)] = temiz;
  }
  vakitleriBuda();
  kaydet();
}

/* İstenen günlerin hepsi önbellekte olsun. Eksikler ay ay çekilir. */
async function vakitleriHazirla(tarihler, konum){
  const eksik = tarihler.filter(t => !UYG.veri.vakitler[vakitAnahtari(t, konum)]);
  if(!eksik.length) return true;

  const aylar = [...new Set(eksik.map(t => t.slice(0,7)))];
  for(const ay of aylar){
    try{ await ayGetir(ay, konum); }
    catch(e){ console.warn("ay alınamadı: " + ay, e); }
  }
  // Takvim tutmadıysa kalanları tek tek dene.
  for(const t of tarihler){
    if(UYG.veri.vakitler[vakitAnahtari(t, konum)]) continue;
    try{ await vakitGetir(t, konum); }catch(e){ /* aşağıda eksik sayılır */ }
  }
  return tarihler.every(t => UYG.veri.vakitler[vakitAnahtari(t, konum)]);
}

/* Önbellek sonsuza kadar büyümesin: en fazla 80 gün tutulur. */
function vakitleriBuda(){
  const anahtarlar = Object.keys(UYG.veri.vakitler);
  if(anahtarlar.length <= 80) return;
  anahtarlar.sort();
  for(const a of anahtarlar.slice(0, anahtarlar.length - 80)) delete UYG.veri.vakitler[a];
}

/* --- Vakit aralıkları (§4) ------------------------------------ */
const VAKITLER = [
  { a:"sabah",  ad:"Sabah",  bas:"Fajr",    bit:"Sunrise" },
  { a:"ogle",   ad:"Öğle",   bas:"Dhuhr",   bit:"Asr"     },
  { a:"ikindi", ad:"İkindi", bas:"Asr",     bit:"Maghrib" },
  { a:"aksam",  ad:"Akşam",  bas:"Maghrib", bit:"Isha"    },
  { a:"yatsi",  ad:"Yatsı",  bas:"Isha",    bit:null      }   // ertesi günün Fajr'ı
];

function araliklar(tarih, bugunku, ertesi){
  return VAKITLER.map(v => ({
    a: v.a,
    ad: v.ad,
    bas: saatDate(tarih, bugunku[v.bas]),
    bit: v.bit ? saatDate(tarih, bugunku[v.bit])
               : saatDate(gunKaydir(tarih,1), ertesi.Fajr)
  }));
}

/* Güneş ile öğle arası: aktif vakit yoktur (§4). */
function aktifAralik(liste, an){
  for(const v of liste) if(an >= v.bas && an < v.bit) return v;
  return null;
}
function siradakiAralik(liste, an){
  for(const v of liste) if(an < v.bas) return v;
  return null;
}

/* --- Gün kaydı ------------------------------------------------ */
function gunKaydi(tarih){
  let g = UYG.veri.gunler[tarih];
  if(!g){
    g = UYG.veri.gunler[tarih] = { namaz:{}, maddeler:[], su:0, gununNotu:"" };
  }
  if(!g.namaz) g.namaz = {};
  return g;
}

/* Üç durum: yok · "vaktinde" · "kaza" (§4). Hepsi geri alınabilir.
   Vakti kapanmış ve taramadan geçmiş bir namazın işareti değişirse borç da
   değişir — §5: "Bugünün geçmiş bir vaktini kaza olarak işaretlemek de aynı
   sayacı düşürür." Geri alma da simetrik olarak sayacı geri yükler. */
function namazIsaretle(tarih, vakit, durum){
  const g     = gunKaydi(tarih);
  const eski  = g.namaz[vakit] || null;
  if(durum) g.namaz[vakit] = durum;
  else delete g.namaz[vakit];

  if(islenmisMi(tarih, vakit)){
    if(!eski && durum) borcDegistir(vakit, -1);
    else if(eski && !durum) borcDegistir(vakit, +1);
  }

  kaydet();
  namazCiz();
  kazaCiz();
}

/* --- Süre biçimi ---------------------------------------------- */
function sureMetni(ms){
  if(ms < 0) ms = 0;
  const dk = Math.floor(ms / 60000);
  const sa = Math.floor(dk / 60);
  const kdk = dk % 60;
  if(sa > 0) return sa + " sa " + kdk + " dk";
  if(dk > 0) return dk + " dk";
  return Math.max(0, Math.floor(ms/1000)) + " sn";
}

const $gunluk = document.getElementById("b-gunluk");

/* Bugün görünümünün üstü: seri bandı + üç ilerleme halkası.

  const g     = gunKaydi(bugun);
  const nOk   = gununNamazSayisi(bugun);

  const alt = nOk >= 5 ? "bugün tamam"
            : seri === 0 ? "bugünü tamamla, seriyi başlat"

        '<div class="sonuk">' + alt + '</div></div>' +
      '<span class="seri-hafta">' + hafta + '</span>' +
    '</div>' +
    '<div class="halkalar">' +
      kutu(nOk, 5, "var(--vakit)", "Namaz") +
      kutu(su, SU_HEDEFI, "var(--su)", "Su") +
      kutu(mOk, md.length || 1, "var(--tamam)", "Plan") +
      (kh ? kutu(kal, kh.hedef, "var(--alev)", "Kalori", "" + kal) : "") +

}

function namazCiz(){
  const d = UYG.namaz;
  if(!d || !d.liste){
    $namaz.innerHTML = '<p class="yukleniyor">Vakitler alınıyor…</p>' +
      (d && d.hata ? '<p class="hata">' + kacir(d.hata) + '</p>' : '');
    return;
  }

  const an     = new Date();
  const aktif  = aktifAralik(d.liste, an);
  const sonra  = siradakiAralik(d.liste, an);
  const kayit  = gunKaydi(d.tarih).namaz;

  vurguyuAyarla(aktif ? aktif.a : (UYG.namaz.sonAktif || "yatsi"));
  if(aktif) UYG.namaz.sonAktif = aktif.a;

  let ust;
  if(aktif){
    const kalan = aktif.bit - an;
    const oran  = Math.max(0, Math.min(1, kalan / (aktif.bit - aktif.bas)));
    ust =
      '<div class="simdi">' +
        '<div class="halka-hero">' + halkaSVG(1 - oran, 1, "var(--vakit)", 4.5) +
          '<div class="ortak">' +
            '<h1 class="vakit-ad">' + aktif.ad + '</h1>' +
            '<span class="sonuk">şu an ' + ss(an) + '</span>' +
          '</div>' +
        '</div>' +
        '<p class="kalan">çıkmasına <span class="sure">' + sureMetni(kalan) + '</span></p>' +
        '<div class="cubuk" role="presentation"><i style="width:' + (oran*100).toFixed(2) + '%"></i></div>' +
      '</div>';
  } else if(sonra){
    ust =
      '<div class="simdi">' +
        '<h1 class="vakit-ad bos">sıradaki: ' + sonra.ad + ' ' + ss(sonra.bas) + '</h1>' +
        '<p class="kalan"><span class="sure">' + sureMetni(sonra.bas - an) + '</span> sonra</p>' +
      '</div>';
  } else {
    ust = '<div class="simdi"><h1 class="vakit-ad bos">vakitler yükleniyor</h1></div>';
  }

  const satirlar = d.liste.map(v => {
    const durum  = kayit[v.a];
    const gecmis = an >= v.bit;
    const suAn   = aktif && aktif.a === v.a;

    let dugme;
    if(durum === "vaktinde"){
      dugme = '<button class="n-durum tamam" data-geri="' + v.a + '" title="geri al">' +
              '<span class="nokta"></span>vaktinde</button>';
    } else if(durum === "kaza"){
      dugme = '<button class="n-durum kaza" data-geri="' + v.a + '" title="geri al">' +
              '<span class="nokta"></span>kaza</button>';
    } else if(gecmis){
      dugme = '<button class="n-durum eylem-sessiz" data-kaza="' + v.a + '">' +
              '<span class="nokta"></span>kaza kıldım</button>';
    } else if(an >= v.bas){
      dugme = '<button class="n-durum eylem" data-kildim="' + v.a + '">kıldım</button>';
    } else {
      dugme = '<span class="n-durum"></span>';
    }

    const sinif = (suAn ? "aktif " : "") + (gecmis && !durum ? "gecmis" : "");
    return '<li class="' + sinif.trim() + '">' +
             '<span class="n-nokta" style="background:' + VAKIT_RENK[v.a] + '"></span>' +
             '<span class="n-saat">' + ss(v.bas) + '</span>' +
             '<span class="n-ad">' + v.ad + '</span>' +
             dugme +
           '</li>';
  }).join("");

  const konum = konumuKullan();
  const konumMetni = konum.kaynak === "cihaz" ? "konumuna göre" : "Bursa'ya göre";

  $namaz.innerHTML =
    ust +
    '<ul class="ray namaz-liste">' + satirlar + '</ul>' +
    '<div class="namaz-alt">' +
      '<span class="sonuk">' + konumMetni + (d.eski ? " · kayıtlı vakitler" : "") + '</span>' +
      '<button class="dg dg-sonuk" id="konum-yenile">konumu güncelle</button>' +
    '</div>' +
    (d.hata ? '<p class="hata">' + kacir(d.hata) + '</p>' : '');

  gunlukCiz();
}

function ss(d){ return iki(d.getHours()) + ":" + iki(d.getMinutes()); }
function kacir(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

/* Tıklamalar — liste her çizimde yenilendiği için olay delegasyonu. */
$namaz.addEventListener("click", e => {
  const d = e.target.closest("button");
  if(!d || !UYG.namaz) return;
  const t = UYG.namaz.tarih;
  if(d.dataset.kildim) namazIsaretle(t, d.dataset.kildim, "vaktinde");
  else if(d.dataset.kaza) namazIsaretle(t, d.dataset.kaza, "kaza");
  else if(d.dataset.geri) namazIsaretle(t, d.dataset.geri, null);
  else if(d.id === "konum-yenile") konumSor(true).then(() => namazKur(true));
});

/* --- Kurulum -------------------------------------------------- */
async function namazKur(yeniden){
  const tarih = uygulamaGunu();
  const konum = konumuKullan();
  UYG.namaz = UYG.namaz || {};
  UYG.namaz.tarih = tarih;

  try{
    const bugunku = await vakitGetir(tarih, konum);
    const ertesi  = await vakitGetir(gunKaydir(tarih, 1), konum);   // yatsının bitişi için
    UYG.namaz.liste = araliklar(tarih, bugunku, ertesi);
    UYG.namaz.hata  = null;
    UYG.namaz.eski  = false;
  }catch(err){
    console.warn("vakitler alınamadı", err);
    // Ağ yoksa aynı tarihe ait başka bir konumun önbelleği varsa onu kullan.
    const yedek  = enYakinOnbellek(tarih);
    const yedek2 = enYakinOnbellek(gunKaydir(tarih, 1));
    if(yedek && yedek2){
      UYG.namaz.liste = araliklar(tarih, yedek, yedek2);
      UYG.namaz.eski  = true;
      UYG.namaz.hata  = "Ağ yok; kayıtlı vakitler gösteriliyor.";
    }else if(!UYG.namaz.liste){
      UYG.namaz.hata = "Vakitler alınamadı. Bağlantı gelince yenilenecek.";
    }
  }
  namazCiz();
  alarmCiz();          // yarının imsağı vakitler gelince belli olur
  if(!yeniden) namazSaati();
}

function enYakinOnbellek(tarih){
  for(const anh of Object.keys(UYG.veri.vakitler)){
    if(anh.indexOf(tarih + "|") === 0) return UYG.veri.vakitler[anh];
  }
  return null;
}

/* Saniyede bir yeniden çiz; gün veya vakit değişince yeniden kur. */
function namazSaati(){
  setInterval(() => {
    if(!UYG.namaz || !UYG.namaz.liste) return;
    const yeniGun = uygulamaGunu();
    if(yeniGun !== UYG.namaz.tarih){ namazKur(true); return; }
    const son = UYG.namaz.liste[UYG.namaz.liste.length - 1];
    if(new Date() >= son.bit){ namazKur(true); return; }
    namazCiz();
    if(new Date().getSeconds() % 30 === 0) bildirimTara();   // §8.6
  }, 1000);
}

/* ===============================================================
   §5 — Kaza borcu (birikimli)
   =============================================================== */

const TARAMA_GUN = 60;                      // daha eskisine bakılmaz (§5)

function islenmisAnahtar(tarih, vakit){ return tarih + "|" + vakit; }
function islenmisMi(tarih, vakit){
  return UYG.veri.islenmisVakitler.indexOf(islenmisAnahtar(tarih, vakit)) !== -1;
}
function borcDegistir(vakit, delta){
  const b = UYG.veri.borc;
  b[vakit] = Math.max(0, (b[vakit] || 0) + delta);   // sıfırın altına inmez (§5)
}
function toplamBorc(){
  return VAKITLER.reduce((t, v) => t + (UYG.veri.borc[v.a] || 0), 0);
}

/* İşlenmiş liste de sonsuza kadar büyümesin. */
function islenmisBuda(bugun){
  const sinir = gunKaydir(bugun, -(TARAMA_GUN + 5));
  UYG.veri.islenmisVakitler = UYG.veri.islenmisVakitler.filter(a => a.split("|")[0] >= sinir);
}

/**
 * Son kontrolden şimdiye kadar kapanmış bütün vakitleri tarar.
 * `islenmisVakitler` sayesinde aynı vakit iki kez sayılmaz — bu liste olmadan
 * uygulamayı günde beş kez açan biri beş kat borç görür (§5).
 */
async function borcTara(){
  const bugun = uygulamaGunu();
  const konum = konumuKullan();
  const an    = new Date();

  // İlk açılış: kurulumdan önceki vakitler borç sayılmaz. Bugünün kapanmış
  // vakitleri borç eklemeden "işlenmiş" yazılır, borç sıfırdan başlar.
  const ilkAcilis = !UYG.veri.sonKontrol;
  const basla = ilkAcilis
    ? bugun
    : (UYG.veri.sonKontrol < gunKaydir(bugun, -TARAMA_GUN)
        ? gunKaydir(bugun, -TARAMA_GUN)
        : UYG.veri.sonKontrol);

  const gunler = [];
  for(let t = basla; t <= bugun; t = gunKaydir(t, 1)) gunler.push(t);

  // Yatsının bitişi için son günün ertesi de gerekir.
  const gerekli = gunler.concat([gunKaydir(bugun, 1)]);
  const tamam = await vakitleriHazirla(gerekli, konum);

  let eklenen = 0;
  for(const t of gunler){
    const bugunku = UYG.veri.vakitler[vakitAnahtari(t, konum)];
    const ertesi  = UYG.veri.vakitler[vakitAnahtari(gunKaydir(t,1), konum)];
    if(!bugunku || !ertesi) continue;                 // veri yoksa bu gün atlanır

    const kayit = (UYG.veri.gunler[t] && UYG.veri.gunler[t].namaz) || {};
    for(const v of araliklar(t, bugunku, ertesi)){
      if(an < v.bit) continue;                        // vakit henüz tamamen kapanmadı
      const anh = islenmisAnahtar(t, v.a);
      if(UYG.veri.islenmisVakitler.indexOf(anh) !== -1) continue;
      UYG.veri.islenmisVakitler.push(anh);
      if(!kayit[v.a] && !ilkAcilis){ borcDegistir(v.a, +1); eklenen++; }
    }
  }

  // Bütün günler çözülemediyse sonKontrol ilerletilmez; bağlantı gelince tekrar denenir.
  if(tamam) UYG.veri.sonKontrol = bugun;
  else if(ilkAcilis) UYG.veri.sonKontrol = bugun;     // ilk açılışta yine de başlat

  islenmisBuda(bugun);
  kaydet();
  kazaCiz();
  if(eklenen) console.info("kaza borcuna eklenen vakit:", eklenen);
}

/* --- Çizim ---------------------------------------------------- */
const $kaza = document.getElementById("b-kaza");

function kazaCiz(){
  if(toplamBorc() === 0){                             // borç yoksa bölüm hiç görünmez (§5)
    $kaza.hidden = true;
    $kaza.innerHTML = "";
    return;
  }
  $kaza.hidden = false;

  const satirlar = VAKITLER
    .filter(v => (UYG.veri.borc[v.a] || 0) > 0)       // borcu olmayan tür listede yok (§5)
    .map(v =>
      '<li>' +
        '<span class="k-ad">' + v.ad + '</span>' +
        '<span class="k-sayi">' + UYG.veri.borc[v.a] + '</span>' +
        '<button class="dg dg-sonuk" data-ode="' + v.a + '">kaza kıldım</button>' +
      '</li>')
    .join("");

  $kaza.innerHTML =
    '<h2 class="bolum-bas">Kaza<span class="rozet">' + toplamBorc() + '</span></h2>' +
    '<ul class="kaza-liste">' + satirlar + '</ul>';
}

$kaza.addEventListener("click", e => {
  const d = e.target.closest("[data-ode]");
  if(!d) return;
  borcDegistir(d.dataset.ode, -1);                    // kullanıcı kaza kıldı
  kaydet();
  kazaCiz();
});

/* ===============================================================
   §8 — Alarm
   Birincil yöntem cihaza göre değişir: Android'de 8.1 intent, iPhone'da 8.7
   Kısayollar. İkisi de telefonun kendi saat uygulamasına gerçek alarm kurar —
   bildirim değil. Yanında 8.6 uygulama içi bildirim ve isteğe bağlı 8.2 ntfy.
   Gerekçesi README'de.
   =============================================================== */

const $alarm = document.getElementById("b-alarm");
let alarmMesaj = "";

/* --- 8.1 Android intent --------------------------------------- */
function intentAdresi(saat, dakika, mesaj){
  return "intent://#Intent;" +
    "action=android.intent.action.SET_ALARM;" +
    "i.android.intent.extra.alarm.HOUR=" + saat + ";" +
    "i.android.intent.extra.alarm.MINUTES=" + dakika + ";" +
    "S.android.intent.extra.alarm.MESSAGE=" + encodeURIComponent(mesaj) + ";" +
    "B.android.intent.extra.alarm.SKIP_UI=true;" +
    "end";
}
function androidMi(){ return /Android/i.test(navigator.userAgent || ""); }
function iosMu(){
  const ua = navigator.userAgent || "";
  // iPadOS 13+ kendini Mac gibi tanıtıyor; dokunma noktasından ayırt ediliyor.
  return /iPad|iPhone|iPod/.test(ua) ||
         (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}
function platform(){ return iosMu() ? "ios" : androidMi() ? "android" : "bilinmiyor"; }

/* --- 8.7 iOS: Kısayollar ile gerçek alarm --------------------- */
/* Saat uygulamasının açık bir URL şeması yok, ama Kısayollar'ın "Alarm Oluştur"
   eylemi var ve bir kısayol shortcuts:// ile dışarıdan çalıştırılabiliyor.
   Kurulan şey intent'le aynı cinstendir: Saat uygulamasında gerçek bir alarm,
   sessiz modda çalar, Rahatsız Etmeyin'i deler. Farkı, bir kerelik kısayol
   kurulumu istemesi — bu yüzden yönerge düğmenin hemen altında duruyor.
   Kısayola giden metin yalnız "SS:DD"; etiket kısayolun içinde sabit, çünkü
   ayrıştırma her eklenen eylemde kurulum maliyetini artırıyor (§8 ölçüt 2). */
/* İki ayrı kısayol, çünkü tekrar ayarı kısayolun içinde duruyor ve dışarıdan
   verilemiyor: namaz alarmı tek seferlik (imsak her gün kayıyor, ertesi gün
   yenisi kurulur), kalkış alarmı her gün tekrarlı. Tek kısayolda ayırmak için
   metni bölüp koşula sokmak gerekirdi — kurulum maliyeti iki katına çıkardı. */
const KISAYOL_VARSAYILAN        = "Ledger Alarm";     // tek seferlik
const KISAYOL_KALKIS_VARSAYILAN = "Ledger Kalkış";    // her gün tekrarlı
function kisayolAdi(tur){
  return tur === "kalkis"
    ? (UYG.veri.ayar.kisayolKalkis || KISAYOL_KALKIS_VARSAYILAN)
    : (UYG.veri.ayar.kisayol || KISAYOL_VARSAYILAN);
}
/** Uygulama ana ekrandan mı açıldı (tarayıcı kabuğu yok). */
function anaEkrandaMi(){
  if(navigator.standalone === true) return true;      // iOS'un kendi bayrağı
  return !!(window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
}
/* x-success yalnız tarayıcıdayken veriliyor. Ana ekrandan açıldığında iOS o
   https adresini Safari'de açıyor ve kullanıcıyı uygulamanın tarayıcı
   kopyasına düşürüyor — alarm kuruluyor ama yanlış uygulamada uyanıyorsun.
   Parametre yokken kısayol bitince Kısayollar'da kalınıyor; geri dönüş bir
   kaydırma, yanlış uygulamaya atılmaktan iyi. */
function kisayolAdresi(saat, dakika, tur){
  return "shortcuts://x-callback-url/run-shortcut" +
    "?name=" + encodeURIComponent(kisayolAdi(tur)) +
    "&input=text" +
    "&text=" + encodeURIComponent(iki(saat) + ":" + iki(dakika)) +
    (anaEkrandaMi() ? "" : "&x-success=" + encodeURIComponent(location.href.split("#")[0]));
}
/** Cihaza uygun alarm bağlantısı. Bilinmeyen cihazda intent denenir (§8.1).
    Android'de tekrar yok: SET_ALARM'ın DAYS ek bilgisi ArrayList<Integer> ve
    intent URI şemasında dizi yazılamıyor — orada kalkış da tek seferlik. */
function alarmAdresi(tur){
  const b = alarmBilgisi(tur);
  if(!b) return "";
  return platform() === "ios" ? kisayolAdresi(b.saat, b.dakika, tur)
                              : intentAdresi(b.saat, b.dakika, b.mesaj);
}

/* Kalkış saati: yarının planı yoksa bugünün uyku maddesinden, o da yoksa 08:00.
   Kullanıcı elle değiştirebilir; değiştirdiği saat saklanır. */
function kalkisSaati(){
  if(UYG.veri.ayar.kalkis) return UYG.veri.ayar.kalkis;
  const yarin = UYG.veri.gunler[gunKaydir(uygulamaGunu(), 1)];
  const bugun = UYG.veri.gunler[uygulamaGunu()];
  for(const g of [yarin, bugun]){
    if(!g || !g.maddeler) continue;
    const uyku = saatSirala(g.maddeler.filter(m => m.tur === "uyku" && m.saat));
    if(uyku.length) return uyku[0].saat;
  }
  return "08:00";
}

/* Yarının sabah namazı: bugünün listesindeki yatsının bitişi zaten yarının
   imsağıdır, o yüzden ek istek gerekmez. */
function yarininImsagi(){
  const l = UYG.namaz && UYG.namaz.liste;
  if(!l || !l.length) return null;
  return l[l.length - 1].bit;      // yatsının bitişi = ertesi günün Fajr'ı
}

/* Namaz alarmı yarın için kurulur ve orada biter; kaydı da o güne bağlı.
   Kalkış alarmı her gün tekrarladığı için güne değil saate bağlı: kullanıcı
   kalkış saatini değiştirmedikçe "kurulu" sayılır. İkinci kez kurmak Saat
   uygulamasında ikinci bir tekrarlı alarm bırakırdı. */
function alarmKuruldu(tur){
  const k = UYG.veri.ayar.alarmKuruldu || {};
  if(tur === "kalkis") return k.kalkis === kalkisSaati();
  return k[tur] === gunKaydir(uygulamaGunu(), 1);
}
function alarmIsaretle(tur){
  const k = UYG.veri.ayar.alarmKuruldu || (UYG.veri.ayar.alarmKuruldu = {});
  if(tur === "kalkis"){ k.kalkis = kalkisSaati(); kaydet(); return; }
  k[tur] = gunKaydir(uygulamaGunu(), 1);         // hangi gün için kurulduğu
  for(const a of Object.keys(k))
    if(a !== "kalkis" && k[a] < uygulamaGunu()) delete k[a];
  kaydet();
}

/** Bir alarmın saati, dakikası ve etiketi. Vakitler gelmediyse null. */
function alarmBilgisi(tur){
  if(tur === "namaz"){
    const imsak = yarininImsagi();
    if(!imsak) return null;
    return { saat: imsak.getHours(), dakika: imsak.getMinutes(), mesaj: "Sabah namazı" };
  }
  const p = kalkisSaati().split(":");
  return { saat: +p[0], dakika: +p[1], mesaj: "Kalk" };
}

/* Kurma işini bağlantının kendisi yapıyor (intent:// veya shortcuts://);
   burada yalnız kayıt tutulup ne olduğu yazılıyor. Tarayıcı kimliğine bakıp
   denemeyi reddetmiyoruz: "masaüstü sitesi iste" açıkken telefon da masaüstü
   görünüyor ve denemenin maliyeti yok. Olmadığında saat zaten ekranda (§8.1). */
function alarmKur(tur){
  const b = alarmBilgisi(tur);
  if(!b){ alarmMesaj = "Vakitler henüz gelmedi."; alarmCiz(); return; }
  alarmIsaretle(tur);
  const saat = iki(b.saat) + ":" + iki(b.dakika);
  alarmMesaj = platform() === "ios"
    ? saat + " için: Kısayollar “kısayol bulunamadı” dediyse bu adda bir kısayol " +
      "yok — aşağıdaki kutuya kısayolun tam adını yaz ya da kurulumu yap. " +
      "Kısayollar hiç açılmadıysa bağlantı çalışmıyor. Açılıp kapandıysa Saat " +
      "uygulamasında alarmın göründüğünü doğrula."
    : saat + " için saat uygulaması açılmadıysa alarm kurulmamıştır; o saati elle kur." +
      (androidMi() ? "" : " (Bu tarayıcı Android görünmüyor, muhtemelen kurulmadı.)");
  alarmCiz();
}

/* --- 8.5 iOS: alarm değil, takvim bildirimi ------------------- */
function icsUret(){
  const imsak = yarininImsagi();
  if(!imsak) return null;
  const z = d => d.getUTCFullYear() + iki(d.getUTCMonth()+1) + iki(d.getUTCDate()) +
                 "T" + iki(d.getUTCHours()) + iki(d.getUTCMinutes()) + "00Z";
  const p = kalkisSaati().split(":");
  const yarin = gunKaydir(uygulamaGunu(), 1);
  const kalkis = saatDate(yarin, kalkisSaati());

  /* Kalkış her gün tekrarlı (§8.7), imsak değil: imsak vakti her gün kayıyor,
     tekrarlı bir olay birkaç hafta sonra yanlış saati gösterirdi. */
  const olay = (bas, ad, hergun) =>
    "BEGIN:VEVENT\r\n" +
    "UID:" + ad.replace(/\s/g,"") + "-" + z(bas) + "@ledger\r\n" +
    "DTSTAMP:" + z(new Date()) + "\r\n" +
    "DTSTART:" + z(bas) + "\r\n" +
    (hergun ? "RRULE:FREQ=DAILY\r\n" : "") +
    "DURATION:PT15M\r\n" +
    "SUMMARY:" + ad + "\r\n" +
    "BEGIN:VALARM\r\nTRIGGER:PT0M\r\nACTION:DISPLAY\r\nDESCRIPTION:" + ad + "\r\nEND:VALARM\r\n" +
    "END:VEVENT\r\n";

  return "BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Ledger//TR\r\n" +
    olay(imsak, "Sabah namazı", false) + olay(kalkis, "Kalk", true) +
    "END:VCALENDAR\r\n";
}
function icsIndir(){
  const metin = icsUret();
  if(!metin){ alarmMesaj = "Vakitler henüz gelmedi."; alarmCiz(); return; }
  const b = new Blob([metin], { type:"text/calendar;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b);
  a.download = "ledger-yarin.ics";
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* Kısayol bir kez kurulur. Kurulmadan "kur" yalnız Kısayollar'ı açar, o yüzden
   yönerge ayarlara gömülmüyor — düğmenin hemen altında, kapalı duruyor. */
function kisayolKurulumu(){
  const ad     = kacir(kisayolAdi());
  const adKalk = kacir(kisayolAdi("kalkis"));
  return '<details class="kisayol">' +
    '<summary class="sonuk">bir kerelik kurulum — iki kısayol</summary>' +
    '<ol class="sonuk kisayol-adim">' +
      '<li>Kısayollar (<i>Shortcuts</i>) uygulamasını aç, sağ üstteki + ile ' +
        'yeni kısayol yap.</li>' +
      '<li><b>Metinden Tarih Al</b> (<i>Get Dates from Input</i>) eylemini ekle; ' +
        'girdisi <b>Kısayol Girdisi</b> (<i>Shortcut Input</i>) olsun.</li>' +
      '<li><b>Alarm Oluştur</b> (<i>Create Alarm</i>) eylemini ekle; saatine bir ' +
        'önceki adımın <b>Tarih</b> (<i>Dates</i>) değişkenini koy, etiketine ne ' +
        'istersen yaz.</li>' +
      '<li>Kısayolun adını <b>' + ad + '</b> yap ve kaydet. Ad buradakiyle ' +
        'birebir aynı olmalı — Kısayollar adı harfi harfine arıyor.</li>' +
      '<li>Kalkış için ikincisi: bu kısayola uzun bas → <b>Çoğalt</b> ' +
        '(<i>Duplicate</i>), adını <b>' + adKalk + '</b> yap, içindeki ' +
        '<b>Alarm Oluştur</b> eyleminde <b>Tekrarla</b> (<i>Repeat</i>) → ' +
        '<b>Her Gün</b> (<i>Every Day</i>) seç.</li>' +
    '</ol>' +
    '<div class="plan-alt">' +
      '<label class="sonuk" for="al-kisayol">namaz kısayolu</label>' +
      '<input type="text" id="al-kisayol" value="' + ad + '" ' +
        'style="width:10em" aria-label="namaz kısayolunun adı">' +
    '</div>' +
    '<div class="plan-alt" style="margin-top:8px">' +
      '<label class="sonuk" for="al-kisayol-kalkis">kalkış kısayolu</label>' +
      '<input type="text" id="al-kisayol-kalkis" value="' + adKalk + '" ' +
        'style="width:10em" aria-label="kalkış kısayolunun adı">' +
    '</div>' +
    '<p class="sonuk" style="margin:10px 0 0">' +
      'Kurulan şey gerçek alarmdır: Saat uygulamasında görünür, sessiz modda çalar, ' +
      'Rahatsız Etmeyin’i deler. Kısayol ilk çalışmada bir kez onay ister; ' +
      'onayı kısayolun ayarlarından (<i>Ask Before Running</i>) kapatabilirsin. ' +
      'Kısayollarının adı başkaysa yukarıdaki kutulara onları yaz; kısayolları ' +
      'yeniden adlandırman gerekmez. Eylem adları telefonun diline göre değişir, ' +
      'yukarıda ikisi de yazılı. Alarm kurulduktan sonra: Safari’den açtıysan ' +
      'sayfaya kendiliğinden dönersin, ana ekrandaki uygulamadan açtıysan ' +
      'Kısayollar’da kalırsın — Ledger’a geçmen yeter.' +
    '</p>' +
  '</details>';
}

function alarmCiz(){
  const imsak  = yarininImsagi();
  const kalkis = kalkisSaati();
  const yarin  = gunKaydir(uygulamaGunu(), 1);

  const satir = (tur, saat, ad) => {
    // Safari intent:// şemasını tanımıyor ("adres geçersiz"), Android da
    // shortcuts:// bilmiyor; her cihaza kendi şeması basılıyor (§8.1, §8.7).
    const adres = alarmAdresi(tur);
    const eylem =
      '<a class="dg ' + (alarmKuruldu(tur) ? "dg-sonuk" : "dg-bir") + '" ' +
      'href="' + kacir(adres) + '" data-alarm="' + tur + '">' +
      (alarmKuruldu(tur) ? "yeniden kur" : "kur") +
      '</a>';
    return '<li>' +
      '<span class="al-saat">' + saat + '</span>' +
      '<span class="al-ad">' + ad + '</span>' + eylem +
    '</li>';
  };

  $alarm.innerHTML =
    '<h2 class="bolum-bas">Yarın<span class="yan">' + tarihYaz(yarin) + '</span></h2>' +
    '<ul class="alarm-liste">' +
      (imsak ? satir("namaz", ss(imsak), "Sabah namazı") : "") +
      satir("kalkis", kalkis, "Kalk · her gün") +
    '</ul>' +
    '<div class="plan-alt">' +
      '<label class="sonuk" for="al-kalkis">kalkış</label>' +
      '<input type="time" id="al-kalkis" value="' + kalkis + '" ' +
        'style="width:6.6em" aria-label="kalkış saati">' +
      '<button class="dg dg-sonuk" id="al-ics">takvime ekle (.ics)</button>' +
    '</div>' +
    '<p class="sonuk" style="margin:10px 0 0">' +
      "Alarm telefonun kendi saat uygulamasına kurulur; sessiz modda da çalar. " +
      "Kalkış alarmı her gün tekrarlar, sabah namazı alarmı tek seferliktir — " +
      "imsak her gün kaydığı için ertesi gün yeniden kurulur. " +
      ".ics dosyası alarm değildir, yalnız takvim bildirimi verir." +
    '</p>' +
    (alarmKuruldu("kalkis")
      ? '<p class="sonuk" style="margin:8px 0 0">' +
          "Kalkış alarmı " + kacir(kalkis) + " için kurulu ve her gün tekrarlıyor; " +
          "yeniden kurman gerekmiyor. Kurarsan Saat uygulamasında ikinci bir alarm " +
          "olur. Saati değiştirirsen eskisini Saat uygulamasından sil." +
        '</p>'
      : "") +
    (alarmMesaj ? '<p class="sonuk" style="margin:8px 0 0">' + kacir(alarmMesaj) + '</p>' : "") +
    (platform() === "ios" ? kisayolKurulumu() : "");
}

$alarm.addEventListener("click", e => {
  const d = e.target.closest("[data-alarm],#al-ics");
  if(!d) return;
  if(d.id === "al-ics"){ icsIndir(); return; }
  // Bağlantının kendi gezinmesini engellemiyoruz; intent onu açacak.
  alarmKur(d.dataset.alarm);
});
$alarm.addEventListener("change", e => {
  if(e.target.id === "al-kalkis" && e.target.value){
    UYG.veri.ayar.kalkis = e.target.value;
    kaydet();
    alarmCiz();
  }
  if(e.target.id === "al-kisayol"){
    const ad = (e.target.value || "").trim();
    UYG.veri.ayar.kisayol = ad || KISAYOL_VARSAYILAN;
    kaydet();
    alarmCiz();
  }
  if(e.target.id === "al-kisayol-kalkis"){
    const ad = (e.target.value || "").trim();
    UYG.veri.ayar.kisayolKalkis = ad || KISAYOL_KALKIS_VARSAYILAN;
    kaydet();
    alarmCiz();
  }
});

/* ===============================================================
   §8.6 — Uygulama içi bildirim
   İzin ilk açılışta istenmez; bir düğmenin arkasında durur.
   =============================================================== */

const SU_ARALIK   = 90;      // dakika (§11)
const SU_BAS      = 8, SU_BIT = 21;
const CIKISA_KALA = 20;      // dakika (§8.6)

function bildirimDurumu(){
  if(!("Notification" in window)) return "yok";
  return Notification.permission;             // "default" | "granted" | "denied"
}
async function bildirimIzniIste(){
  if(!("Notification" in window)) return "yok";
  const s = await Notification.requestPermission();
  ayarlarCiz();
  return s;
}
function bildirimGonder(baslik, govde, anahtar){
  if(bildirimDurumu() !== "granted") return false;
  const gonderilen = UYG.veri.ayar.bildirimler || (UYG.veri.ayar.bildirimler = {});
  if(gonderilen[anahtar]) return false;
  gonderilen[anahtar] = 1;
  // Liste şişmesin: yalnız bugünün ve dünün anahtarları kalsın.
  const dun = gunKaydir(uygulamaGunu(), -1);
  for(const a of Object.keys(gonderilen)) if(a.slice(0,10) < dun) delete gonderilen[a];
  kaydet();
  try{
    new Notification(baslik, { body: govde, tag: anahtar, icon: "icons/icon-192.png" });
  }catch(e){ console.warn("bildirim gönderilemedi", e); return false; }
  return true;
}

/* Tek zamanlayıcı: vakit girişi, vakit çıkışına 20 dk, su, plan maddesi. */
function bildirimTara(){
  if(bildirimDurumu() !== "granted") return;
  const an    = new Date();
  const bugun = uygulamaGunu();
  const l     = UYG.namaz && UYG.namaz.liste;

  if(l){
    for(const v of l){
      const girdi = an - v.bas;
      if(girdi >= 0 && girdi < 120000)
        bildirimGonder(v.ad, "Vakit girdi, çıkmasına " + sureMetni(v.bit - an),
                       bugun + "|giris|" + v.a);
      const kalan = v.bit - an;
      if(kalan > 0 && kalan <= CIKISA_KALA * 60000 && an >= v.bas &&
         !(gunKaydi(bugun).namaz || {})[v.a])
        bildirimGonder(v.ad, "Çıkmasına " + sureMetni(kalan), bugun + "|cikis|" + v.a);
    }
  }

  // Su: 08:00–21:00 arası 90 dakikada bir. Gece hatırlatma yok (§11).
  const dk = an.getHours() * 60 + an.getMinutes();
  if(an.getHours() >= SU_BAS && an.getHours() < SU_BIT){
    const yuva = Math.floor((dk - SU_BAS * 60) / SU_ARALIK);
    const hedef = SU_BAS * 60 + yuva * SU_ARALIK;
    if(dk - hedef < 2 && (gunKaydi(bugun).su || 0) < SU_HEDEFI)
      bildirimGonder("Su", "Bir bardak.", bugun + "|su|" + yuva);
  }

  // Plandaki madde başlarken.
  for(const m of gunKaydi(bugun).maddeler || []){
    if(!m.saat || m.yapildi) continue;
    const bas = saatDate(bugun, m.saat);
    const fark = an - bas;
    if(fark >= 0 && fark < 120000)
      bildirimGonder(m.baslik, m.saat + (m.sure ? " · " + m.sure + " dk" : ""),
                     bugun + "|madde|" + m.id);
  }
}

   §8.2 — ntfy (isteğe bağlı ikinci katman)
   =============================================================== */

function topicUret(){
  const harf = "abcdefghijkmnopqrstuvwxyz23456789";
  let s = "ledger-";
  const r = new Uint8Array(16);
  (crypto && crypto.getRandomValues) ? crypto.getRandomValues(r)
    : r.forEach((_, i) => r[i] = Math.floor(Math.random() * 256));
  for(let i = 0; i < 16; i++) s += harf[r[i] % harf.length];
  return s;
}

function cronAdresi(){
  const t = UYG.veri.ayar.ntfy;
  if(!t) return "";
  const k = konumuKullan();
  return location.origin + "/api/push?topic=" + encodeURIComponent(t) +
    "&lat=" + k.lat + "&lng=" + k.lng +
    "&tz=" + encodeURIComponent(Intl.DateTimeFormat().resolvedOptions().timeZone || "Europe/Istanbul") +
    "&pencere=5";
}

async function ntfyDene(){
  const t = UYG.veri.ayar.ntfy;
  if(!t) return;
  ayarlarMesaj = "gönderiliyor…";
  ayarlarCiz();
  try{
    const c = await fetch("api/push?" + new URLSearchParams({ topic:t, deneme:"1" }));
    const j = await c.json().catch(() => ({}));
    ayarlarMesaj = c.ok ? "Deneme bildirimi gönderildi; telefonuna düşmesi gerekiyor."
                        : (j.mesaj || "Gönderilemedi.");
  }catch(e){
    ayarlarMesaj = "Gönderilemedi: ağ yok.";
  }
  ayarlarCiz();
}

const $sohbet = document.getElementById("b-sohbet");
const SOHBET_SINIR = 20;                        // son 20 mesaj saklanır (§10)
let sohbetAcik = true, sohbetMesaj = "";     // plan sekmesinde varsayılan açık

/* Tek dokunuşluk hazır istekler — doğrudan api/chat'e gider, planı günceller. */
const HIZLI_SOHBET = [
  { et: "yorgunum",      cumle: "Bugün yorgunum, planı hafiflet." },
  { et: "koda +1 saat",  cumle: "Kod bloğuna bir saat daha ekle." },
  { et: "koşu akşama",   cumle: "Koşuyu akşama al." },
  { et: "erken yat",     cumle: "Bu gece erken yatmam lazım, akşamı buna göre ayarla." }
];

function sohbetYaz(kim, metin){
  UYG.veri.sohbet.push({ kim: kim, metin: metin, zaman: Date.now() });
  if(UYG.veri.sohbet.length > SOHBET_SINIR)
    UYG.veri.sohbet = UYG.veri.sohbet.slice(-SOHBET_SINIR);
  kaydet();
}

async function sohbetGonder(metin){
  const tarih = uygulamaGunu();
  sohbetYaz("ben", metin);
  sohbetMesaj = "";
  UYG.sohbetBekliyor = true;
  sohbetCiz();

  try{
    const g = gunKaydi(tarih);
    const c = await modelIste("chat", {
      metin: metin,
      tarih: tarih,
      gunAdi: gunAdi(tarih),
      kurs: kursSaati(tarih),
      vakitler: bugununVakitleri(),
      plan: (g.maddeler || []).map(m => ({
        saat:m.saat, sure:m.sure, baslik:m.baslik, tur:m.tur,
        yapildi:!!m.yapildi, not:m.not || ""
      })),
      profil: UYG.veri.profil || "",
      sohbet: UYG.veri.sohbet.slice(0, -1)      // az önce yazdığı hariç
    });

    if(c.planGuncelle && c.planGuncelle.maddeler){
      // İşaretler ve notlar kaybolmasın: başlığı aynı kalan madde durumunu korur.
      const eski = new Map((g.maddeler || []).map(m => [m.baslik, m]));
      g.maddeler = c.planGuncelle.maddeler.map(m => {
        const o = eski.get(m.baslik);
        return {
          id: o ? o.id : yeniId(),
          saat: m.saat || "", sure: m.sure || null,
          baslik: m.baslik, tur: m.tur || "bos", gerekce: m.gerekce || "",
          yapildi: o ? !!o.yapildi : false,
          not: o ? (o.not || "") : "",
          etkinlikId: o ? o.etkinlikId : undefined
        };
      });
      if(c.planGuncelle.gununNotu) g.gununNotu = c.planGuncelle.gununNotu;
      g.planKaynak = "model";
    }

    if(c.etkinlikEkle) etkinlikKaydet(c.etkinlikEkle);

    if(c.profilEki){
      const p = (UYG.veri.profil || "").trim();
      UYG.veri.profil = (p ? p + "\n" : "") + c.profilEki;
      // 400 kelime sınırı (§9): taşarsa en eski satırlar düşer.
      let satir = UYG.veri.profil.split("\n");
      while(satir.join(" ").split(/\s+/).length > 400 && satir.length > 1) satir.shift();
      UYG.veri.profil = satir.join("\n");
    }

    sohbetYaz("model", c.cevap);
    kaydet();
    planCiz();
    etkinlikCiz();
    ayarCiz();

  }catch(e){
    console.warn("sohbet başarısız", e);
    sohbetMesaj = hataMetni(e, "Cevap alınamadı.");
  }finally{
    UYG.sohbetBekliyor = false;
    sohbetCiz();
  }
}

    '<p class="sonuk" style="margin:0 0 10px">Planı değiştir, bir maddeyi sor, ' +

    (mesajlar.length ? '<ul class="sohbet-liste">' + satirlar + '</ul>' : "") +
    (UYG.sohbetBekliyor ? '<p class="sonuk">yazılıyor…</p>' : "") +

    '<div class="s-giris">' +
      '<input type="text" id="s-metin" placeholder="Sabahları koşamıyorum, akşama alalım." ' +
        'autocomplete="off" aria-label="mesaj">' +
      '<button class="dg" id="s-gonder"' + (UYG.sohbetBekliyor ? " disabled" : "") + '>gönder</button>' +
    '</div>' +
    (sohbetMesaj ? '<p class="sonuk" style="margin:8px 0 0">' + kacir(sohbetMesaj) + '</p>' : "");
}

async function modelIste(uc, govde){
  const cevap = await fetch("api/" + uc, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(govde)
  });
  if(!cevap.ok){
    const h = await cevap.json().catch(() => ({}));
    // 503 iki anlama gelir: anahtar yok, ya da model geçici olarak yoğun.
    // Ayırmazsak Google'ın bir anlık sıkışması yapay zekayı kalıcı kapatır.
    if(h.hata === "anahtar-yok"){
      UYG.veri.ayar.yapayZeka = false; kaydet();
      throw new Error("anahtar-yok");
    }
    const hata = new Error(h.mesaj || "Model cevap vermedi.");
    hata.kullaniciya = true;
    throw hata;
  }
  return cevap.json();
}
function hataMetni(e, varsayilan){
  if(e.message === "anahtar-yok") return "Yapay zeka kapalı (GEMINI_API_KEY tanımlı değil).";
  return e.kullaniciya ? e.message : varsayilan;
}
