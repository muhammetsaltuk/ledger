<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledger</title>
<meta name="description" content="Namaz vakitleri, kaza borcu ve günlük düzen.">
<meta name="theme-color" content="#0E1318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..600&amp;family=IBM+Plex+Sans:wght@400;500&amp;display=swap">

<style>
/* ---------------------------------------------------------------
   §13 — Görsel tasarım. Bu değerler karardır, tercih değil.
   --------------------------------------------------------------- */
:root{
  --zemin:#0E1318;
  --yuzey:#171D24;
  --cizgi:#262F39;
  --metin:#E4E7E4;
  --sonuk:#7C8A94;
  --tamam:#6E9C7A;
  --eksik:#A8615C;

  /* Aktif namaz vaktine göre değişen tek vurgu (§13). */
  --vakit:#4A5C8C;

  --bas:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --gov:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;

  --en:520px;
  --bosluk:20px;
  --gecis:800ms;
}
@media (prefers-reduced-motion: reduce){
  :root{ --gecis:0ms; }
  *,*::before,*::after{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
html{ background:var(--zemin); -webkit-text-size-adjust:100%; }
body{
  background:var(--zemin);
  color:var(--metin);
  font-family:var(--gov);
  font-size:1rem;
  line-height:1.5;
  font-weight:400;
  overflow-x:hidden;
  /* Rakamlar hizalı dursun, geri sayım titremesin (§13) */
  font-variant-numeric:tabular-nums;
}

h1,h2,h3{ font-family:var(--bas); font-weight:500; margin:0; }

/* --- Düzen: tek sütun, sola hizalı, en fazla 520px (§13) --- */
.kabuk{
  max-width:var(--en);
  margin:0 auto;
  padding:
    calc(env(safe-area-inset-top) + 18px)
    var(--bosluk)
    calc(env(safe-area-inset-bottom) + 56px);
}

/* Bölümler karta bölünmez; üstten ince çizgiyle ayrılır (§13) */
.bolum{
  padding:22px 0;
  border-top:1px solid var(--cizgi);
}
.bolum:first-of-type{ border-top:0; padding-top:4px; }
.bolum[hidden]{ display:none; }

.bolum-bas{
  font-family:var(--bas);
  font-size:1.15rem;
  font-weight:500;
  margin:0 0 14px;
}
.bolum-bas .yan{
  font-family:var(--gov);
  font-size:.85rem;
  font-weight:400;
  color:var(--sonuk);
  margin-left:8px;
}

.sonuk{ color:var(--sonuk); font-size:.85rem; }

/* --- Düğmeler: köşe yarıçapı bir karardır, tam yuvarlak (§13) --- */
button{
  font-family:inherit;
  font-size:inherit;
  color:inherit;
  background:none;
  border:0;
  padding:0;
  cursor:pointer;
}
.dg{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:38px;
  padding:0 16px;
  border-radius:999px;
  border:1px solid var(--cizgi);
  background:transparent;
  color:var(--metin);
  font-size:.9rem;
  line-height:1;
  transition:border-color 160ms ease,color 160ms ease;
}
.dg:hover{ border-color:var(--sonuk); }
.dg-bir{ border-color:var(--vakit); }
.dg-sonuk{ color:var(--sonuk); font-size:.85rem; }
.dg[disabled]{ opacity:.45; cursor:default; }

:where(a,button,input,textarea,summary,[tabindex]):focus-visible{
  outline:2px solid var(--vakit);
  outline-offset:2px;
}

input,textarea{
  font-family:inherit;
  font-size:1rem;
  color:var(--metin);
  background:var(--yuzey);
  border:1px solid var(--cizgi);
  border-radius:0;
  padding:9px 11px;
  width:100%;
}
input::placeholder,textarea::placeholder{ color:var(--sonuk); }
input:focus,textarea:focus{ outline:none; border-color:var(--vakit); }

/* --- Ray: yalnızca plan ve namaz listelerinde (§13) --- */
.ray{
  list-style:none;
  margin:0;
  padding:0 0 0 18px;
  border-left:1px solid var(--cizgi);
}
.ray > li{ position:relative; }
.ray > li::before{
  content:"";
  position:absolute;
  left:-18px;
  top:var(--tirnak,17px);
  width:11px;
  height:1px;
  background:var(--cizgi);
}

.yukleniyor{ color:var(--sonuk); font-size:.85rem; }

/* --- §4 Namaz: şu anki vakit --------------------------------- */
.simdi{ margin:0 0 22px; }
.vakit-ad{
  font-family:var(--bas);
  font-size:2.6rem;
  line-height:1.04;
  font-weight:500;
  letter-spacing:-.015em;
  color:var(--vakit);
  transition:color var(--gecis) ease;
  margin:0 0 4px;
}
.vakit-ad.bos{ color:var(--sonuk); font-size:1.6rem; }
.kalan{ margin:0 0 12px; font-size:1rem; color:var(--metin); }
.kalan .sure{ color:var(--sonuk); }
.cubuk{
  height:2px;
  background:var(--cizgi);
  overflow:hidden;
}
.cubuk > i{
  display:block;
  height:2px;
  width:0;
  background:var(--vakit);
  transition:width 1000ms linear, background-color var(--gecis) ease;
}
@media (prefers-reduced-motion: reduce){ .cubuk > i{ transition:none; } }

/* --- §4 Namaz: beş vakit listesi (ray) ----------------------- */
.namaz-liste > li{
  --tirnak:20px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:8px 0;
  min-height:44px;
}
.namaz-liste > li + li{ border-top:1px solid var(--cizgi); }
.namaz-liste > li.aktif::before{ background:var(--vakit); width:14px; }
.n-saat{ color:var(--sonuk); font-size:.95rem; min-width:3.4em; }
.n-ad{ flex:1 1 auto; font-size:1rem; }
.namaz-liste > li.aktif .n-ad{ color:var(--vakit); }
.namaz-liste > li.gecmis .n-saat,
.namaz-liste > li.gecmis .n-ad{ color:var(--sonuk); }
.n-durum{
  font-size:.85rem;
  color:var(--sonuk);
  white-space:nowrap;
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:34px;
  padding:0 2px 0 10px;
  background:none;
  border:0;
}
.n-durum .nokta{
  width:7px; height:7px; border-radius:999px;
  border:1px solid var(--sonuk);
  flex:0 0 auto;
}
.n-durum.tamam{ color:var(--tamam); }
.n-durum.tamam .nokta{ background:var(--tamam); border-color:var(--tamam); }
.n-durum.kaza{ color:var(--tamam); }
.n-durum.kaza .nokta{ background:none; border-color:var(--tamam); }
.n-durum.eksik{ color:var(--eksik); }
.n-durum.eksik .nokta{ border-color:var(--eksik); }
.n-durum.eylem{
  border:1px solid var(--cizgi);
  border-radius:999px;
  padding:0 13px;
  color:var(--metin);
}
.n-durum.eylem:hover{ border-color:var(--sonuk); }
/* Kaçmış vakitler sessiz durur: beş tane çerçeveli düğme ekranı ağırlaştırıyor
   ve §5'in kaçınmamızı istediği suçluluk tonunu getiriyor. */
.n-durum.eylem-sessiz{ color:var(--sonuk); }
.n-durum.eylem-sessiz .nokta{ border-color:var(--eksik); }
.n-durum.eylem-sessiz:hover{ color:var(--metin); }

/* --- §5 Kaza: kuyruk, ceza puanı değil. Kırmızı yok, toplam yok. --- */
.kaza-liste{ list-style:none; margin:0; padding:0; }
.kaza-liste > li{
  display:flex;
  align-items:center;
  gap:12px;
  padding:7px 0;
  min-height:44px;
}
.kaza-liste > li + li{ border-top:1px solid var(--cizgi); }
.k-ad{ flex:0 0 auto; }
.k-sayi{ flex:1 1 auto; color:var(--sonuk); }

/* --- §9 / §12 Profil ve değerlendirme ------------------------ */
.deger-metin,.profil-metin{
  margin:0 0 14px;
  white-space:pre-wrap;
  line-height:1.55;
}
.profil-metin{ color:var(--sonuk); font-size:.95rem; }

/* --- §7 Etkinlikler ------------------------------------------ */
.etkinlik-liste{ list-style:none; margin:0; padding:0; }
.etkinlik-liste > li{
  display:flex; align-items:center; gap:12px;
  padding:7px 0; min-height:44px;
}
.etkinlik-liste > li + li{ border-top:1px solid var(--cizgi); }
.e-tarih{ flex:0 0 8.6em; color:var(--sonuk); font-size:.9rem; }
.e-ad{ flex:1 1 auto; }
.e-giris{ display:flex; gap:8px; align-items:center; margin-top:12px; }
.e-taslak{ display:flex; gap:8px; align-items:center; margin-top:12px; flex-wrap:wrap; }
.e-taslak input[type="date"]{ width:9.6em; flex:0 0 auto; }
.e-taslak input[type="time"]{ width:6.6em; flex:0 0 auto; }
.e-taslak input[type="text"]{ flex:1 1 8em; }

/* --- §11 Su: ince şerit. Vurgu rengi burada kullanılmaz (§13). --- */
.su-satir{ display:flex; align-items:center; gap:14px; }
.su-etiket{ flex:0 0 auto; color:var(--sonuk); font-size:.85rem; }
.su-serit{
  flex:1 1 auto;
  display:flex;
  gap:3px;
  padding:14px 0;              /* dokunma alanı; şeridin kendisi ince kalır */
  background:none;
  border:0;
  cursor:pointer;
  touch-action:manipulation;
  -webkit-user-select:none;
  user-select:none;
}
.su-serit i{
  flex:1 1 0;
  height:4px;
  background:var(--cizgi);
  transition:background-color 200ms ease;
}
.su-serit i.dolu{ background:var(--sonuk); }
.su-sayi{ flex:0 0 auto; color:var(--sonuk); font-size:.85rem; min-width:3.2em; text-align:right; }

/* --- §6 Plan: günün akışını gösteren ray --------------------- */
/* Izgara: not satırı başlığın altına, tam hizasına düşsün. */
.plan-liste > li{
  --tirnak:18px;
  display:grid;
  grid-template-columns:26px 3.6em 1fr;
  column-gap:11px;
  align-items:start;
  padding:4px 0 6px;
}
.plan-liste > li.yapildi .p-metin{ color:var(--sonuk); text-decoration:line-through; }
.plan-liste > li.yapildi .p-sure{ text-decoration:none; }
.p-isaret{
  grid-column:1; grid-row:1;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:26px; height:34px;
  margin-left:-4px;
}
.p-isaret .nokta{
  width:12px; height:12px;
  border-radius:999px;
  border:1px solid var(--sonuk);
  transition:background-color 160ms ease, border-color 160ms ease;
}
.p-isaret[aria-pressed="true"] .nokta{ background:var(--tamam); border-color:var(--tamam); }
.p-saat{ grid-column:2; grid-row:1; color:var(--sonuk); font-size:.95rem; padding-top:7px; }
.p-govde{
  grid-column:3; grid-row:1;
  text-align:left;
  padding:6px 0;
  line-height:1.35;
}
.p-baslik{ display:block; }
.p-gerekce{ display:block; color:var(--sonuk); font-size:.85rem; margin-top:2px; }
.p-sure{ color:var(--sonuk); font-size:.85rem; margin-left:6px; }

.p-not{ grid-column:3; grid-row:2; display:flex; align-items:center; gap:10px; margin:2px 0 8px; }
.p-not input{ flex:1 1 auto; font-size:.9rem; padding:7px 10px; }
.p-notozet{
  grid-column:3; grid-row:2;
  display:block;
  color:var(--sonuk);
  font-size:.85rem;
  margin:1px 0 2px;
}
.plan-alt{ display:flex; align-items:center; gap:10px; margin-top:16px; flex-wrap:wrap; }
.plan-ekle{ display:flex; gap:8px; align-items:center; margin-top:14px; }
.plan-ekle input[type="time"]{ width:6.6em; flex:0 0 auto; }
.plan-ekle input[type="text"]{ flex:1 1 auto; }
.plan-bos{ color:var(--sonuk); font-size:.9rem; margin:0 0 4px; }

.namaz-alt{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-top:14px;
}
.hata{ color:var(--eksik); font-size:.85rem; margin:10px 0 0; }

.gizli{
  position:absolute; width:1px; height:1px;
  padding:0; margin:-1px; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap; border:0;
}
</style>
</head>
<body>
<main class="kabuk">

  <!-- §3.1 Namaz vakitleri — en üstte, her zaman görünür -->
  <section id="b-namaz" class="bolum" aria-label="Namaz vakitleri">
    <p class="yukleniyor">Vakitler alınıyor…</p>
  </section>

  <!-- §3.2 Kaza borcu — borç yoksa bölümün tamamı gizli (§5) -->
  <section id="b-kaza" class="bolum" aria-label="Kaza borcu" hidden></section>

  <!-- §3.3 Su -->
  <section id="b-su" class="bolum" aria-label="Su"></section>

  <!-- §3.4 Bugünün planı -->
  <section id="b-plan" class="bolum" aria-label="Bugünün planı"></section>

  <!-- §3.5 Yaklaşan etkinlikler -->
  <section id="b-etkinlik" class="bolum" aria-label="Yaklaşan etkinlikler" hidden></section>

  <!-- §3.6 Sohbet -->
  <section id="b-sohbet" class="bolum" aria-label="Sohbet"></section>

  <!-- §3.7 Gün sonu değerlendirmesi -->
  <section id="b-degerlendirme" class="bolum" aria-label="Gün sonu değerlendirmesi"></section>

  <!-- Ayarlar -->
  <section id="b-ayar" class="bolum" aria-label="Ayarlar"></section>

</main>

<script>
"use strict";
/* ===============================================================
   Ledger — tek dosya uygulama. Veri telefonda kalır (§2).
   =============================================================== */

const UYG = {};
window.__uyg = UYG;

/* --- Depolama ------------------------------------------------- */
const ANAHTAR = "ledger/v1";

const VARSAYILAN = {
  surum: 1,
  konum: null,                                              // {lat,lng,kaynak,zaman}
  vakitler: {},                                             // "tarih|lat,lng" -> ham vakitler
  gunler: {},                                               // "YYYY-MM-DD" -> gün kaydı
  borc: { sabah:0, ogle:0, ikindi:0, aksam:0, yatsi:0 },    // §5
  islenmisVakitler: [],                                     // §5 — "tarih|vakit"
  sonKontrol: null,
  profil: "",                                               // §9
  etkinlikler: [],                                          // §7
  sohbet: [],                                               // §10
  ayar: {}
};

function yukle(){
  try{
    const ham = localStorage.getItem(ANAHTAR);
    if(!ham) return structuredClone(VARSAYILAN);
    return Object.assign(structuredClone(VARSAYILAN), JSON.parse(ham));
  }catch(e){
    console.warn("Depo okunamadı, sıfırdan başlanıyor.", e);
    return structuredClone(VARSAYILAN);
  }
}
function kaydet(){
  try{ localStorage.setItem(ANAHTAR, JSON.stringify(UYG.veri)); }
  catch(e){ console.warn("Depoya yazılamadı.", e); }
}

/* --- Tarih yardımcıları --------------------------------------- */
const iki = n => String(n).padStart(2,"0");
const tarihAnahtar = d => d.getFullYear()+"-"+iki(d.getMonth()+1)+"-"+iki(d.getDate());

/* §4 Gece kayması: yerel saat 04:00'ten önceyse hâlâ dünü gösteririz. */
const GECE_SINIRI = 4;
function uygulamaGunu(simdi){
  const d = new Date(simdi || Date.now());
  if(d.getHours() < GECE_SINIRI) d.setDate(d.getDate() - 1);
  return tarihAnahtar(d);
}

/* --- Vurgu rengi (§13) ---------------------------------------- */
const VAKIT_RENK = {
  sabah:"#6E7FB8", ogle:"#E8C468", ikindi:"#E09A4F", aksam:"#D46A5C", yatsi:"#4A5C8C"
};
let sonRenk = null;
function vurguyuAyarla(vakitAnahtar){
  const renk = VAKIT_RENK[vakitAnahtar] || VAKIT_RENK.yatsi;
  if(renk === sonRenk) return;
  document.documentElement.style.setProperty("--vakit", renk);
  sonRenk = renk;
}

/* ===============================================================
   §4 — Namaz modülü
   =============================================================== */

/* --- Konum ---------------------------------------------------- */
const BURSA = { lat:40.1826, lng:29.0665, kaynak:"varsayilan" };

function konumuKullan(){
  const k = UYG.veri.konum;
  return (k && typeof k.lat === "number") ? k : BURSA;
}

/* İzin yoksa son bilinen konum, o da yoksa Bursa (§4).
   Konum önbelleğe alınır; her açılışta sorulmaz. */
function konumSor(zorla){
  return new Promise(cozum => {
    if(!("geolocation" in navigator)) return cozum(konumuKullan());
    if(!zorla && UYG.veri.konum) return cozum(UYG.veri.konum);
    navigator.geolocation.getCurrentPosition(
      p => {
        UYG.veri.konum = {
          lat: +p.coords.latitude.toFixed(4),
          lng: +p.coords.longitude.toFixed(4),
          kaynak: "cihaz",
          zaman: Date.now()
        };
        kaydet();
        cozum(UYG.veri.konum);
      },
      () => cozum(konumuKullan()),
      { enableHighAccuracy:false, timeout:9000, maximumAge:6*3600*1000 }
    );
  });
}

/* --- Vakit verisi --------------------------------------------- */
const ALADHAN = "https://api.aladhan.com/v1/timings/";
const ALANLAR = ["Fajr","Sunrise","Dhuhr","Asr","Maghrib","Isha"];

function ddmmyyyy(t){ const p = t.split("-"); return p[2]+"-"+p[1]+"-"+p[0]; }
function gunKaydir(t, adim){
  const p = t.split("-").map(Number);
  const d = new Date(p[0], p[1]-1, p[2]);
  d.setDate(d.getDate() + adim);
  return tarihAnahtar(d);
}
function saatDate(tarih, hhmm){
  const t = tarih.split("-").map(Number);
  const s = String(hhmm).split(":").map(Number);
  return new Date(t[0], t[1]-1, t[2], s[0], s[1], 0, 0);
}

function vakitAnahtari(tarih, konum){
  return tarih + "|" + konum.lat + "," + konum.lng;
}

/* Uçak modunda çökmemek için her cevap önbelleğe yazılır (§14). */
async function vakitGetir(tarih, konum){
  const anh = vakitAnahtari(tarih, konum);
  const onbellek = UYG.veri.vakitler[anh];
  if(onbellek) return onbellek;

  const url = ALADHAN + ddmmyyyy(tarih) +
    "?latitude=" + konum.lat + "&longitude=" + konum.lng + "&method=13";
  const cevap = await fetch(url, { cache:"no-store" });
  if(!cevap.ok) throw new Error("aladhan " + cevap.status);
  const veri = await cevap.json();
  const ham = veri && veri.data && veri.data.timings;
  if(!ham) throw new Error("vakit verisi boş geldi");

  const temiz = {};
  for(const a of ALANLAR){
    if(!ham[a]) throw new Error("eksik alan: " + a);
    temiz[a] = String(ham[a]).split(" ")[0];   // "05:01 (+03)" -> "05:01"
  }
  UYG.veri.vakitler[anh] = temiz;
  vakitleriBuda();
  kaydet();
  return temiz;
}

/* Geriye dönük tarama (§5) 60 güne kadar gidebilir. Gün gün sorsak 60 istek olurdu;
   takvim uç noktası bir ayı tek seferde verir. */
async function ayGetir(ay, konum){          // ay: "2026-09"
  const p = ay.split("-");
  const url = "https://api.aladhan.com/v1/calendar/" + p[0] + "/" + Number(p[1]) +
    "?latitude=" + konum.lat + "&longitude=" + konum.lng + "&method=13";
  const cevap = await fetch(url, { cache:"no-store" });
  if(!cevap.ok) throw new Error("aladhan takvim " + cevap.status);
  const veri = await cevap.json();
  const gunler = veri && veri.data;
  if(!Array.isArray(gunler)) throw new Error("takvim verisi boş geldi");

  for(const g of gunler){
    const gr = g.date && g.date.gregorian && g.date.gregorian.date;   // "DD-MM-YYYY"
    if(!gr || !g.timings) continue;
    const q = gr.split("-");
    const tarih = q[2] + "-" + q[1] + "-" + q[0];
    const temiz = {};
    let tam = true;
    for(const a of ALANLAR){
      if(!g.timings[a]){ tam = false; break; }
      temiz[a] = String(g.timings[a]).split(" ")[0];
    }
    if(tam) UYG.veri.vakitler[vakitAnahtari(tarih, konum)] = temiz;
  }
  vakitleriBuda();
  kaydet();
}

/* İstenen günlerin hepsi önbellekte olsun. Eksikler ay ay çekilir. */
async function vakitleriHazirla(tarihler, konum){
  const eksik = tarihler.filter(t => !UYG.veri.vakitler[vakitAnahtari(t, konum)]);
  if(!eksik.length) return true;

  const aylar = [...new Set(eksik.map(t => t.slice(0,7)))];
  for(const ay of aylar){
    try{ await ayGetir(ay, konum); }
    catch(e){ console.warn("ay alınamadı: " + ay, e); }
  }
  // Takvim tutmadıysa kalanları tek tek dene.
  for(const t of tarihler){
    if(UYG.veri.vakitler[vakitAnahtari(t, konum)]) continue;
    try{ await vakitGetir(t, konum); }catch(e){ /* aşağıda eksik sayılır */ }
  }
  return tarihler.every(t => UYG.veri.vakitler[vakitAnahtari(t, konum)]);
}

/* Önbellek sonsuza kadar büyümesin: en fazla 80 gün tutulur. */
function vakitleriBuda(){
  const anahtarlar = Object.keys(UYG.veri.vakitler);
  if(anahtarlar.length <= 80) return;
  anahtarlar.sort();
  for(const a of anahtarlar.slice(0, anahtarlar.length - 80)) delete UYG.veri.vakitler[a];
}

/* --- Vakit aralıkları (§4) ------------------------------------ */
const VAKITLER = [
  { a:"sabah",  ad:"Sabah",  bas:"Fajr",    bit:"Sunrise" },
  { a:"ogle",   ad:"Öğle",   bas:"Dhuhr",   bit:"Asr"     },
  { a:"ikindi", ad:"İkindi", bas:"Asr",     bit:"Maghrib" },
  { a:"aksam",  ad:"Akşam",  bas:"Maghrib", bit:"Isha"    },
  { a:"yatsi",  ad:"Yatsı",  bas:"Isha",    bit:null      }   // ertesi günün Fajr'ı
];

function araliklar(tarih, bugunku, ertesi){
  return VAKITLER.map(v => ({
    a: v.a,
    ad: v.ad,
    bas: saatDate(tarih, bugunku[v.bas]),
    bit: v.bit ? saatDate(tarih, bugunku[v.bit])
               : saatDate(gunKaydir(tarih,1), ertesi.Fajr)
  }));
}

/* Güneş ile öğle arası: aktif vakit yoktur (§4). */
function aktifAralik(liste, an){
  for(const v of liste) if(an >= v.bas && an < v.bit) return v;
  return null;
}
function siradakiAralik(liste, an){
  for(const v of liste) if(an < v.bas) return v;
  return null;
}

/* --- Gün kaydı ------------------------------------------------ */
function gunKaydi(tarih){
  let g = UYG.veri.gunler[tarih];
  if(!g){
    g = UYG.veri.gunler[tarih] = { namaz:{}, maddeler:[], su:0, gununNotu:"" };
  }
  if(!g.namaz) g.namaz = {};
  return g;
}

/* Üç durum: yok · "vaktinde" · "kaza" (§4). Hepsi geri alınabilir.
   Vakti kapanmış ve taramadan geçmiş bir namazın işareti değişirse borç da
   değişir — §5: "Bugünün geçmiş bir vaktini kaza olarak işaretlemek de aynı
   sayacı düşürür." Geri alma da simetrik olarak sayacı geri yükler. */
function namazIsaretle(tarih, vakit, durum){
  const g     = gunKaydi(tarih);
  const eski  = g.namaz[vakit] || null;
  if(durum) g.namaz[vakit] = durum;
  else delete g.namaz[vakit];

  if(islenmisMi(tarih, vakit)){
    if(!eski && durum) borcDegistir(vakit, -1);
    else if(eski && !durum) borcDegistir(vakit, +1);
  }

  kaydet();
  namazCiz();
  kazaCiz();
}

/* --- Süre biçimi ---------------------------------------------- */
function sureMetni(ms){
  if(ms < 0) ms = 0;
  const dk = Math.floor(ms / 60000);
  const sa = Math.floor(dk / 60);
  const kdk = dk % 60;
  if(sa > 0) return sa + " sa " + kdk + " dk";
  if(dk > 0) return dk + " dk";
  return Math.max(0, Math.floor(ms/1000)) + " sn";
}

/* --- Çizim ---------------------------------------------------- */
const $namaz = document.getElementById("b-namaz");

function namazCiz(){
  const d = UYG.namaz;
  if(!d || !d.liste){
    $namaz.innerHTML = '<p class="yukleniyor">Vakitler alınıyor…</p>' +
      (d && d.hata ? '<p class="hata">' + kacir(d.hata) + '</p>' : '');
    return;
  }

  const an     = new Date();
  const aktif  = aktifAralik(d.liste, an);
  const sonra  = siradakiAralik(d.liste, an);
  const kayit  = gunKaydi(d.tarih).namaz;

  vurguyuAyarla(aktif ? aktif.a : (UYG.namaz.sonAktif || "yatsi"));
  if(aktif) UYG.namaz.sonAktif = aktif.a;

  let ust;
  if(aktif){
    const kalan = aktif.bit - an;
    const oran  = Math.max(0, Math.min(1, kalan / (aktif.bit - aktif.bas)));
    ust =
      '<div class="simdi">' +
        '<h1 class="vakit-ad">' + aktif.ad + '</h1>' +
        '<p class="kalan">çıkmasına <span class="sure">' + sureMetni(kalan) + '</span></p>' +
        '<div class="cubuk" role="presentation"><i style="width:' + (oran*100).toFixed(2) + '%"></i></div>' +
      '</div>';
  } else if(sonra){
    ust =
      '<div class="simdi">' +
        '<h1 class="vakit-ad bos">sıradaki: ' + sonra.ad + ' ' + ss(sonra.bas) + '</h1>' +
        '<p class="kalan"><span class="sure">' + sureMetni(sonra.bas - an) + '</span> sonra</p>' +
      '</div>';
  } else {
    ust = '<div class="simdi"><h1 class="vakit-ad bos">vakitler yükleniyor</h1></div>';
  }

  const satirlar = d.liste.map(v => {
    const durum  = kayit[v.a];
    const gecmis = an >= v.bit;
    const suAn   = aktif && aktif.a === v.a;

    let dugme;
    if(durum === "vaktinde"){
      dugme = '<button class="n-durum tamam" data-geri="' + v.a + '" title="geri al">' +
              '<span class="nokta"></span>vaktinde</button>';
    } else if(durum === "kaza"){
      dugme = '<button class="n-durum kaza" data-geri="' + v.a + '" title="geri al">' +
              '<span class="nokta"></span>kaza</button>';
    } else if(gecmis){
      dugme = '<button class="n-durum eylem-sessiz" data-kaza="' + v.a + '">' +
              '<span class="nokta"></span>kaza kıldım</button>';
    } else if(an >= v.bas){
      dugme = '<button class="n-durum eylem" data-kildim="' + v.a + '">kıldım</button>';
    } else {
      dugme = '<span class="n-durum"></span>';
    }

    const sinif = (suAn ? "aktif " : "") + (gecmis && !durum ? "gecmis" : "");
    return '<li class="' + sinif.trim() + '">' +
             '<span class="n-saat">' + ss(v.bas) + '</span>' +
             '<span class="n-ad">' + v.ad + '</span>' +
             dugme +
           '</li>';
  }).join("");

  const konum = konumuKullan();
  const konumMetni = konum.kaynak === "cihaz" ? "konumuna göre" : "Bursa'ya göre";

  $namaz.innerHTML =
    ust +
    '<ul class="ray namaz-liste">' + satirlar + '</ul>' +
    '<div class="namaz-alt">' +
      '<span class="sonuk">' + konumMetni + (d.eski ? " · kayıtlı vakitler" : "") + '</span>' +
      '<button class="dg dg-sonuk" id="konum-yenile">konumu güncelle</button>' +
    '</div>' +
    (d.hata ? '<p class="hata">' + kacir(d.hata) + '</p>' : '');
}

function ss(d){ return iki(d.getHours()) + ":" + iki(d.getMinutes()); }
function kacir(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

/* Tıklamalar — liste her çizimde yenilendiği için olay delegasyonu. */
$namaz.addEventListener("click", e => {
  const d = e.target.closest("button");
  if(!d || !UYG.namaz) return;
  const t = UYG.namaz.tarih;
  if(d.dataset.kildim) namazIsaretle(t, d.dataset.kildim, "vaktinde");
  else if(d.dataset.kaza) namazIsaretle(t, d.dataset.kaza, "kaza");
  else if(d.dataset.geri) namazIsaretle(t, d.dataset.geri, null);
  else if(d.id === "konum-yenile") konumSor(true).then(() => namazKur(true));
});

/* --- Kurulum -------------------------------------------------- */
async function namazKur(yeniden){
  const tarih = uygulamaGunu();
  const konum = konumuKullan();
  UYG.namaz = UYG.namaz || {};
  UYG.namaz.tarih = tarih;

  try{
    const bugunku = await vakitGetir(tarih, konum);
    const ertesi  = await vakitGetir(gunKaydir(tarih, 1), konum);   // yatsının bitişi için
    UYG.namaz.liste = araliklar(tarih, bugunku, ertesi);
    UYG.namaz.hata  = null;
    UYG.namaz.eski  = false;
  }catch(err){
    console.warn("vakitler alınamadı", err);
    // Ağ yoksa aynı tarihe ait başka bir konumun önbelleği varsa onu kullan.
    const yedek  = enYakinOnbellek(tarih);
    const yedek2 = enYakinOnbellek(gunKaydir(tarih, 1));
    if(yedek && yedek2){
      UYG.namaz.liste = araliklar(tarih, yedek, yedek2);
      UYG.namaz.eski  = true;
      UYG.namaz.hata  = "Ağ yok; kayıtlı vakitler gösteriliyor.";
    }else if(!UYG.namaz.liste){
      UYG.namaz.hata = "Vakitler alınamadı. Bağlantı gelince yenilenecek.";
    }
  }
  namazCiz();
  if(!yeniden) namazSaati();
}

function enYakinOnbellek(tarih){
  for(const anh of Object.keys(UYG.veri.vakitler)){
    if(anh.indexOf(tarih + "|") === 0) return UYG.veri.vakitler[anh];
  }
  return null;
}

/* Saniyede bir yeniden çiz; gün veya vakit değişince yeniden kur. */
function namazSaati(){
  setInterval(() => {
    if(!UYG.namaz || !UYG.namaz.liste) return;
    const yeniGun = uygulamaGunu();
    if(yeniGun !== UYG.namaz.tarih){ namazKur(true); return; }
    const son = UYG.namaz.liste[UYG.namaz.liste.length - 1];
    if(new Date() >= son.bit){ namazKur(true); return; }
    namazCiz();
  }, 1000);
}

/* ===============================================================
   §5 — Kaza borcu (birikimli)
   =============================================================== */

const TARAMA_GUN = 60;                      // daha eskisine bakılmaz (§5)

function islenmisAnahtar(tarih, vakit){ return tarih + "|" + vakit; }
function islenmisMi(tarih, vakit){
  return UYG.veri.islenmisVakitler.indexOf(islenmisAnahtar(tarih, vakit)) !== -1;
}
function borcDegistir(vakit, delta){
  const b = UYG.veri.borc;
  b[vakit] = Math.max(0, (b[vakit] || 0) + delta);   // sıfırın altına inmez (§5)
}
function toplamBorc(){
  return VAKITLER.reduce((t, v) => t + (UYG.veri.borc[v.a] || 0), 0);
}

/* İşlenmiş liste de sonsuza kadar büyümesin. */
function islenmisBuda(bugun){
  const sinir = gunKaydir(bugun, -(TARAMA_GUN + 5));
  UYG.veri.islenmisVakitler = UYG.veri.islenmisVakitler.filter(a => a.split("|")[0] >= sinir);
}

/**
 * Son kontrolden şimdiye kadar kapanmış bütün vakitleri tarar.
 * `islenmisVakitler` sayesinde aynı vakit iki kez sayılmaz — bu liste olmadan
 * uygulamayı günde beş kez açan biri beş kat borç görür (§5).
 */
async function borcTara(){
  const bugun = uygulamaGunu();
  const konum = konumuKullan();
  const an    = new Date();

  // İlk açılış: kurulumdan önceki vakitler borç sayılmaz. Bugünün kapanmış
  // vakitleri borç eklemeden "işlenmiş" yazılır, borç sıfırdan başlar.
  const ilkAcilis = !UYG.veri.sonKontrol;
  const basla = ilkAcilis
    ? bugun
    : (UYG.veri.sonKontrol < gunKaydir(bugun, -TARAMA_GUN)
        ? gunKaydir(bugun, -TARAMA_GUN)
        : UYG.veri.sonKontrol);

  const gunler = [];
  for(let t = basla; t <= bugun; t = gunKaydir(t, 1)) gunler.push(t);

  // Yatsının bitişi için son günün ertesi de gerekir.
  const gerekli = gunler.concat([gunKaydir(bugun, 1)]);
  const tamam = await vakitleriHazirla(gerekli, konum);

  let eklenen = 0;
  for(const t of gunler){
    const bugunku = UYG.veri.vakitler[vakitAnahtari(t, konum)];
    const ertesi  = UYG.veri.vakitler[vakitAnahtari(gunKaydir(t,1), konum)];
    if(!bugunku || !ertesi) continue;                 // veri yoksa bu gün atlanır

    const kayit = (UYG.veri.gunler[t] && UYG.veri.gunler[t].namaz) || {};
    for(const v of araliklar(t, bugunku, ertesi)){
      if(an < v.bit) continue;                        // vakit henüz tamamen kapanmadı
      const anh = islenmisAnahtar(t, v.a);
      if(UYG.veri.islenmisVakitler.indexOf(anh) !== -1) continue;
      UYG.veri.islenmisVakitler.push(anh);
      if(!kayit[v.a] && !ilkAcilis){ borcDegistir(v.a, +1); eklenen++; }
    }
  }

  // Bütün günler çözülemediyse sonKontrol ilerletilmez; bağlantı gelince tekrar denenir.
  if(tamam) UYG.veri.sonKontrol = bugun;
  else if(ilkAcilis) UYG.veri.sonKontrol = bugun;     // ilk açılışta yine de başlat

  islenmisBuda(bugun);
  kaydet();
  kazaCiz();
  if(eklenen) console.info("kaza borcuna eklenen vakit:", eklenen);
}

/* --- Çizim ---------------------------------------------------- */
const $kaza = document.getElementById("b-kaza");

function kazaCiz(){
  if(toplamBorc() === 0){                             // borç yoksa bölüm hiç görünmez (§5)
    $kaza.hidden = true;
    $kaza.innerHTML = "";
    return;
  }
  $kaza.hidden = false;

  const satirlar = VAKITLER
    .filter(v => (UYG.veri.borc[v.a] || 0) > 0)       // borcu olmayan tür listede yok (§5)
    .map(v =>
      '<li>' +
        '<span class="k-ad">' + v.ad + '</span>' +
        '<span class="k-sayi">' + UYG.veri.borc[v.a] + '</span>' +
        '<button class="dg dg-sonuk" data-ode="' + v.a + '">kaza kıldım</button>' +
      '</li>')
    .join("");

  $kaza.innerHTML =
    '<h2 class="bolum-bas">Kaza</h2>' +
    '<ul class="kaza-liste">' + satirlar + '</ul>';
}

$kaza.addEventListener("click", e => {
  const d = e.target.closest("[data-ode]");
  if(!d) return;
  borcDegistir(d.dataset.ode, -1);                    // kullanıcı kaza kıldı
  kaydet();
  kazaCiz();
});

/* ===============================================================
   §9 + §12 — profil ve gün sonu değerlendirmesi (api/review.js)
   =============================================================== */

const $deger = document.getElementById("b-degerlendirme");
const $ayar  = document.getElementById("b-ayar");
let degerMesaj = "", ayarMesaj = "";

async function modelIste(uc, govde){
  const cevap = await fetch("api/" + uc, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(govde)
  });
  if(cevap.status === 503){
    UYG.veri.ayar.yapayZeka = false; kaydet();
    throw new Error("anahtar-yok");
  }
  if(!cevap.ok){
    const h = await cevap.json().catch(() => ({}));
    const hata = new Error(h.mesaj || "Model cevap vermedi.");
    hata.kullaniciya = true;
    throw hata;
  }
  return cevap.json();
}
function hataMetni(e, varsayilan){
  if(e.message === "anahtar-yok") return "Yapay zeka kapalı (GEMINI_API_KEY tanımlı değil).";
  return e.kullaniciya ? e.message : varsayilan;
}

/* --- Gün sonu değerlendirmesi --------------------------------- */
async function degerlendir(){
  const tarih = uygulamaGunu();
  UYG.degerBekliyor = true;
  degerMesaj = "";
  degerCiz();
  try{
    const c = await modelIste("review", {
      tur: "gun",
      tarih: tarih,
      gunAdi: gunAdi(tarih),
      profil: UYG.veri.profil || "",
      son14: son14Gun(gunKaydir(tarih, 1))     // bugünü de kapsasın
    });
    const g = gunKaydi(tarih);
    g.degerlendirme = c.metin || "";
    kaydet();
  }catch(e){
    console.warn("değerlendirme alınamadı", e);
    degerMesaj = hataMetni(e, "Değerlendirme alınamadı.");
  }finally{
    UYG.degerBekliyor = false;
    degerCiz();
  }
}

function degerCiz(){
  const g = gunKaydi(uygulamaGunu());
  $deger.innerHTML =

/* Haftada bir kendiliğinden; yeterli kayıt yoksa hiç denenmez. */

  if(UYG.veri.ayar.yapayZeka === false) return false;

  return !son || son <= gunKaydir(uygulamaGunu(), -PROFIL_ARALIK);

/* ===============================================================
   §7 — Etkinlikler
   =============================================================== */

const AYLAR = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran",
               "Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];

const $etkinlik = document.getElementById("b-etkinlik");
let etkinlikTaslak = null;    // model eksik bıraktıysa kullanıcı tamamlar
let etkinlikMesaj  = "";
let etkinlikAcik   = false;

function tarihYaz(t){
  if(!t) return "";
  const p = t.split("-").map(Number);
  return p[2] + " " + AYLAR[p[1]-1];
}

function etkinlikKaydet(e){
  const kayit = {
    id: yeniId(),
    tarih: e.tarih,
    saat: e.saat || "",
    sure: e.sure || 0,
    baslik: e.baslik
  };
  UYG.veri.etkinlikler.push(kayit);
  // Geçmiş etkinlikler birikmesin.
  const sinir = gunKaydir(uygulamaGunu(), -30);
  UYG.veri.etkinlikler = UYG.veri.etkinlikler.filter(x => x.tarih >= sinir);

  // Bugüne düşen etkinlik doğrudan bugünün planına girer (§7).
  if(kayit.tarih === uygulamaGunu()){
    const g = gunKaydi(kayit.tarih);
    g.maddeler.push({
      id: yeniId(), saat: kayit.saat, sure: kayit.sure || null,
      baslik: kayit.baslik, tur: "etkinlik", gerekce: "",
      yapildi: false, not: "", etkinlikId: kayit.id
    });
  }
  kaydet();
  etkinlikCiz();
  planCiz();
  return kayit;
}

function etkinlikSil(id){
  UYG.veri.etkinlikler = UYG.veri.etkinlikler.filter(e => e.id !== id);
  for(const t of Object.keys(UYG.veri.gunler)){
    const g = UYG.veri.gunler[t];
    if(g.maddeler) g.maddeler = g.maddeler.filter(m => m.etkinlikId !== id);
  }
  kaydet();
  etkinlikCiz();
  planCiz();
}

/* Serbest metni api/parse.js ile çevirir. Model emin değilse alanı boş
   bırakır ve kullanıcı doldurur; tahmin ettirilmez (§7). */
async function etkinlikCozumle(metin){
  etkinlikMesaj = "";
  etkinlikAcik  = true;
  const bugun = uygulamaGunu();

  if(UYG.veri.ayar.yapayZeka === false){
    etkinlikTaslak = { tarih:"", saat:"", sure:0, baslik:metin.slice(0,80) };
    etkinlikMesaj  = "Yapay zeka kapalı; tarihi ve saati elle gir.";
    etkinlikCiz();
    return;
  }

  UYG.etkinlikCozuluyor = true;
  etkinlikCiz();
  try{
    const cevap = await fetch("api/parse", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ metin: metin, bugun: bugun })
    });
    if(cevap.status === 503){ UYG.veri.ayar.yapayZeka = false; kaydet(); throw new Error("anahtar-yok"); }
    if(!cevap.ok){
      const h = await cevap.json().catch(() => ({}));
      const hata = new Error(h.mesaj || "Etkinlik çözümlenemedi."); hata.kullaniciya = true; throw hata;
    }
    const e = await cevap.json();

    if(e.tarih && e.baslik){
      etkinlikKaydet(e);
      etkinlikTaslak = null;
      etkinlikAcik = false;
      etkinlikMesaj = "";
    }else{
      etkinlikTaslak = { tarih:e.tarih||"", saat:e.saat||"", sure:e.sure||0,
                         baslik:e.baslik || metin.slice(0,80) };
      etkinlikMesaj = "Eksik kalan yeri doldur.";
    }
  }catch(err){
    console.warn("etkinlik çözümlenemedi", err);
    etkinlikTaslak = { tarih:"", saat:"", sure:0, baslik:metin.slice(0,80) };
    etkinlikMesaj = err.message === "anahtar-yok"
      ? "Yapay zeka kapalı; tarihi ve saati elle gir."
      : (err.kullaniciya ? err.message : "Çözümlenemedi; elle gir.");
  }finally{
    UYG.etkinlikCozuluyor = false;
    etkinlikCiz();
  }
}

function etkinlikCiz(){
  const bugun = uygulamaGunu();
  const liste = yaklasanEtkinlikler(bugun);

  // Etkinlik yoksa ve giriş kapalıysa bölüm hiç görünmez (§3).
  if(!liste.length && !etkinlikAcik){
    $etkinlik.hidden = true;
    $etkinlik.innerHTML = "";
    return;
  }
  $etkinlik.hidden = false;

  const satirlar = liste.map(e =>
    '<li>' +
      '<span class="e-tarih">' + tarihYaz(e.tarih) + (e.saat ? " · " + e.saat : "") + '</span>' +
      '<span class="e-ad">' + kacir(e.baslik) + '</span>' +
      '<button class="dg dg-sonuk" data-esil="' + e.id + '">sil</button>' +
    '</li>').join("");

  const taslak = etkinlikTaslak
    ? '<div class="e-taslak">' +
        '<input type="date" id="e-tarih" value="' + kacir(etkinlikTaslak.tarih) + '" aria-label="tarih">' +
        '<input type="time" id="e-saat" value="' + kacir(etkinlikTaslak.saat) + '" aria-label="saat">' +
        '<input type="text" id="e-ad" value="' + kacir(etkinlikTaslak.baslik) + '" aria-label="etkinlik" placeholder="ne">' +
        '<button class="dg" id="e-onay">kaydet</button>' +
        '<button class="dg dg-sonuk" id="e-vazgec">vazgeç</button>' +
      '</div>'
    : etkinlikAcik
      ? '<div class="e-giris">' +
          '<input type="text" id="e-metin" placeholder="12 Eylül saat 14\'te berber randevum var" ' +
            'autocomplete="off" aria-label="etkinlik">' +
          '<button class="dg" id="e-coz"' + (UYG.etkinlikCozuluyor ? " disabled" : "") + '>' +
            (UYG.etkinlikCozuluyor ? "çözülüyor…" : "ekle") + '</button>' +
        '</div>'
      : "";

  $etkinlik.innerHTML =
    '<h2 class="bolum-bas">Yaklaşan</h2>' +
    (liste.length ? '<ul class="etkinlik-liste">' + satirlar + '</ul>' : "") +
    taslak +
    (etkinlikMesaj ? '<p class="sonuk" style="margin:8px 0 0">' + kacir(etkinlikMesaj) + '</p>' : "");
}

$etkinlik.addEventListener("click", e => {
  const d = e.target.closest("button");
  if(!d) return;
  if(d.dataset.esil) etkinlikSil(d.dataset.esil);
  else if(d.id === "e-coz") etkinlikGirisGonder();
  else if(d.id === "e-onay") etkinlikTaslakKaydet();
  else if(d.id === "e-vazgec"){
    etkinlikTaslak = null; etkinlikAcik = false; etkinlikMesaj = ""; etkinlikCiz();
  }
});
$etkinlik.addEventListener("keydown", e => {
  if(e.key !== "Enter") return;
  if(e.target.id === "e-metin"){ e.preventDefault(); etkinlikGirisGonder(); }
  else if(e.target.id === "e-ad" || e.target.id === "e-tarih" || e.target.id === "e-saat"){
    e.preventDefault(); etkinlikTaslakKaydet();
  }
});

function etkinlikGirisGonder(){
  const alan = document.getElementById("e-metin");
  if(!alan || !alan.value.trim()) return;
  etkinlikCozumle(alan.value.trim());
}
function etkinlikTaslakKaydet(){
  const t = document.getElementById("e-tarih");
  const s = document.getElementById("e-saat");
  const a = document.getElementById("e-ad");
  if(!t || !a) return;
  if(!t.value || !a.value.trim()){
    etkinlikMesaj = "Tarih ve ad gerekli.";
    etkinlikCiz();
    return;
  }
  etkinlikKaydet({ tarih:t.value, saat:s ? s.value : "", sure:etkinlikTaslak.sure,
                   baslik:a.value.trim() });
  etkinlikTaslak = null;
  etkinlikAcik = false;
  etkinlikMesaj = "";
  etkinlikCiz();
}
function etkinlikGirisAc(){
  etkinlikAcik = true;
  etkinlikTaslak = null;
  etkinlikMesaj = "";
  etkinlikCiz();
  const alan = document.getElementById("e-metin");
  if(alan) alan.focus();
}

/* ===============================================================
   §11 — Su takibi
   =============================================================== */

const BARDAK    = 250;                       // ml
const SU_HEDEFI = 10;                        // 2,5 litre

const $su = document.getElementById("b-su");

function suDegistir(delta){
  const g = gunKaydi(uygulamaGunu());
  g.su = Math.max(0, Math.min(SU_HEDEFI, (g.su || 0) + delta));
  kaydet();
  suCiz();
}

/* Şerit bir kez kurulur, sonra yerinde güncellenir. Her dokunuşta yeniden
   çizersek düğme düğümü yok olur: hızlı dokunuşlar kaybolur, klavye odağı düşer. */
function suCiz(){
  const adet = gunKaydi(uygulamaGunu()).su || 0;

  if(!document.getElementById("su-serit")){
    let serit = "";
    for(let i = 0; i < SU_HEDEFI; i++) serit += "<i></i>";
    // Hedefe ulaşınca kutlama yok; şerit dolar, o kadar (§11).
    $su.innerHTML =
      '<div class="su-satir">' +
        '<span class="su-etiket">Su</span>' +
        '<button class="su-serit" id="su-serit">' + serit + '</button>' +
        '<span class="su-sayi" id="su-sayi"></span>' +
      '</div>';
  }

  const serit = document.getElementById("su-serit");
  const kutu  = serit.querySelectorAll("i");
  for(let i = 0; i < kutu.length; i++) kutu[i].className = i < adet ? "dolu" : "";
  serit.setAttribute("aria-label",
    "Su: " + adet + " bardak. Dokun bir bardak ekle, uzun bas geri al.");
  document.getElementById("su-sayi").textContent =
    (adet * BARDAK / 1000).toFixed(2).replace(".", ",") + " L";
}

/* Dokun: bir bardak ekle. Uzun bas: geri al. Klavyede geri almak için
   odaktayken sol ok veya geri silme — §13 klavye erişimi. */
(function suOlaylari(){
  let zaman = null, uzunOldu = false;
  const seritMi = e => e.target.closest("#su-serit");
  const birak   = () => { clearTimeout(zaman); zaman = null; };

  $su.addEventListener("pointerdown", e => {
    if(!seritMi(e)) return;
    uzunOldu = false;
    zaman = setTimeout(() => { uzunOldu = true; suDegistir(-1); }, 500);
  });
  $su.addEventListener("pointerup", e => {
    if(!seritMi(e)) return;
    birak();
    if(!uzunOldu) suDegistir(+1);
  });
  $su.addEventListener("pointerleave", birak);
  $su.addEventListener("pointercancel", birak);
  $su.addEventListener("contextmenu", e => { if(seritMi(e)) e.preventDefault(); });

  // Klavye: Enter/Boşluk ekler (detail 0 = fareyle değil), sol ok / geri silme azaltır.
  $su.addEventListener("click", e => { if(seritMi(e) && e.detail === 0) suDegistir(+1); });
  $su.addEventListener("keydown", e => {
    if(!seritMi(e)) return;
    if(e.key === "ArrowLeft" || e.key === "Backspace"){ e.preventDefault(); suDegistir(-1); }
  });
})();

/* ===============================================================
   §6 — Günlük plan (yapay zeka olmadan çalışan kısmı)
   =============================================================== */

const TURLER = ["uyku","spor","yemek","kod","kitap","ingilizce","kurs",
                "etkinlik","namaz","ev","bos"];

const $plan = document.getElementById("b-plan");
let acikNot = null;                          // not alanı açık olan maddenin id'si

function yeniId(){
  return "m" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
}
function saatSirala(maddeler){
  // Saatsiz maddeler sona: boş dize aksi halde 08:00'in önüne geçer.
  return maddeler.slice().sort((a,b) => (a.saat || "99:99").localeCompare(b.saat || "99:99"));
}
function maddeBul(id){
  const g = gunKaydi(uygulamaGunu());
  return (g.maddeler || []).find(m => m.id === id);
}

/* --- Değişiklikler -------------------------------------------- */
function maddeEkle(saat, baslik, tur){
  const g = gunKaydi(uygulamaGunu());
  g.maddeler.push({
    id: yeniId(),
    saat: saat || "",
    sure: null,
    baslik: String(baslik || "").trim(),
    tur: TURLER.indexOf(tur) === -1 ? "bos" : tur,
    gerekce: "",
    yapildi: false,
    not: "",
    elle: true
  });
  kaydet();
  planCiz();
}
function maddeSil(id){
  const g = gunKaydi(uygulamaGunu());
  g.maddeler = g.maddeler.filter(m => m.id !== id);
  if(acikNot === id) acikNot = null;
  kaydet();
  planCiz();
}
function maddeIsaretle(id){
  const m = maddeBul(id);
  if(!m) return;
  m.yapildi = !m.yapildi;
  kaydet();
  planCiz();
}
function maddeNot(id, metin){
  const m = maddeBul(id);
  if(!m) return;
  m.not = String(metin || "").trim();
  kaydet();
}

/* §6 — Ağ yoksa veya model cevap vermezse son planı kopyala, tarihi güncelle.
   Boş ekran gösterme. */
function sonPlanliGun(bugun){
  const gunler = Object.keys(UYG.veri.gunler)
    .filter(t => t < bugun && UYG.veri.gunler[t].maddeler && UYG.veri.gunler[t].maddeler.length)
    .sort();
  return gunler.length ? gunler[gunler.length - 1] : null;
}
function planKopyala(){
  const bugun = uygulamaGunu();
  const kaynak = sonPlanliGun(bugun);
  if(!kaynak) return false;
  const g = gunKaydi(bugun);
  g.maddeler = UYG.veri.gunler[kaynak].maddeler.map(m => ({
    id: yeniId(),
    saat: m.saat, sure: m.sure, baslik: m.baslik, tur: m.tur,
    gerekce: "", yapildi: false, not: "", kopya: kaynak
  }));
  g.gununNotu = "";
  g.planKaynak = "kopya";
  kaydet();
  return true;
}

/* --- Çizim ---------------------------------------------------- */
function planCiz(){
  const bugun = uygulamaGunu();
  const g = gunKaydi(bugun);
  const maddeler = saatSirala(g.maddeler || []);

  const satirlar = maddeler.map(m => {
    const acik = acikNot === m.id;
    const sure = m.sure ? '<span class="p-sure">' + m.sure + ' dk</span>' : "";
    const ger  = m.gerekce ? '<span class="p-gerekce">' + kacir(m.gerekce) + '</span>' : "";

    return '<li class="' + (m.yapildi ? "yapildi" : "") + '">' +
      '<button class="p-isaret" data-yap="' + m.id + '" aria-pressed="' + (m.yapildi ? "true" : "false") +
        '" aria-label="' + kacir(m.baslik) + ' — işaretle"><span class="nokta"></span></button>' +
      '<span class="p-saat">' + kacir(m.saat || "") + '</span>' +
      '<button class="p-govde" data-ac="' + m.id + '" aria-expanded="' + (acik ? "true" : "false") + '">' +
        '<span class="p-baslik"><span class="p-metin">' + kacir(m.baslik) + '</span>' + sure + '</span>' + ger +
      '</button>' +
      (acik
        ? '<div class="p-not">' +
            '<input type="text" data-not="' + m.id + '" value="' + kacir(m.not || "") + '" ' +
              'placeholder="not: nasıl geçti?" autocomplete="off">' +
            '<button class="dg dg-sonuk" data-sil="' + m.id + '">sil</button>' +
          '</div>'
        : (m.not ? '<span class="p-notozet">' + kacir(m.not) + '</span>' : "")) +
    '</li>';
  }).join("");

  const gununNotu = g.gununNotu
    ? '<p class="sonuk" style="margin:0 0 14px">' + kacir(g.gununNotu) + '</p>' : "";

  const kaynak = g.planKaynak === "kopya" ? "dünün planından"
               : g.planKaynak === "model" ? "" : "";
  const hak = planHakki(bugun);

  $plan.innerHTML =
    '<h2 class="bolum-bas">Bugün' +
      (kaynak ? '<span class="yan">' + kaynak + '</span>' : "") +
    '</h2>' +
    gununNotu +
    (UYG.planUretiliyor
      ? '<p class="plan-bos">Plan üretiliyor…</p>'
      : maddeler.length
        ? '<ul class="ray plan-liste">' + satirlar + '</ul>'
        : '<p class="plan-bos">Bugün için madde yok.</p>') +
    '<div class="plan-ekle">' +
      '<input type="time" id="p-saat" aria-label="saat">' +
      '<input type="text" id="p-baslik" aria-label="madde" placeholder="madde ekle" autocomplete="off">' +
      '<button class="dg" id="p-ekle">ekle</button>' +
    '</div>' +
    '<div class="plan-alt">' +
      '<button class="dg dg-sonuk" id="p-uret"' + (UYG.planUretiliyor || hak <= 0 ? " disabled" : "") + '>' +
        (maddeler.length ? "planı yeniden üret" : "plan üret") +
      '</button>' +
      '<button class="dg dg-sonuk" id="p-etkinlik">etkinlik ekle</button>' +
      (hak < PLAN_SINIR && hak > 0 ? '<span class="sonuk">' + hak + ' hak kaldı</span>' : "") +
      (planMesaj ? '<span class="sonuk">' + kacir(planMesaj) + '</span>' : "") +
    '</div>';
}

/* --- Olaylar -------------------------------------------------- */
$plan.addEventListener("click", e => {
  const d = e.target.closest("button");
  if(!d) return;
  if(d.dataset.yap) maddeIsaretle(d.dataset.yap);
  else if(d.dataset.sil) maddeSil(d.dataset.sil);
  else if(d.dataset.ac){
    acikNot = (acikNot === d.dataset.ac) ? null : d.dataset.ac;
    planCiz();
    const alan = $plan.querySelector("[data-not]");
    if(alan) alan.focus();
  }
  else if(d.id === "p-ekle") planEkleGonder();
  else if(d.id === "p-uret") planUret(true);
  else if(d.id === "p-etkinlik") etkinlikGirisAc();
});

$plan.addEventListener("change", e => {
  if(e.target.dataset && e.target.dataset.not) maddeNot(e.target.dataset.not, e.target.value);
});
$plan.addEventListener("keydown", e => {
  if(e.key !== "Enter") return;
  if(e.target.dataset && e.target.dataset.not){
    maddeNot(e.target.dataset.not, e.target.value);
    acikNot = null;
    planCiz();
  }else if(e.target.id === "p-baslik" || e.target.id === "p-saat"){
    e.preventDefault();
    planEkleGonder();
  }
});

function planEkleGonder(){
  const saat   = document.getElementById("p-saat");
  const baslik = document.getElementById("p-baslik");
  if(!baslik || !baslik.value.trim()) return;
  maddeEkle(saat ? saat.value : "", baslik.value);
  const yeni = document.getElementById("p-baslik");
  if(yeni) yeni.focus();
}

/* ===============================================================
   §6 + §12 — plan üretimi (api/plan.js)
   =============================================================== */

/* §1 — kurs saatleri sabittir. 0 pazar … 6 cumartesi. */
const KURS = {
  1: { bas:"18:00", bit:"22:00" },   // pazartesi
  2: { bas:"19:00", bit:"22:00" },   // salı
  3: { bas:"18:00", bit:"22:00" },   // çarşamba
  4: { bas:"19:00", bit:"22:00" }    // perşembe
};
const GUN_ADI = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];

function gunNesnesi(tarih){
  const p = tarih.split("-").map(Number);
  return new Date(p[0], p[1]-1, p[2]);
}
function kursSaati(tarih){ return KURS[gunNesnesi(tarih).getDay()] || null; }
function gunAdi(tarih){ return GUN_ADI[gunNesnesi(tarih).getDay()]; }

/* §9 — kısa vadeli katman: son 14 günün ham kaydı, notlarıyla birlikte. */
function son14Gun(bugun){
  const liste = [];
  for(let i = 14; i >= 1; i--){
    const t = gunKaydir(bugun, -i);
    const g = UYG.veri.gunler[t];
    if(!g) continue;
    const namaz = Object.keys(g.namaz || {}).map(k => k + ":" + g.namaz[k]).join(" ");
    liste.push({
      tarih: t,
      gunAdi: gunAdi(t),
      namaz: namaz || "işaretlenmemiş",
      su: g.su || 0,
      maddeler: (g.maddeler || []).map(m => ({
        saat: m.saat, baslik: m.baslik, yapildi: !!m.yapildi, not: m.not || ""
      }))
    });
  }
  return liste;
}

/* §7 — bugünden itibaren yaklaşan etkinlikler. */
function yaklasanEtkinlikler(bugun){
  return (UYG.veri.etkinlikler || [])
    .filter(e => e && e.tarih >= bugun)
    .sort((a,b) => (a.tarih + (a.saat||"")).localeCompare(b.tarih + (b.saat||"")))
    .slice(0, 10);
}

function bugununVakitleri(){
  const d = UYG.namaz && UYG.namaz.liste;
  if(!d) return null;
  const o = {};
  d.forEach(v => { o[v.ad] = ss(v.bas) + "–" + ss(v.bit); });
  return o;
}

/* §12 — aynı gün için plan üretimi günde en fazla üç kez.
   Sunucu durumsuz olduğu için sayaç istemcide tutulur. */
const PLAN_SINIR = 3;
function planHakki(tarih){
  const s = UYG.veri.ayar.planSayaci || {};
  return PLAN_SINIR - (s[tarih] || 0);
}
function planHakkiDus(tarih){
  const s = UYG.veri.ayar.planSayaci || (UYG.veri.ayar.planSayaci = {});
  s[tarih] = (s[tarih] || 0) + 1;
  for(const k of Object.keys(s)) if(k < gunKaydir(tarih, -7)) delete s[k];
}

let planMesaj = "";

async function planUret(elle){
  const tarih = uygulamaGunu();
  if(planHakki(tarih) <= 0){
    planMesaj = "Bugün için plan üretme hakkı doldu (günde " + PLAN_SINIR + " kez).";
    planCiz();
    return false;
  }

  UYG.planUretiliyor = true;
  planMesaj = "";
  planCiz();

  try{
    const cevap = await fetch("api/plan", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        tarih: tarih,
        gunAdi: gunAdi(tarih),
        kurs: kursSaati(tarih),
        vakitler: bugununVakitleri(),
        etkinlikler: yaklasanEtkinlikler(tarih),
        profil: UYG.veri.profil || "",
        son14: son14Gun(tarih),
        borc: UYG.veri.borc
      })
    });

    if(cevap.status === 503){                       // anahtar yok (§12)
      UYG.veri.ayar.yapayZeka = false;
      kaydet();
      throw new Error("anahtar-yok");
    }
    if(!cevap.ok){
      const h = await cevap.json().catch(() => ({}));
      const hata = new Error(h.mesaj || "Plan üretilemedi.");
      hata.kullaniciya = true;                      // sunucunun kendi cümlesi
      throw hata;
    }

    const plan = await cevap.json();
    planHakkiDus(tarih);

    const g = gunKaydi(tarih);
    g.maddeler = (plan.maddeler || []).map(m => ({
      id: yeniId(),
      saat: m.saat || "", sure: m.sure || null,
      baslik: m.baslik, tur: m.tur || "bos", gerekce: m.gerekce || "",
      yapildi: false, not: ""
    }));
    g.gununNotu = plan.gununNotu || "";
    g.planKaynak = "model";
    UYG.veri.ayar.yapayZeka = true;
    kaydet();
    return true;

  }catch(e){
    console.warn("plan üretilemedi", e);

    // Nedeni her durumda koru: yedeğe düşerken kota/anahtar mesajını yutmayalım.
    const neden = e.message === "anahtar-yok"
      ? "Yapay zeka kapalı (GEMINI_API_KEY tanımlı değil)."
      : (e.kullaniciya ? e.message : "Plan üretilemedi.");

    // Ağ yoksa veya model cevap vermezse son planı kopyala; boş ekran yok (§6).
    const g = gunKaydi(tarih);
    if(!g.maddeler || !g.maddeler.length){
      planMesaj = planKopyala()
        ? neden + " Dünün planı kopyalandı."
        : neden + " Maddeleri elle ekleyebilirsin.";
    }else if(elle){
      planMesaj = neden;
    }
    return false;

  }finally{
    UYG.planUretiliyor = false;
    planCiz();
  }
}

function planHazirla(){
  const tarih = uygulamaGunu();
  const g = gunKaydi(tarih);
  planCiz();
  if(g.maddeler && g.maddeler.length) return;       // bugünün planı zaten var
  if(UYG.veri.ayar.yapayZeka === false){            // anahtar yok, denemeyelim
    if(planKopyala()) planMesaj = "Dünün planı kopyalandı.";
    planCiz();
    return;
  }
  planUret(false);
}

/* --- Açılış --------------------------------------------------- */
function baslat(){
  UYG.veri  = yukle();
  UYG.bugun = uygulamaGunu();
  vurguyuAyarla("yatsi");

  kazaCiz();
  suCiz();
  planCiz();
  etkinlikCiz();
  degerCiz();
  ayarCiz();

  // Plan üretimi vakitleri de gönderir (§6), o yüzden namazKur'dan sonra.
  namazKur().then(borcTara).then(planHazirla).then(() => {
    if(profilZamaniMi()) profilGuncelle();          // haftada bir (§9)
  });
  konumSor(false).then(k => {                   // izin gelirse konuma göre tazele
    if(k && k.kaynak === "cihaz") namazKur(true).then(borcTara);
  });
}
baslat();

  addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(e => console.warn("sw kaydedilemedi", e));
  });
}
